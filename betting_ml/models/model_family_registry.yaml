# =============================================================================
# Model-FAMILY registry — the NAMED AUTHORITY for what production serves (NF-G0)
# =============================================================================
# ⛔ NOT a second registry. This file uses the SAME governance shape as the baseball sub-model
# registry (`betting_ml/sub_model_registry.yaml`): the promotion state machine is literally the
# same object, imported by both from `betting_ml/governance/registry.py`, and a guard test asserts
# the identity so the two families cannot drift into two vocabularies.
#
# KEY: <model_family>__<target>__<served_version>. The VERSION is part of the key so a champion and
# its challenger can coexist — keyed on (family, target) alone, staging a challenger would OVERWRITE
# the champion and destroy the `fallback_artifact_uri` that makes the promotion reversible.
#
# PROMOTION STATE MACHINE (shared):
#   pending → challenger  (artifact built + staged; NOTHING published)
#   challenger → champion (every gate cleared + a NAMED human review)  ← "champion" == SERVED
#   champion → deprecated (superseded, or rolled back)
#
# COMPOSITE LINEAGE: the served board is a STACK whose members version independently — MVP-1's
# calibrated point LEVEL, NF1.5's learned ORDER over it, the rookie leg, and a 3-way interval family
# (rookie NF1.8 / veteran NF1.9 / K-DST NF1.6). `served_version` is the family's version-of-record;
# the `*_model_version` fields say what it is MADE of. A single `model_version` field cannot express
# that, and a stale ordering version stamped over a fresh level model reads as one coherent release
# while being two.
#
# ⚠️ WHEN THIS FILE AND AN ARTIFACT STAMP DISAGREE, THAT IS A GATE FAILURE — never a silent "trust
# the artifact". That is the KP-V2.0 lesson as code: the MLB K-props model has no registry entry, so
# its version-of-record lives only in code + an S3 path and reconciliation is structurally
# impossible. Anything on this registry always has a third party to reconcile against.
#
# 🚀 DEPLOY: this file ships with the BOX IMAGE on merge to `main` (the MH2.1 mechanic — merging IS
# the deploy, with no gate between merge and serve). Edit it through
# `betting_ml/scripts/model_governance.py`, not by hand, so every write is schema-validated.
# =============================================================================

