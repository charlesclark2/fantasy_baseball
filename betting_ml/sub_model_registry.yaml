    oracle_floor: enforced
  uncertainty: parameter                    # the starter-EB wiring story MUST recalibrate before pricing (E13.6)
  best_alpha: 0
  promotion_status: pending                 # real S3 bake-off DONE 2026-07-27; "pending" = not yet a served prior (the wiring story promotes)
  promoted_at: null
  ablation_report: quant_sports_intel_models/baseball/edge_program/ablation_results/e7_3p_milb_mle_pitchers.md
