  notes: |
    E7.5p (2026-07-27). Recalibrates milb_mle_pitcher_v1 into a priceable cold-start STARTER prior and
    wires gb_pct + k_pct/bb_pct (NOT hr_rate, NOT xwoba_against) into the SERVED eb_starter_posteriors
    (dbt DuckDB branch — the SF-free lakehouse compute). Three things differ from the E7.5 batter
    sibling ON PURPOSE. (1) A COLD-START GATE: the MLE applies only when n_prior_seasons = 0 (under 10
    career prior starts AND under 150 career prior BF); the E7.3p map is calibrated on a pitcher's first
    two MLB seasons, so feeding an established starter his old minor line would be out-of-distribution.
    (2) PER-METRIC EVIDENCE UNITS: κ counts binomial trials, so K%/BB% weight against batters faced and
    GB% against balls in play. (3) A NEW SERVED COLUMN eb_gb_pct — E7.3p's STRONGEST translation had no
    home (the starter EB table carried no batted-ball metric); it is populated for EVERY starter (MLE
    prior when cold-start, prior-season league anchor otherwise) and shrunk toward the pitcher's own
    prior-season GB% by BIP. ⚠️ EXPECTATION-SET: pitcher K% translates far more weakly than batter K%
    (0.366 vs 0.637), so the lift is MODEST and concentrated in GB% — the purged ablation bears that out
    (GB% MAE −23% vs the generic prior, K% −10%, BB% −8%; the batter K% was −27%). E13.6 recalibration:
    the E7.3p parameter sd was 5.8–7.8× too tight; σ_resid (held-out, highest-level, mlb_pa≥150 TBF floor
    + mlb_bip≥50 for GB) gives honest ~0.68–0.73 / ~0.90 coverage. 7,474 pitchers carry a prior (6,659 of
    them prospects). SF-FREE; a static W8a precursor view (fail-safe → empty view → generic prior if the
    parquet is absent, so a missing artifact never HALTs the serving-critical build). ⚠️ TRAIN/SERVE
    (the E7.9 class): the served starter-consuming models were TRAINED on the old generic-prior
    eb_k_pct/eb_bb_pct, so the cold-start rows they now see are drawn from a slightly different
    distribution — the fix is a retrain, tracked as follow-up, and it is also why eb_gb_pct is NOT yet
    joined into feature_pregame_starter_features. best_alpha = 0.
