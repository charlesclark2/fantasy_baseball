spec:
  description: >
    Ship-or-close the NCAAF cold-start mu correction as ONE pre-registered
    contrast: bucket_shift vs the served incumbent. VAL3 measured a real
    cold-start mu bias in weeks 1-3 (the exact window served for the 8/29
    opener slate: +2.074 pts over-bias, the correction removes 73% of it,
    8/8 folds, DSR 0.998, clears every ship clause) but was REFUSED by PBO —
    and the refusal was MEASURED to be a field-composition artifact (4
    near-identical correction forms; 2-arm PBO 0.000; eligible-set PBO 0.701,
    WORSE). The admissible successor is a SINGLE coherent contrast registered
    FORWARD on the parsimony/mechanism argument (VAL2's by-week decay is
    approximately a constant; linear_decay bought nothing) — PBO then
    INAPPLICABLE (n_arms < 2), remaining gates already clearing on the VAL3
    record. ONE arm, one foil — no ladder, no HPO (tied-field lesson: nothing
    to search). best_alpha=0; market-blind; this changes calibration honesty
    for served probabilities, not any edge claim.
    TIMING (PM ruling 2026-08-23, supersedes the card's 2026-08-22 deferral):
    the STUDY runs now (free slot, disjoint repo area); the SHIP decision is
    separately gated — see acceptanceCriteria. Default remains deploy-held to
    post-opener unless the parity condition passes AND the operator approves
    a pre-opener ship.
  acceptanceCriteria:
    - description: >
        Pre-register BEFORE scoring (E2.1-r): the bucket definition, the
        shift estimator, the single contrast (bucket_shift vs incumbent),
        and the selection metric (the registered proper score — CRPS /
        log-score per the VAL3 record) with the standing gates. A null is a
        valid outcome and closes cleanly.
    - description: >
        NO delta-scaling: over_scale topped VAL3's leaderboard but the
        PAIRED read is a TIE (+0.0070, 5/8, p=0.779) — inadmissible-lambda;
        the rank cannot tell a tie from a win.
    - description: >
        CLV-eval hazard: if ANY vs-close reading is reported, use the
        _clv_leg-immune implementation and STATE which implementation
        produced it — the row-misaligned _clv_eval (reset_index positional
        bug) is a recorded INC and must not be resurrected.
    - description: >
        Reproduction: VAL1's pin is vintage-bound to 2026-08-22 (4,187
        closes) while the main checkout holds 07-22 (4,182) — running
        VAL1/2/3 from main HALTs correctly; run `--assemble` first (~6s),
        with `--form strength_posterior` (stage_finalize defaults to
        gaussian) and `--calib-out` (writes no served artifact).
    - description: >
        SHIP GATING (two-step): (a) if the contrast clears, a pre-opener
        ship is permitted ONLY if the S1-serve-class train/serve parity
        holds — check the SERVED artifact contract directly (no pace-style
        ship-vs-serve gap; don't assume), AND the operator explicitly
        approves; (b) otherwise DEPLOY-HELD with the gap named, ship
        post-opener via the P1.4 serve path. Either way nothing serves from
        this session's hands.
    - description: >
        Scope guard: the +0.557 residual (estimator can't track a rising
        level) belongs to a SEPARATE future lead (drift-aware estimator, the
        card's lead B) — do NOT bundle it here.
