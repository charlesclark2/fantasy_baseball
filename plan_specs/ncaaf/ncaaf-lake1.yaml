apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: ncaaf-lake1
  vertical: ncaaf
  card: (PM to card — worker sessions never create Trello cards)
  status: IN_PROGRESS
spec:
  description: >
    Replace `query_lake`'s ERROR-MESSAGE MATCH for "this Delta table does not
    exist yet" with an INDEPENDENT existence check, and pin duckdb to the tested
    range. The marker set ("InvalidTableLocationError", "Path does not exist")
    was verified empirically when written; delta-kernel has since changed that
    text to "No files in log segment", so the classifier silently stopped
    recognising an absent table — measured live on the BOX (duckdb 1.5.5) and the
    laptop (1.5.3). Because `game_prediction_snapshot.write_snapshot` reads its
    table back BEFORE its first-ever write (correctly — the never-lose-a-prior-week
    contract), a never-written table became UNBOOTSTRAPPABLE: NCAAF-PS could not
    create `game_prediction_snapshots` or `futures_board_snapshots`, which in turn
    blocked NCAAF-P3.1's runtime gate and the whole forward track record.
    Nothing ships or serves here; this is a correctness fix to a shared reader.
    best_alpha=0 (unchanged, and untouched by this story).
  acceptanceCriteria:
    - description: >
        An unclassified lake read error is resolved by an INDEPENDENT STATE
        CHECK, not by matching the engine's message: LIST `<table>/_delta_log/`
        with MaxKeys=1. ZERO keys ⇒ the table genuinely does not exist yet
        (return None); ONE OR MORE ⇒ the table exists, so the error is something
        else and it RE-RAISES. This FAILS SAFE on the hazard the narrow marker set
        existed to protect against: a read-after-write visibility blip means the
        log file IS present, so the listing finds it and we raise — never a
        licence to overwrite. S3 list-after-write has been strongly consistent
        since Dec 2020, so the check is not itself a race.
    - description: >
        The retired `MISSING_TABLE_MARKERS` message-match path is REMOVED, not
        left as a fallback. A dead fallback that message-matches is the same bomb
        on a longer fuse (PM ruling, execution order §2).
    - description: >
        MH2.7 applies — this is a SHARED instrument. Every guard that pins its
        behaviour is RE-ANCHORED onto the new implementation with the same
        properties and wider coverage, never weakened or deleted:
        `betting_ml/tests/ncaaf_ps_red_proof.py`,
        `betting_ml/tests/test_ncaaf_odds_recurring_capture.py`,
        `betting_ml/tests/test_ncaaf_p3_1_serving.py`,
        `betting_ml/tests/ncaaf_p3_1_red_proof.py`.
    - description: >
        TWO-SIDED proofs, both RED-proven: a fake ABSENT table returns None, and a
        fake PRESENT-but-unreadable table RAISES. A classifier that can only be
        shown to say "absent" is the vacuous half of the guard (NF1.7 (a)).
    - description: >
        duckdb is PINNED to the tested range in `pyproject.toml`, with a comment
        naming THIS incident, so the next person who loosens it knows the cost
        (PM ruling Q3 — folded into this PR, not standalone).
    - description: >
        CLAUDE.md gains the transferable lesson as its own commit in this PR
        (PM ruling, execution order §3).
---
