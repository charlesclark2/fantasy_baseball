      - "NF-INC-0914 (IN FLIGHT) — a separate NFL entrypoint NameError; different job, different class; disjoint files unless the census proves a shared-resource link."
      - "NCAAF-P1.2W (Done) — added the weekly refit schedule; a new tenant in the box's calendar; census candidate, not a suspect by default."
      - "Leaf-run detector (ZPmBj8PF, To Do) — the daily_ingestion_job census idea; a contention finding here EXTENDS that scope rather than forking it."
