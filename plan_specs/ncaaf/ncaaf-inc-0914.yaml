# Plan spec — NCAAF-INC-0914 (MINI, incident: the ncaaf dbt build run was FORCIBLY marked
# failed by the run monitor — no traceback in the alert; resource-kill class, cause unknown)
# Authored by PM 2026-09-14. Diagnose-first: the email carries no stack trace, so the first
# deliverable is the measured cause from Dagit/box reads (operator paste-ready), not a fix.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: ncaaf-inc-0914
  vertical: ncaaf
  card: https://trello.com/c/l8Rjkh8j
  status: IN_PROGRESS
spec:
  description: >
    sports_ncaaf_dbt_build_job run 06d7352c-5744-4902-b42d-a0c8aa4a43ba
    FAILED on the box (tier WARN/peripheral) with Dagster's forcible-
    failure text: "This job is being forcibly marked as failed. The
    computational resources created by the run may not have been fully
    cleaned up." That is the RUN MONITOR killing a hung or dead run
    worker (OOM, worker crash, or exceeded max runtime) — NOT a dbt
    model error, and the email has no traceback. Two consequences:
    (1) NCAAF marts feed live serving and the P1.2W weekly refit, so a
    non-building tier silently ages what users see; (2) a forcible
    kill is a BOX-RESOURCE symptom before it is an NCAAF symptom — the
    same box runs the MLB W3pre intraday tier (measured near its
    budget; LAKE2's compaction may have been applied today), the NFL
    publish path, and P1.2W's weekly schedule. best_alpha=0; no model
    or serving change; no budget constant, tier cap, or run-monitor
    timeout is raised to make the symptom go away without the measured
    cause in hand (E2.1-r applies to resource limits too).
  acceptanceCriteria:
    - description: >
        DIAGNOSE FROM EVIDENCE, operator paste-ready, before any code:
        (a) the Dagit run page for 06d7352c — step logs, which step was
        executing when killed, wall-clock at kill vs the job's
        historical durations; (b) the box's state at that timestamp —
        dmesg/journal for OOM-killer lines naming the process, memory/
        load history if available; (c) the CONCURRENCY census: every
        Dagster run and cron job active on the box in the window
        (the W3pre tick? the LAKE2 compaction --apply? the NFL publish?
        P1.2W?) — name what overlapped, with timestamps from logs, not
        inference. The finding names ONE of: OOM (and the culprit
        process), runtime exceeded (and why — data growth? lock/
        contention? a hung query), worker crash (and its trace), or
        monitor misfire. If the evidence cannot distinguish, say so
        and state what instrumentation would — do not pick a story.
    - description: >
        FIX MINIMALLY, matched to the measured cause at the
        instrument (MH2.7): contention -> schedule/serialization fix
        (mirror the :00-collision discipline), memory -> the specific
        query/model's footprint (never a blanket box upgrade decision
        — that is an operator spend call, surfaced with arithmetic if
        it is truly the answer), hang -> the specific wait, with a
        guard. A retry-on-force-kill band-aid without the cause is
        refused. Whatever the fix, the run-monitor's kill behavior
        itself stays — it did its job.
    - description: >
        RESTORE + VERIFY: re-run the dbt build (operator, paste-ready)
        and verify the marts ADVANCED by content timestamp (INC-41 —
        never mtimes); confirm downstream freshness SLAs for the NCAAF
        tables read green at their owning cadence; if the P1.2W weekly
        refit or the ratings snapshot consumed a stale mart in the
        gap, say which artifacts carry the staleness and whether the
        next scheduled fire self-heals or needs a manual re-run
        (state both paths, recommend one).
    - description: >
        CLOSE THE CLASS where the evidence supports it: if the cause
        is cross-job contention on the box, the finding feeds the
        standing resource picture (one census of what runs when —
        check whether the leaf-run detector card ZPmBj8PF or the
        BOX_OPERATIONS doc already owns this and EXTEND, never fork a
        second schedule ledger); a "forcibly marked failed" alert that
        names no cause is itself an instrument gap worth one line in
        the closeout. Any guard added is RED-proven (unique anchors +
        baseline-pass + NOT-SELECTED + resolve-every-node). Standing:
        worktree; PR -> dev; box ops operator-run; >2-min commands
        operator paste-ready; no schedule/.env change without the
        operator step stated; no gate loosened; no Trello; findings to
        closeout.followUps; roadmap files frozen.
---
