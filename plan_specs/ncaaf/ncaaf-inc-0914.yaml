apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: ncaaf-inc-0914-plan
spec:
  goalRef: { name: ncaaf-inc-0914 }
  graph:
    nodes: []   # MINI incident — evidence reads (operator) -> named cause -> minimal matched fix -> restore + freshness verify -> class/census feed -> closeout
  closeout:
    verdict: SHIPPED
    followUps: |
      PM triages into: checklist item on the parent card | merge into an existing
      card (name it) | a new spec. Worker sessions never create Trello cards.

      ══ VERDICT ══════════════════════════════════════════════════════════════
      CAUSE MEASURED. The 2026-09-14 18:00:15Z Orchestration-CD deploy (PR #1121,
      merged 18:00:11Z) recreated `dagster-codeloc` — code server AND run worker —
      while run 06d7352c's subprocess (pid 693) was 1 s into its first dbt command.
      The drain that authorised the recreate probed at 18:00:23 while the run was in
      STARTING; its GraphQL filter lists STARTED only. Run created 18:00:00.70,
      STARTING 18:00:09.44, STARTED 18:00:47.67, last log 18:00:48.12, then silence
      until the 4 h cap fired at 22:01:20 (wall 14432.8 s = 14400 + one monitor tick).
      ⛔ NOT OOM: dmesg + journal empty across 17:30-22:30, OOMKilled=false, 3.1/15.7 GB
      used — and mechanically ruled out anyway (the code server's own
      `_check_for_orphaned_runs` fails a dead-subprocess run within one cleanup tick,
      with an exit code; 4 h of silence is not that shape).
      SERVING IMPACT: none measurable. `sports_ncaaf_roll_forward_job` (13:00:45) and
      `sports_ncaaf_strength_refit_job` (14:30:27) both ran the IDENTICAL
      `ncaaf.staging` + `ncaaf.marts` selectors, both SUCCESS, both after the 09-13
      game day; `dim_ncaaf_game` holds completed games through 2026-09-13 (the most
      recent CFB game day). ⚠️ both are MONDAY-ONLY jobs — on any other gate-open day
      the 18:00 build is the only NCAAF rebuild. Self-heal confirmed: the 09-15 tick
      fired and the game-day gate correctly skipped. No restore run needed.
      FIX: (a) the drain now counts every NON-TERMINAL run and branches on
      `__typename` (a GraphQL-level PythonError had still degraded to a silent 0 —
      the INC-36 class one layer deeper); (b) both sports dbt builds gained
      `dagster/max_runtime` (10800 s, DERIVED from the legs) + a SHARED
      `concurrency_group`. Guards RED-proven 7/7. Docs:
      docs/ncaaf_inc_0914_evidence_reads.md (§0 verdict, §7 fix, §8 verify).

      ══ PM RULINGS (2026-09-15) — all four decisions, reasoning as given ═════
      Prompt: docs/ncaaf_inc_0914_pm_decisions.md

      D1 = B, FAIL-AND-ATTRIBUTE. PM: "Ratified on your own load-bearing fact:
        every in-flight run is a subprocess of the recreated container, so
        'non-terminal before the recreate' => dead is true by construction, not by
        heuristic — which is what makes B safe to automate. C is refuted by INC-36's
        own record (a long-blocked deploy raced two deploys), and D is explicitly
        refused: it is INC-36's root cause re-proposed, and E2.1-r forbids raising a
        bound to make a symptom vanish — record the refusal with both citations so it
        stays refused."
        ⛔ D (raise DRAIN_TIMEOUT) IS REFUSED, and the refusal is recorded with BOTH
        citations so a future reader cannot re-propose it as new: (i) INC-36 — a
        deploy parked in the drain for its full DRAIN_TIMEOUT is what pushed it past
        the CD poll budget and let a second deploy race it; (ii) E2.1-r — a bound is
        not raised to make a symptom vanish. ⛔ C (refuse the deploy) likewise refused
        on INC-36's record.
        SHIPPED, with all three PM constraints met:
          * the failure event NAMES the deploy AND the commit SHA (a bare FAILED would
            reproduce the cause-free alert one layer down — verified by rendering the
            message and asserting the SHA is in it);
          * the victim set is SNAPSHOTTED PRE-TEARDOWN (deploy.sh §4b) and never
            re-derived after (§7b iterates only that list), so a run the NEW worker
            started is untouchable. RED-proven: "the victim snapshot moves AFTER the
            recreate" -> RED.
          * ⭐ ONE DELIBERATE NARROWING OF THE PM'S WORDING, flagged rather than taken
            silently: the PM said "non-terminal before the recreate", and the DOOMED
            set is narrower than that — STARTING+STARTED only. The load-bearing fact
            holds for runs with a WORKER PROCESS; a QUEUED/NOT_STARTED run is a ROW IN
            POSTGRES, it SURVIVES the recreate untouched and the new daemon launches it
            moments later, so marking it failed would be a FALSE attribution against a
            live, working run — the mirror image of the defect being fixed. CANCELING
            is excluded too (already being terminated deliberately; crediting its death
            to the deploy would be wrong). The DRAIN still WAITS on the full
            non-terminal set; only ATTRIBUTION is narrowed. Both halves RED-proven, incl.
            a clause that the doomed set must be a STRICT SUBSET of the drain set so a
            later tidy-up cannot "unify" them.
        ⏭️ RUNTIME GATE OPEN — see the operator procedure in
        docs/ncaaf_inc_0914_evidence_reads.md §10. CI mocks all IO, so the criterion is
        NOT met until it has run on the box.

      D2 = B, ORPHANED-RUN DETECTOR — FUNDED AS ITS OWN STORY, card OA5e6TT8. NOT
        built in this session, by ruling. PM: "the gap is the absent liveness check,
        not the ceiling's value, so no timeout can do better than bound the mystery;
        and the incident's decisive table — three detection latencies from one event,
        differing only by what instrumentation each job happened to carry — is exactly
        the argument that detection should be a property of the box, not a per-job
        accident." Option C (swap the run launcher) REFUSED: "DefaultRunLauncher's
        subprocess model was a deliberate cost choice, and we don't swap launchers to
        acquire one property."
        ⚠️ THE 3-HOUR BOUND IS THE INTERIM RECORDED STATE, NOT THE ACCEPTED END STATE.

      D3 = KEEP the shared concurrency_group in this PR. PM: "It's small, RED-proven,
        and armed on a calendar trigger (the next day both game-day gates open), which
        makes splitting it out a scheduling risk with zero offsetting benefit."
        Requirement 1 (recorded in the PR description AND here): ⭐ THIS IS A SECOND,
        DISTINCT DEFECT FOUND BY THE CENSUS — NOT A RIDER ON THE INCIDENT'S CAUSE. The
        incident's cause is the drain's blind spot; the shared DuckDB file is an
        independent latent collision that the concurrency census surfaced while
        investigating, and it has never fired. Two causes, not one.
        Requirement 2, QUEUE-BEHAVIOUR VERIFICATION (measured, not reasoned):
          * ⭐ QUEUE TIME DOES NOT COUNT AGAINST `dagster/max_runtime` — and this
            incident is its own proof. `check_run_timeout` reads `run_record.start_time`
            (set at PIPELINE_START, after dequeue), not `create_timestamp`: run 06d7352c
            was CREATED 18:00:00.70 and STARTED 18:00:47.67, and the kill landed at
            22:01:20.14 = start+14400+tick, NOT create+14400. The 47 s it spent queued
            was excluded. So a build queued behind its sibling cannot trip its own
            10800 s ceiling.
          * worst-case added wait = the sibling's whole runtime: NFL measured 192.6 s
            (2026-09-15 18:00:44), NCAAF box-verified ~179 s — against a DAILY cadence
            (86400 s). Two orders of magnitude of slack.
          * NO FRESHNESS SLA IS HOSTED ON EITHER BUILD'S OUTPUT: INC-41's
            `artifact_freshness.py` registry holds MLB lakehouse tables + `nfl_pit_*`
            only; `sports_delta_freshness.py` holds exactly two contracts
            (`nfl_sleeper_injuries`, `ncaaf_team_strength_week`), and the latter's Delta
            is written by `run_team_strength` inside the MONDAY P1.2W refit job — a
            different job in a different concurrency group. Nothing an SLA watches is
            produced by these two jobs.
          * NO w3pre-STYLE TIER BUDGET APPLIES: that is the MLB intraday tick
            (`intraday_tick_budget`, 480 s legs / 1500 s job). These are standalone
            daily jobs with no leg budget above them.

      D4 = ACCEPT AND WATCH, recorded. PM: "post-#1129 the trade is deploy latency for
        run safety, the latency is bounded (<=600 s) and predictable (12:00-13:28 UTC
        daily), and the correct future lever is batching merges, never shortening the
        drain (same E2.1-r family as 1-D)." One-line entry ADDED to
        services/dagster/aws/BOX_OPERATIONS.md §6 — that document owns the box's
        operating picture, and the census card (ZPmBj8PF) reads it from there. Extend,
        do not fork.

      MINOR = PIN IT, in this PR. `dagster>=1.11.5` -> `dagster==1.13.22` (the measured
        box version). PM: "Your own diagnosis rested on source analysis of the
        run-monitoring paths, and you had to verify 1.13.5 == 1.13.22 to trust it — that
        verification cost is what an unpinned orchestrator charges on every future
        incident." Pin-bump discipline recorded in the Dockerfile comment (bump
        deliberately; re-check the run-monitoring paths on every bump). Resolution
        VERIFIED before shipping so the pin cannot break the next image build: the
        sibling `dagster-*` libs pin `dagster` exactly, so this one line locks the whole
        family (dagster/-cloud/-webserver/-pipes/-graphql/-shared 1.13.22;
        -dbt/-postgres/-snowflake 0.29.22).
        ⚠️ DELIBERATE ASYMMETRY, stated rather than left to be discovered:
        `pyproject.toml` keeps `dagster>=1.11.5` (uv.lock resolves 1.13.5). That governs
        CI/dev, not the serving image, and re-locking was out of scope here — but it
        means CI and the box can run different Dagster minors. Pinning the IMAGE to the
        measured box version reduces the surprise rather than creating it.

      ══ FOLLOW-UPS ═══════════════════════════════════════════════════════════
      F1. ⭐⭐ THE HEADLINE INSTRUMENT GAP, UNFIXED AND NOT FIXABLE BY A TIMEOUT.
          `DefaultRunLauncher` does not implement `supports_check_run_worker_health`
          and the base `RunLauncher` returns False, so once a run reaches STARTED this
          instance NEVER checks whether its worker is alive. MEASURED CONSEQUENCE: one
          event, five dead runs, THREE detection latencies — ~3 min for the three runs
          still in STARTING (Dagster's 180 s start-timeout), 26 min for
          `intraday_schedule_job` (its own E11.26 1500 s ceiling; failed at 1581.9 s),
          and 4 HOURS for the NCAAF build, which had crossed into STARTED ~1 s before
          the teardown. The alert that results names no cause BY CONSTRUCTION — it will
          read identically for OOM, crash and hang. §7b's ceiling bounds this at 3 h and
          no timeout can do better. A real fix is a launcher that supports a liveness
          check, or a deploy that explicitly FAILS the runs it kills (see F2).
          PM DECISION WARRANTED.
      F2. ⭐ THE DEPLOY SHOULD FAIL WHAT IT KILLS. Every in-flight run is a subprocess
          of `dagster-codeloc`, so a recreate kills all of them BY CONSTRUCTION — after
          the recreate, any non-finished run that started before it is dead and could be
          marked failed immediately with a message naming the deploy. That converts a
          4-hour cause-free mystery into an instant, correctly-attributed failure. Not
          done here (minimality — §7a prevents the kill; this would attribute one that
          happens anyway, e.g. when the drain times out after DRAIN_TIMEOUT and proceeds).
          ~15 lines in deploy.sh. Pairs with F1.
      F3. THE DRAIN STILL PROCEEDS AFTER DRAIN_TIMEOUT (600 s) WITH A WARN — unchanged
          by this fix and correct by INC-36's design, but note `daily_ingestion_job` runs
          ~86 min (5178 s on 09-14, 5302 s on 09-15), so a deploy landing inside it waits
          600 s and then recreates into a live run anyway. §7a narrows the window; it does
          not close it. F2 is what makes that case diagnosable.
      F4. ELEVEN CD DEPLOYS ON 2026-09-14 (six between 16:56 and 22:46), each recreating
          the run worker, each logging "no in-flight runs". That cadence is a PM/process
          question, not a code defect: with §7a in place each of those deploys now waits
          for the box to be idle, so a busy merge day trades deploy latency for run
          safety. Worth a line in whatever owns the box's operating picture — the census
          thread (leaf-run detector ZPmBj8PF) or BOX_OPERATIONS. EXTEND, do not fork.
      F5. `sports_nfl_board_publish_job` FAILED 2026-09-14 14:15:15 (392.2 s), outside
          every deploy window and unrelated to this incident; it succeeded at 17:39 and
          22:35 the same day. Different job, different class — flagged for whoever owns
          NF-INC-0914, not chased here.
      F6. `Dockerfile:43` installs `dagster>=1.11.5` UNPINNED. The box measured
          **1.13.22** (R0) while the source reading was done against 1.13.5 — the
          `_force_mark_as_failed` / `check_run_timeout` / `CancelExecution` paths are
          identical in both, so nothing turned on it, but a run-monitoring semantics
          change could arrive on any `--build`. Same unpinned-dependency class CLAUDE.md
          already records for the ML libs.
      F7. R6 (does the drain probe return a well-formed `Runs` body today?) was not run.
          NOT load-bearing — requiring `__typename == "Runs"` is the correct reading of
          the response whether or not the probe is currently degraded — but it would say
          whether the PythonError hole was ever live or purely latent.
      F9. ⚠️ THE DEPLOY THAT SHIPS A `deploy.sh` CHANGE RUNS THE **OLD** `deploy.sh` —
          MEASURED, not assumed. `deploy.sh` does `git pull --ff-only` and keeps
          executing; git's fast-forward UNLINKS and RECREATES the file, so the running
          bash keeps its fd on the old inode and reads the old script to the end
          (verified with a mid-file edit that shifts every later byte offset — no
          misalignment, old lines executed). ⇒ the new drain takes effect from the
          SECOND post-merge deploy, and the FIRST one must not be read as evidence
          either way. Merge against an idle box. Worth knowing for every future
          `deploy.sh` change, not just this one.

      F8. `_run_sports_dbt` still uses raw `subprocess.run` where its sibling refit job
          uses `bounded_subprocess.run_bounded`. On POSIX the CALLER is genuinely bounded
          (kill+wait, not the Windows communicate() path — verified), so this was NOT a
          contributing cause here; but a surviving GRANDCHILD is not killed, which on a
          2-vCPU box is the E11.26 hazard. One logical discipline, two owners.

      F10. ⭐ A VERIFICATION PROBE THAT READS `EventLogEntry.user_message` CANNOT SEE A
          REPORTED DAGSTER EVENT — I shipped one in §10b and it returned a false negative
          on a PASSING criterion. `instance.report_run_failed` routes through
          `report_dagster_event`, which constructs the entry with `user_message=""` and
          puts the text on `entry.dagster_event.message`. So the probe filtered on a field
          that is STRUCTURALLY EMPTY for exactly the event class it was hunting: zero hits
          on a perfectly healthy attribution, with "the message is absent" indistinguishable
          from "I looked in the wrong place" (NF1.7 (a), inside the check written to close
          the PM's own D1 constraint). The same defect was latent in R1's event dump, which
          blanked the message on every dagster event — including the forcible-failure text
          that is this incident's signature; it changed no conclusion only because the
          timeline was read off event TYPES and TIMESTAMPS. BOTH are fixed, and the §10b
          replacement reports a hit COUNT and dumps the terminal events verbatim so the two
          outcomes are distinguishable. Generalises: any probe that filters a log/event
          stream on one field must prove that field is populated for the class it targets,
          and must render the not-found case as EVIDENCE rather than silence.

      F11. THE `is_finished` GUARD IN §7b NOW HAS A PRODUCTION WITNESS, and it is the
          clause the RED proof caught as vacuous (§7b's explanatory comment contains the
          token, so a raw substring scan stayed GREEN with the real check deleted; fixed by
          stripping comments in `_attribution_block()`). In the 2026-09-16 gate run
          `intraday_schedule_job` COMPLETED SUCCESSFULLY in the ~46 s between the snapshot
          and the attribution, and the guard declined to overwrite a terminal SUCCESS
          (`skip 3c55016e … already SUCCESS`). Without it the deploy would have stamped a
          FAILED-by-deploy message onto a run that succeeded — a FABRICATED failure,
          strictly worse than the silence this story set out to fix. Worth carrying: an
          attribution mechanism needs a terminal-state guard, and the guard is load-bearing
          on the ordinary case, not the rare one.
