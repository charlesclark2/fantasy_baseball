# Plan spec — NCAAF-P3.3 (FULL tier: Team Stats page — backend phase first, page second;
# first task = the realistic-Saturday fixture ADD from the P3.1b closeout ruling ①)
# Authored by PM 2026-09-01. Premises verified against origin/main per the spec-premise rule:
# the router serves manifest/games/games/{id}/futures ONLY (no team endpoint);
# ncaaf_team_strength_week exists in sports_dbt/models/ncaaf/marts; the serving path is
# sports_ncaaf_serving_write_job.py -> S3 -> Lambda; NCAAF is FREE (no Depends on the router).
