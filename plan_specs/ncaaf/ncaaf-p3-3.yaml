apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: ncaaf-p3-3-plan
spec:
  goalRef: { name: ncaaf-p3-3 }
  graph:
    nodes:
      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 1-fixture-add
        desc: "Task 0: captured realistic-Saturday fixture + retire ncaafSlateWithMarket; shippable commit."
      - id: 2-phase-a-serving
        desc: "Team payloads in the serving-write job + /ncaaf/teams/{team_id}; guards; operator box run + Lambda deploy + curls. ⛔ GATE."
      - id: 3-phase-b-page
        desc: "The Team Stats page off the landed contract; link-outs from P3.2 cards; copy conventions."
      - id: 4-verify
        desc: "E2E both ways on the new fixture; RED proofs; realignment mover checks; live post-deploy verification (browser/Vercel — curl is blind)."
      - id: 5-closeout
        desc: "Verdict + findings into closeout.followUps; operator summary with LAPTOP-vs-BOX steps."
  closeout:
    verdict: >
      DONE. All three stages landed: Task 0 (the captured realistic-Saturday fixture,
      PR #1067), Phase A (the team serving contract and route, PR #1067) and Phase B
      (the page, PR #1071). The phase gate held and then cleared on evidence rather
      than on a merge: `GET /ncaaf/teams/68` measured 401 until the operator ran the
      box serving-write, `deploy.sh` and the API-Gateway `create-route` on 2026-09-03,
      and every value the page renders was read off the LIVE wire before a line of
      page code was written — 138 teams, Boise State serving Pac-12 through
      `scd2_dim`, North Dakota State `is_new_to_fbs: true`, strength and schedule
      available with the two rollup blocks stating their own absence.

      The page leads with the rating AND its band, with no rendering path on which the
      number appears alone, and reuses the P3.2 curve rather than forking a second
      renderer. Its three empty states — an ordinary 404, a failed read, and a block
      with nothing in it — are three different sentences, and a reason we have no
      sentence for still says something. 9/9 deliberate breaks RED; full frontend E2E
      679 passed / 0 failed; football 2132, guards 734.
    followUps: >
      ⚠️ ① IS A CORRECTION TO THIS STORY'S OWN EARLIER FINDING, recorded rather than
      quietly replaced. The Phase A closeout reported that
      `ncaaf-copy.ts::MARKET_REASON_COPY` "names only two of four declared reasons" as
      if it were an unaddressed gap. It is not: `lib/ncaaf.ts` documents the omission
      as DELIBERATE — a leakage refusal (`market_snapshot_not_pre_kickoff`,
      `market_snapshot_instant_unprovable`) is OUR defect and not something a reader
      can act on, so it falls through to the generic fallback on purpose, and that
      fallback is RED-proven by `ncaaf_p3_1b_red_proof.py`'s
      `absent_reason_copy_falls_back`. The finding was written from `ncaaf-copy.ts`
      alone, where the reasoning does not live. NOTHING IS OWED unless the PM
      disagrees with the original call.

      ② A REAL REFUSAL IS LIVE ON THE 2026-08-29 SLATE and this half of the finding
      STANDS. Game 401858201 (Hawai'i @ Stanford) serves
      `market_snapshot_not_pre_kickoff`, meaning every captured line for it is at or
      after kickoff. Benign if the live capture simply never reached that kickoff
      before it started; a DEFECT if the odds→game join attached another game's line
      by prefix collision, which is the failure `_market`'s guard was written for. It
      is the first time that branch has fired on real data, and it is worth one look
      at the raw `odds_ncaaf_live` rows for that game id.

      ③ THE EFFICIENCY AND TRENCH/PACE BLOCKS ARE EMPTY FOR EVERY 2026 TEAM ON THE
      LIVE WIRE, with `reason=no_row_for_this_team_and_season` — which is the honest
      and correct reading: the P1.1 rollups hold no 2026 rows yet. They populate the
      moment `sports_ncaaf_dbt_build_job` runs on the box against a played season, and
      the page needs no change when they do. Not a defect; recorded because "two of
      four blocks are empty" is otherwise the first thing a reader of the live page
      will ask about.

      ④ NOTHING RE-PUBLISHES THE TEAM PAGES WHEN A MART BUILD LANDS. The P1.1 marts
      are rebuilt by a different job on a different cadence, so a team page can be one
      mart-build behind; every block states its own `as_of_week` and the run log
      reports per-block availability, so the staleness is VISIBLE rather than
      inferable. The INC-25-correct finish is a serving-write leaf downstream of
      `sports_ncaaf_dbt_build_job`, the same shape
      `ncaaf_serving_write_after_snapshot_op` already gives the snapshot tables. Not
      wired here because it changes another job's graph, which is outside this story's
      boundary.

      ⑤ NO WEEK LABEL ON THE TEAM SCHEDULE, and it is a deliberate omission rather
      than an oversight. Two different columns in this repo are called
      `season_order_week`: `dim_ncaaf_game`'s is a genuinely derived postseason-safe
      ordering, `game_prediction_snapshot.py`'s is a verbatim alias of CFBD's
      restarting raw week, and the P3.1 suite bans the token from the serving layer
      outright. The schedule orders by `game_day` and carries `is_postseason`. If the
      page wants "Week 3", it needs a properly-named field derived from the mart's
      column — a small, reviewable addition, not a rename.

      ⑥ THE GENERATED `ncaaf-team-populated.synthetic.json` IS A STAND-IN WITH A
      RETIREMENT CONDITION, stated in its own header and in the mock's: on the first
      re-capture after the 2026 rollups materialize, a captured payload reaches the
      efficiency/splits AVAILABLE branch on its own and the generated fixture must be
      RETIRED and re-anchored onto the capture — a stand-in for a payload that now
      exists is a fixture testing the render against the transform under test
      (E9.64b). Keep the ABSENT arm alive on whichever fixture still has it.

      ⑦ THE LAPTOP `sports.duckdb` HELD NO 2026 STRENGTH ROWS while the LAKE did (138
      at as_of_week 1). Harmless for this story — the strength block reads the lake by
      design — but it means `ncaaf_team_strength_week` (a dbt VIEW over that parquet)
      had not been rebuilt in the main checkout since the 2026 P1.2 refit. Anything
      reading that mart rather than the lake would silently see 2025 as the newest
      season.

      ⑧ `infrastructure/aws_resources.md` CLAIMED THE FOUR P3.1 ROUTES WERE "NOT YET
      APPLIED" while all four were live. Corrected from an anonymous measurement rather
      than from memory. The documented-≠-actual class, facing the harmless direction this
      time; the fifth route's ⛔ is now a measured 401, not an assumption.
