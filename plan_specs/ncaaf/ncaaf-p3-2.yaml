apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: ncaaf-p3-2
  vertical: ncaaf
  card: https://trello.com/c/y0xpO30Y   # P3 epic thread; P3.2 card linked on creation
  status: IN_PROGRESS
spec:
  description: >
    The flagship NCAAF game-predictions surface, probability-first and
    distributional, consuming the P3.1 API. Opener is 2026-08-29. Per the
    P3 brand directive (ncaaf_story_prompts.md §Phase 3): lead with the WIN
    PROBABILITY (both sides, "58% / 42%"); visualize margin + total as
    DISTRIBUTIONAL CURVES drawn from the served interval params — the
    signature viz, never a point number; show the honest interval (80%);
    show the MODEL line vs the MARKET line side-by-side as TRANSPARENCY
    with an explicit no-edge-claim framing. Week selector; link-outs
    stubbed for P3.3. Reuse MLB card scaffolding where sensible but the
    framing is uncertainty-forward. NCAAF is FREE (E9.45). best_alpha=0 —
    no pick, no edge language, no "best bets" anywhere.
  acceptanceCriteria:
    - description: >
        All UI in frontend/ (Next.js) ONLY — never app/ legacy Streamlit
        (repo CLAUDE.md rule). Frontend-only story: no backend, router, or
        serving-store changes — P3.1 owns those; if the API contract needs
        a change, FLAG it, don't make it.
    - description: >
        Cards render for the live week from the P3.1 API; curves draw from
        the served interval params (client-side density/band from the
        params, no re-derivation of model quantities); model-vs-market
        rendered honestly with the no-edge-claim copy; mobile-legible
        (chromium + mobile E2E projects).
    - description: >
        DEPENDENCY HANDLING, stated because P3.1's runtime gate may still
        be completing: build against P3.1's committed Pydantic payload
        contract with a CAPTURED real payload as the fixture (never a
        hand-invented one); the final verification leg runs against the
        DEPLOYED API by name. If the deployed API is not yet live when you
        reach that leg, STOP there, mark the leg pending in the closeout,
        and hand the operator the exact verification curls — do not fake
        the leg with the fixture.
    - description: >
        Honest-framing copy discipline: probabilities and intervals are
        what they are ("the model's line" vs "the market's line",
        "we don't claim an edge here"); no win-rate claims; every copy
        string in the frontend claim-copy convention with denylist
        coverage; the best_alpha=0 flags the payload carries are respected
        (if the payload says no-edge, the surface may never imply one).
    - description: >
        Empty/degraded states are first-class: no games this week, a game
        with missing market line (absent-vs-null — an absent line renders
        "no market line", never 0 or a blank that implies parity), a
        payload field the contract marks optional. E2E asserts RENDERED
        output (NF-C4) for the happy path AND the degraded states.
    - description: >
        Guards RED-proven (mutation landed + predicate moved); a changelog
        line (Monday block); frontend auto-deploys on merge to main —
        verify the published surface by name post-deploy.
---
