kind: Plan
metadata:
  name: ncaaf-p3-1-plan
spec:
  goalRef: { name: ncaaf-p3-1 }
  graph:
    nodes:
      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 1-payload-contract
        desc: >
          Define the served payload schema (Pydantic models, every field
          declared; no pick field) + the serving-store key scheme (LA
          game-day; NCAAF lane).
      - id: 2-serving-write-op
        desc: "Box Dagster op + schedules-ready job (HALT tier), reading P1.4/P1.5 from the lakehouse."
      - id: 3-routers
        desc: "FastAPI games/predictions + futures routers; authorizer NONE on new public routes."
      - id: 4-guards
        desc: "Absent-vs-null, round-trip field-intact proof, RED-proofs, changelog."
      - id: 5-runtime-gate
        desc: >
          OPERATOR-RUN: hand the box serving-write command + deploy.sh
          deploy + verification curls as paste-ready commands (runtime,
          artifact, success criteria each). Resume from results; record the
          real-run evidence in the closeout.
      - id: 6-closeout
        desc: "Verdict + findings into closeout.followUps; session summary."
  closeout:
    verdict: >
      SHIPPED. The runtime gate was MET on 2026-08-24 against production — see
      followUps -3. The verdict as originally written, retained verbatim because a
      superseded status is history, not a line to overwrite:
      "SHIPPED-PENDING-RUNTIME-GATE. All three deliverables are built, CI-gated and
      RED-proven (20/20 deliberate breaks caught): the payload contract, the box
      serving-write op + schedule, and the four public FastAPI routes. The runtime
      gate is NOT met and could not be met by this session — the two NCAAF-PS lake
      tables the serving write reads are ABSENT from S3 (measured, not inferred), so
      there is nothing to publish until the operator fires the snapshot job. The
      laptop dry-run DID reach the real lake end-to-end and returned the honest
      `status="no_snapshots"` no-op, which proves the read path, the LA game-day
      resolution and the absent-table handling against production data."
    followUps: >
      -3) ✅ RUNTIME GATE MET (2026-08-24, operator-run on the box + anonymous curls against
      production). The chain was proven END TO END, not by parts: lake → snapshot (8 rows, all
      2026-08-29, leakage gate PASSED, `strength_as_of_week=1`, futures 138 teams) → serving write
      (`status="ok"`, 11 blobs, `dynamo_writes == s3_writes == 11`, `n_game_days=1`) → `deploy.sh`
      → the four `--authorization-type NONE` gateway routes → anonymous 200s. The served
      TCU/North Carolina payload REPRODUCES the dry run exactly (P(home) 0.78, margin interval
      [-8.639, +34.080] width 42.72, total mu 54.51), which is what makes this a gate rather than a
      smoke: the number a reader sees is the number the model computed.
        (a) ⭐ THE TWO-SIDED CHECK IS WHAT CERTIFIED IT, and it nearly did not happen. The first
        curl sweep returned 200/404/200/404, and BOTH 404s were correct — `/ncaaf/games` with no
        param defaults to the LA game-day (INC-22), which on 8/24 has no slate, and the game id in
        the smoke loop was an invented placeholder. But a 404 alone CANNOT distinguish "correctly
        absent" from "the date-keyed read is broken", and the two 200s were both PERMANENT-key
        blobs (manifest, futures) which exercise a different key shape entirely. The positive
        control (`?game_day=2026-08-29` → 200, then a REAL game id → 200) is the only thing that
        proved the date-grained path. ⇒ a serving gate needs a positive control per KEY SHAPE, not
        per route — and the 404 BODY must be read, not just the code: ours names the game-day
        (`… (game_day=2026-08-24)`), whereas a gateway 404 is a bare `{"message":"Not Found"}`, so
        the body is what separates "our router answered" from "the route target is wrong".
        (b) ⚠️ `market.status="unavailable"` ON EVERY GAME IS THE EXPECTED, HONEST STATE — and the
        discriminator is `market_read_failed=false`, NOT the attach count. `market_lines_attached=0`
        alone cannot separate "the read ran and there is genuinely no line" from "the read threw and
        we swallowed it into a zero" (the E9.26b silent-empty class); the writer reports both, and
        the payload carries a machine-readable `reason` with all seven line fields present as
        explicit `null`. The cause is structural, not a defect: the only NCAAF odds capture
        scheduled for 2026 is the paid `/historical` catch-up, which can only reach a kickoff AFTER
        its snapshot instant. ⇒ the spec's "market line beside the model line" is NOT satisfied on
        the wire until either a live-odds cadence exists or P3.2 renders the stated absence.
        (c) ⚠️ TOTALS ARE NEARLY FLAT ACROSS THE SLATE (54.2–56.7) AND THAT IS CERTIFIED
        BEHAVIOUR, NOT A STARVED FIT. `pace_term_active=false` pre-season, and pace is the
        POSSESSIONS channel — the total axis's only real discriminator (NCAAF-P2.1 S1: "~zero
        margin content"). S1-serve PROVED a 100%-NULL-pace board is byte-identical to the pre-S1
        board, so this is the NULL-inertness result working as designed. The MARGIN axis IS
        discriminating (-4.6..+26.9, P(home) 0.393..0.945), which is the tell that the P1.2 re-fit
        is live rather than cold-start (a cold start presents as COMPRESSION on BOTH axes).
        ⇒ P3.2 must not present a 2.5-point spread of totals as if it discriminated between games.
      -3b) 🧭 CONTRACT NOTE FOR P3.2 (and any future NCAAF client) — DO NOT OPEN ON
      `manifest.current_game_day`. That field is "today" in LA at write time; it is NOT a promise
      that a slate exists for it, and between seasons/weeks it usually does not — measured live on
      2026-08-24, `current_game_day="2026-08-24"` while `game_days=[{"2026-08-29", 8}]`, so a client
      opening on it 404s every day until the opener. A selector must open on the first entry of
      `game_days` (falling back to `current_game_day` only when it appears there). This is exactly
      why the manifest hands over the DAY LIST rather than a week (the `season_order_week` alias
      landmine) — the list is the authority on what exists; `current_game_day` only says where
      "now" sits relative to it.
      -1) 🔎 PRE-FLIGHT OF THE RUNTIME GATE (2026-08-24, measured on the real lake after the
      operator's C bootstrap landed). Recorded because two of these numbers would otherwise be
      ambiguous the moment the operator reads them, and one is a live PM decision.
        (a) ✅ THE SEEDED TABLES BEHAVE. Both NCAAF-PS tables now read as a PRESENT-BUT-EMPTY
        frame (`rows=0 empty=True cols=['season']`) rather than raising — a state neither the
        writer nor the serving path had ever actually met. Verified end-to-end: the serving write
        returns `status="no_snapshots"` and touches nothing. The seed's one-column schema is
        irrelevant by design — `merge_snapshot_rows` short-circuits on `existing.empty`, and the
        first real write replaces the season partition, so the seed leaves NO residue (rehearsed
        on scratch prefixes: final table = 1 real row, real schema).
        (b) ⭐ THE OPENER SLATE IS 8 GAMES, AND THAT IS CORRECT — NOT UNDER-COVERAGE. A snapshot
        run on 8/24 selects 8 FBS-vs-FBS kickoffs (all on 2026-08-29, none `start_time_tbd`), out
        of 761 in the lake for the season. It reads low only because the FBS-vs-FBS filter drops
        the opener's many FBS-vs-FCS games; the following Saturdays are 30 (9/05) and 45 (9/12).
        ⇒ "wrote 8 rows" is the SUCCESS criterion for the first fire, not a red flag. Stated here
        because a plausible-but-wrong number is the thing an operator cannot adjudicate alone.
        (c) ✅ THE P1.2 RE-FIT LANDED — `as_of_week=1`, 138 teams, `covariate_component_coaching`
        and `covariate_component_roster_flux` non-zero on 136 of 138, `strength_margin` spanning
        -25.9..21.2. Per NCAAF-PS's own discriminator that is a real re-fit, not the cold start,
        and the 47-point span is the SPREAD test (a cold start presents as COMPRESSION toward the
        mean, not as a wrong leader).
        (d) ⚠️ BUT ONE COVARIATE IS ZERO ON EVERY TEAM: `covariate_component_talent`. Diagnosed to
        the source rather than guessed — the lake's `talent` table has NO 2026 rows (newest 2025),
        and CFBD `/talent?year=2026` returns **HTTP 200 with 0 rows** while 2025 returns 134. So
        this is an HONEST UPSTREAM ABSENCE, not a stale mart and not an un-run ingest; every other
        covariate feed HAS 2026 (returning_production 136, coaches 138, recruiting_players 3987,
        transfer_portal 4445). A zero covariate contributes exactly 0.0 to a mean-imputed ridge, so
        the served board is honest — just built without talent. ⛔ Not a blocker.
      -2) 🚨 PM DECISION — A SEASONAL WINDOW WILL SILENTLY CLOSE OVER THE TALENT GAP, and this one
      IS actionable. `talent` is in `ROLL_FORWARD_SOURCES`, so the P0.7 roll-forward WOULD ingest
      2026 talent the moment CFBD publishes it — but `NCAAF_ROLL_FORWARD_CRON = "0 6 * 2-8 1"` is
      Monday-only, **months Feb-AUGUST**. From 2026-08-24 that leaves exactly ONE more fire
      (Mon 8/31); after it the window is shut until Feb 2027. ⇒ if CFBD publishes 2026 talent in
      September — which is when a fall-camp covariate would land — NOTHING ingests it for the whole
      season, and because snapshots are IMMUTABLE the forward track record is permanently
      talent-free. This is the recorded month-scoped-cron class (E9.48 (c) / INC-37, and NF-FRESH1
      names an NFL `3-8` window as exactly this shape). Options for the PM: extend the NCAAF
      roll-forward window through the season; or add a talent-only in-season top-up; or accept the
      absence explicitly and record that the 2026 board ships without talent. ⛔ Not touched here —
      it is the P0.7 schedule, not a serving story's to change.
      0) ⭐ RESOLVED (2026-08-24) — item (1) below is FIXED by NCAAF-LAKE1, and its
      DIAGNOSIS as written below is WRONG. It is not that delta-kernel reworded
      anything: the local wording is unchanged across duckdb 1.5.3 and 1.5.5. The two
      messages always meant different things, and because an object store has no
      directories a never-written S3 table can only ever report "No files in log
      segment" — so the marker set, verified against a LOCAL directory, never covered
      the substrate production reads. LAKE1 replaced the message match with a
      `_delta_log` LISTING, removed the retired path, re-pointed both consumers
      (including P3.1's own local publish-path branch, whose guards were re-anchored
      rather than deleted) and pinned duckdb. Verified live: `write_snapshot` can now
      bootstrap a never-written S3 table. The PM ALSO ruled a one-time operator
      bootstrap (option C) runs first, because LAKE1 only reaches NCAAF-PS once it is
      on the box. Option A (widen the marker set) was REFUSED. The paragraph below is
      left as written — it is what this session measured and escalated, and correcting
      a record in place would hide that the first diagnosis was overturned by the
      story that fixed it.
      1) ⚠️ BLOCKER FOR THE OPENER, NOT THIS STORY'S TO FIX — the FIRST NCAAF-PS
      snapshot run may be unable to bootstrap its own Delta table.
      `game_prediction_snapshot.write_snapshot` reads the table back BEFORE its
      first-ever write (correctly — that is the never-lose-a-prior-week contract),
      and on duckdb 1.5.3 delta-kernel reports an absent Delta table as
      "No files in log segment", which `query_lake.MISSING_TABLE_MARKERS`
      ("InvalidTableLocationError", "Path does not exist") does NOT contain — so the
      read RAISES instead of returning "nothing to preserve". Measured on the laptop
      against the real prod lake, against BOTH a never-written NCAAF-PS table and a
      random non-existent prefix; a populated table (`team_strength_week`, 23,130
      rows) still reads normally. `duckdb>=1.1.0` is unpinned, so the box may emit a
      different message — the handoff carries a one-command probe that settles it.
      ⛔ The obvious fix (widen `MISSING_TABLE_MARKERS`) is the one to argue about
      rather than apply: that list is deliberately narrow BECAUSE its consumers are
      READ-MERGE-WRITE writers, where mistaking a read-after-write blip for "nothing
      there" silently deletes every prior week (the CI flake that hardened it). The
      disciplined shape is a SECOND, INDEPENDENT existence signal (an S3 prefix
      listing) rather than a broader message match. P3.1 scoped its own handling to
      the PUBLISH path, where an idempotent write cannot lose lake data.
      2) THE MARKET LINE WILL BE NULL FOR EVERY UPCOMING GAME, and that is a data-feed
      gap, not a bug. The only NCAAF odds capture scheduled for 2026 is the paid
      `/historical` catch-up, which by construction can only reach a kickoff once that
      kickoff is PAST its snapshot instant (close = K−5min, T−1 = K−24h); the live
      `odds_ncaaf` feed is on no schedule at all. So a board written on Tuesday has no
      line to sit beside the model's. The payload handles this honestly — the market
      block is always present with `status="unavailable"` and
      `reason="no_line_captured_for_this_kickoff"` — but the spec's
      "market line beside the model line as TRANSPARENCY" is not actually satisfied on
      the wire until either a live-odds capture cadence exists or P3.2 renders the
      stated absence. PM decision: schedule a live `odds_ncaaf` capture, or accept the
      absence and design P3.2's transparency panel around it.
      3) THE 2026 BOARD MAY STILL BE COLD-START-COMPRESSED. Serving publishes whatever
      the snapshot rows hold, so the P1.2 re-fit (✅ 2026-08-18) must be the vintage the
      first snapshot reads. Every payload carries `provenance.strength_as_of_week` and
      `pace_term_active`, so the vintage is auditable from the API — the operator should
      READ them on the first published slate rather than assuming (the NF-FRESH2
      per-input as-of lesson). `pace_term_active=false` at week 1 is CORRECT by
      construction, not a defect.
      4) ⛔ DELIBERATELY NOT DONE, recorded so nobody reads the omission as an oversight:
      the VAL3b cold-start correction (certified, DEPLOY-HELD) is not expressed anywhere
      in the served contract — that is NCAAF-VAL3c, post-opener. Nothing in this story
      keys on `season_order_week` (guarded, RED-proven over comment-stripped source).
      No frontend surface was built; P3.2-P3.9 consume this API.
      5) CARDING CANDIDATE — `duckdb>=1.1.0` is unpinned while `MISSING_TABLE_MARKERS`
      is a VERSION-SENSITIVE message match. A duckdb bump can silently turn "the table
      does not exist yet" into a hard failure for every READ-MERGE-WRITE writer in the
      football vertical. Pinning duckdb, or replacing the message match with a
      structural existence check, is a small change with a wide blast radius avoided.
