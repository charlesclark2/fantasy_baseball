  name: nf-inc-0914
  vertical: nfl_fantasy
  card: https://trello.com/c/PENDING
  status: SHIPPED_PENDING_VERIFICATION  # fix + entrypoint smoke complete and CI-green; the RESTORE (re-run the publish job, confirm the board advanced by content timestamp, then the chained NF-INJ4b per-row verify) is the operator step in the handoff. PM flips DONE once the board has advanced.
spec:
  description: >
    sports_nfl_board_publish_job run dd44e28e failed in
    nfl_board_publish_op: export_draft_board_json.py main() line 2138
    raises NameError: name 'season' is not defined at a call passing
    `pdf, designations, season=season` — on its face the designation
    wiring's call site (#1100/#1104) referencing a name that does not
    exist in main()'s scope on the SCHEDULED box path. Nothing
    published; the prior board serves (degraded, not down) — but
    designations change daily in-season and the stale board is
    silently aging, and the NF-INJ4b per-row verification requires a
    successful publish with Tue 09-15 as the last daily fire.
    best_alpha=0; no model/value change; the fix is a scope/wiring
    repair, never a behavior change smuggled in as one.
  acceptanceCriteria:
    - description: >
        DIAGNOSE precisely, then fix minimally: git-blame the call
        site to the introducing commit; establish WHY three green
        verifications missed it — CI (which mocks the publish IO —
        does anything execute main() at all?), the ship battery, and
        the operator's successful 09-13 manual publish (different
        entrypoint? different flags? a branch only the scheduled job
        takes?). The divergence between "the manual publish worked"
        and "the scheduled job crashed" is the finding that matters —
        name the exact fork. The fix binds `season` from the real
        source main() already has (or threads it explicitly);
        NOTHING else about the call changes.
    - description: >
        CLOSE THE CLASS, not just the instance: a smoke/guard that
        EXECUTES the export main() entrypoint end-to-end (real
        argument parsing, the designation branch taken, IO stubbed at
        the boundary not the entrypoint) so a NameError/scope break
        in the publish path can never again ride a green CI — this is
        "merged never means served" arriving one layer earlier: an
        entrypoint no test executes is an entrypoint CI cannot see.
        RED-prove it with the exact historical break (the season name
        removed) + baseline-pass/NOT-SELECTED/resolve-every-node.
    - description: >
        RESTORE, operator paste-ready: after the fix lands on main
        and box CD deploys, re-run the publish job (or wait for the
        Tue 07:15 PT fire if the operator prefers — state both, with
        the recommendation to re-run TODAY so the per-row verify
        window isn't spent on hope); verify the published board
        ADVANCED by content timestamp, then chain straight into the
        NF-INJ4b per-row verify command (card 31EMmr9B) — one box
        visit closes both.
    - description: >
        NOT THIS INCIDENT: the NF-INJ1 [ALERT] about 11
        coherence-violating players fired BEFORE the crash and is the
        known, disclosed, pre-registered class (the ordering
        give-back; its fix is the calendar-parked NF-INJ2c re-test) —
        it is NOT the failure cause and gets no chase, no tolerance
        change, no suppression. If its count moved materially vs the
        last publish, note the number in the closeout and stop.
        Standing: worktree; PR -> dev -> main (the promote IS the
