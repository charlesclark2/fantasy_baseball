    duplicates: []
    adjacent:
      - "NF-W1 / NF-EPIC 6 (Done) — the champion spec this serves; its record (incl. the matchup-claim ban and the 39-level vector) is the substance; no re-fit, no re-read."
      - "NF-G0+D21 (Done, gate-refused publish) — the governance pipeline; this is likely its first REAL promotion; its 10 gates bind unweakened."
      - "NF-EPIC1 entitlement standard + G100 freemium (Done, live) — the six handoff rules bind verbatim (authorizer NONE, byte-identity sides, CDN pins, gate-the-renderers, quota seam, deploy tails)."
