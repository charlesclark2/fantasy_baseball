      - "the NF-G0 registry module + its 10-gate review + the NF-D21 refused-publish record (the pipeline's only prior real exercise)"
      - "app/backend entitlement.py + the G100 handoff rules; the season serving-write/publish jobs (the pattern this extends)"
    recordedNulls:
      - "NF-W1's matchup-foil null — carried as a CLAIMS constraint, not re-tested."
      - "NF-D21 publish gate-refusal — stands; this promotion is a fresh review, not a retry of that artifact."
  supersedes: []
  dependsOn:
    - "NF-W1 champion spec merged (dev); NF-G0 pipeline merged; NF-INFRA1 schedules RUNNING (all verified Done)"
  feedsInto:
    - "The weekly frontend surface (next frontend story after NCAAF-P3.3b); NF-W2b/K-DST/conformal matched-pairs; gate 3's re-scoring consumer; NF-OPT1; NF-INJ4b's weekly consumer (later)"
