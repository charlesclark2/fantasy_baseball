# Plan spec — NF-C6-PH2 (FULL tier: the weekly serving path + the NF-G0 promotion review —
# gates 1+2 of the per-stat distribution consumer chain; gate 3 explicitly deferred)
# Authored by PM 2026-09-05. Sequencing basis: the card's own "POST-LAUNCH" hold has expired —
# launch happened, drafts are done, Week 1 is 2026-09-09, and NF-W1's certified weekly champion
# serves NOTHING (no weekly endpoint exists; the deployed surface is the season board).
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: nf-c6-ph2
  vertical: nfl_fantasy
  card: https://trello.com/c/HvVAWD9f
  status: IN_PROGRESS
spec:
  description: >
    Serve the weekly model. NF-W1's champion (lgbm_hurdle — P(zero) x
    conditional quantiles, SHIP x4 positions, 8/8 folds vs the honest
    foil, PBO 0.0, coverage >=0.80) has been deploy-held since 08-07
    with no weekly endpoint to land on; the NF-G0 registry holds the
    per-stat cells as CHALLENGERS invisible to serving. This story is
    gates 1+2 of the consumer chain: (1) the WEEKLY SERVING PATH — a
    box build job writing weekly player payloads (point + honest
    interval from the quantile vector, weekly ROS = sum of remaining
    weeks) + the Lambda endpoint(s) + contracts; (2) the NF-G0
    PROMOTION REVIEW — the 10-gate review over the weekly champion +
    staged cells, with operator sign-off; likely the registry's FIRST
    real promotion (NF-D21's was gate-refused), so the pipeline's
    dry-run proof meets reality here. ⛔ GATE 3 (the arbitrary-league
    re-scoring consumer) IS DEFERRED — it triggers the
    3-implementation parity tax and is its own story; NOTHING in this
    story adds a fourth scoring implementation or touches
    fantasy_engine/browser-TS/Lambda scoring. best_alpha=0;
    DEPLOY-HELD at every ship point: a registry change ships with the
    box image ON MERGE TO MAIN (MH2.1 — merging IS the deploy), so
    main-merges, promote, deploy.sh, and schedule enablement are all
    operator steps on explicit instruction.
  acceptanceCriteria:
    - description: >
        CONTRACT FIRST, entitlement declared BEFORE building (the G100
        handoff rules bind): the PM ruling, overridable by the
        operator, is MIRROR THE SEASON FREEMIUM EXACTLY — free tier =
        a generic weekly board on the free preset (full_ppr/12), point
        + interval only, no scorable per-stat components (STAT_FIELD
        is the paywall — NF-EPIC1); paid = per-stat components, other
        configs, and anything personalized. Every new endpoint DECIDES
        WHICH SIDE of the byte-identity invariant it is on before it
        is written (free URLs byte-identical for every caller — CDN,
        cache_control_for, and the entitled-keyed cache all rest on
        it); the free weekly URL joins the CDN allowlist pattern with
        the config/size pinned; API-GW authorizer stays NONE where the
        gate is inside the Lambda (the /board precedent); paid routes
        401 anon. Pydantic-declared fields only (E9.41), additive
        (NF-C0).
    - description: >
        THE WEEKLY BUILD is a pipeline job on the box (the
        sports_nfl_*_job pattern): builds the weekly payloads from the
        champion spec through the lake, stamps content timestamps +
        input vintages in the artifact (the INC-41 lesson: freshness
        is read from CONTENT, and the artifact gets a freshness SLA
        entry sized to its cadence with active-hours semantics), and
        serving-writes to S3/DynamoDB per the existing pattern. PIT
        discipline: assert_point_in_time invoked on the serving frame
        (NF-W1's guard gets its serving-side caller); no current-week
        outcome enters a prediction. Honest absent states: a player
        with no projection (rookie edge, K/DST — NOT in the champion,
        excluded by design and stated) renders a machine-readable
        absence, never a fabricated row.
    - description: >
        THE NF-G0 PROMOTION REVIEW runs the registry's own 10 gates
        over the weekly champion (+ the staged per-stat cells if their
        promotion is in scope of the review — promote only what this
        story SERVES; cells with no consumer yet stay CHALLENGERS,
        promotion is not a rubber stamp for the whole shelf): stamp/
        source consistency, universe count, interval floors, scoring
        parity where applicable, rollback artifact, live-payload==
        staged, frontend/backend same version. The review's verdict +
        the operator sign-off are recorded; a gate refusal is a valid
        outcome that holds serving (declaration never outruns
        production). Composite lineage stamped per the registry
        contract.
    - description: >
        RUNTIME GATE (CI mocks all IO): the real box build + serving
        write + deployed-Lambda curls (a real player-week payload with
        interval + ROS; the free URL byte-identity check; a paid route
        401 anon) are OPERATOR-RUN paste-ready steps; deploy.sh is the
        only Lambda deploy path; the weekly job's schedule enablement
        is an operator step; merged never means served. Positive
        control per key shape (the P3.1 lesson): prove the
        week-keyed read specifically.
    - description: >
        GTM/claims constraint carried from NF-W1's record, enforced
        not narrated: the weekly edge is USAGE/SNAP conditioning — the
        matchup foil LOST at all four positions — so no copy, field
        name, docstring, or changelog line may claim "matchup-based";
        a guard pins the claim-copy surface if one is added. All
        interval language honest (a coverage floor, not a promise).
        Changelog entry only when a user can actually see something —
        which is NOT this story (the frontend surface is the next
        story); if nothing user-visible ships, no changelog entry.
    - description: >
        Standing disciplines: guards RED-proven with unique anchors +
        baseline-pass + NOT-SELECTED + the resolve-every-node baseline
        check (the NF-INJ4b lesson); run the owning CI shard for any
        shared guard; >2-min commands operator paste-ready (the first
        full weekly build almost certainly qualifies — time it);
        reproduction pins 1e-9 where numeric; worktree; PR -> dev;
        roadmap files frozen; no Trello. NF-INJ4b's designation
        channel is NOT wired here (its ship path is its own,
        deploy-held); NF-W2b/K-DST/conformal queue behind this as
        matched-pair stories once serving exists.
---
