      - "NF-INJ4b (SHIP_CANDIDATE, held) — disjoint; its Week-1 counterfactual/ship path runs on the SEASON board; only the changelog week-block is shared (rebase)."
      - "NF-INJ2c (IN FLIGHT) — season-board ordering; disjoint files."
      - "NF-INFRA1 (Done) — the ingest schedules this build reads through; freshness is already paged."
  triedLedger:
