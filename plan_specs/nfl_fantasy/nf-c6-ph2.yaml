apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: nf-c6-ph2-plan
spec:
  goalRef: { name: nf-c6-ph2 }
  graph:
    nodes:
      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 1-contract
        desc: "Weekly payload contract + entitlement boundary (mirror-G100 ruling) + byte-identity side declared, BEFORE any build code."
      - id: 2-build-job
        desc: "The box weekly build + serving-write with content stamps, SLA entry, PIT assertion, honest absences."
      - id: 3-endpoints
        desc: "Lambda routes on the declared contract; free URL byte-identical; paid 401 anon; CDN pins."
      - id: 4-promotion-review
        desc: "NF-G0 10-gate review over what this story SERVES; operator sign-off recorded; refusal holds serving."
      - id: 5-runtime-gate
        desc: "⛔ Operator: box build run + deploy.sh + curls (week-keyed positive control; byte-identity; 401s). Merged never means served."
      - id: 6-closeout
        desc: "Verdict + findings into closeout.followUps; operator summary with LAPTOP-vs-BOX steps; the frontend story's consumed contract stated."
  closeout:
    verdict: >
      SHIPPED (code) / DEPLOY-HELD (serving). The weekly serving path exists end to end and the
      NF-G0 review ran: 6 gates passed, 0 failed, 4 unevaluable, ready_to_promote = FALSE with the
      strict default (nothing named in `allow_unevaluable`). NOTHING was promoted and nothing was
      published — w2b/w6c/w6d stay CHALLENGERS. The build runs in 81-88s on the laptop over
      2026 wk 1: 503 players (QB 87 / RB 112 / WR 182 / TE 122), 95 rookies, train 84,553 rows
      against a purged-equivalent 83,521. Gate 3 untouched: no fourth scoring implementation, and
      fantasy_engine / the browser TS scorer / the Lambda scorer are all unmodified.
    followUps: >
      PM triage. (1) ⭐ E7.9 TRAIN/SERVE GAP FOUND AND CLOSED — `opponent_matchup__dvp_ppr_index_l8`
      and `__def_ppr_allowed_l8` are derived from a defence-vs-position table built out of the
      REALIZED stat feed, so a week with no stat rows has no group key: training coverage 0.9580 /
      0.9847 (1.000 on the analogous week-1 rows) against serving 0.0000 / 0.0000. Without the fix
      the served board moves within-position ranks by mean 5.4, p95 17.9, MAX 43 places. Closed by
      supplying the missing grid keys as zero-valued stat rows and letting the certified
      `engineer_features` compute its own block — no forked arithmetic. (2) ⭐ AND THE RESIDUAL IT
      EXPOSED, which is a property of NF-W1's FEATURE rather than of the fix: training's grid
      MEMBERSHIP is itself outcome-dependent (a cell exists only if some player of that position
      recorded a line against that defence), so an exact pre-game reproduction is impossible in
      principle. Measured: bit-identical on 5 of 6 held-out weeks; the 6th differs because no TE
      recorded a line against BUF in 2025 wk18, giving 127 certified cells where the schedule
      implies 128. Small (~0.8% of cells) and now recorded rather than latent. (3) ⭐
      `prior_week_box__ppr_sum_s2d` is computed as `cumsum() - own` — the target week's value is
      ADDED then SUBTRACTED rather than excluded. Exact in real arithmetic, ~1e-13 off in floating
      point from week 2 onward, and EXACT in week 1 because the group holds only the target row —
      so the outcome-independence proof passed a bit-exact bar on this build by luck of the week
      number and would have false-fired every week after. Tolerance now derived from
      floating-point precision (1e-9), two-sided-pinned, with max_abs_drift reported every build.
      (4) COMPONENT COHERENCE: over 503 rows the component-derived PPR sits 0.77 BELOW the points
      head (median |d| 0.60, p95 3.71, max 7.92). Two independent heads, so a diagnostic and never
      a gate — but the weekly FRONTEND story must decide how to present both before it renders
      them side by side. (5) TWO GATE-APPLICABILITY QUESTIONS for the registry, both named in the
      review rather than worked around: `model_stamp_consistency` reconciles six lineage fields of
      which this family populates ONE (the rest name a level / ordering / rookie leg the weekly
      stack does not have), and `interval_floors`' population loop reads ZERO populations because
      it scans rookies/veterans/kdst and this family is per-POSITION. Both are shared cross-vertical
      instruments, so changing either means sweeping every guard that pins its output (MH2.7) — a
      story of its own, not a rider on this one. (6) `scoring_parity` is structurally NOT
      APPLICABLE to a family whose point and line come from independent heads; a fabricated 0.0
      would have passed it. Worth a registry-level notion of gate applicability per family. (7) CD
      PATH GAP, mitigated not closed: the box builder imports `app/backend/models/nfl_weekly.py`,
      but `app/**` is DELIBERATELY excluded from the box CD trigger (adding it would read as though
      merging deployed the API — pinned by `test_orchestration_cd_paths`). A required-field change
      fails loudly on the box; an OPTIONAL one would not, so a CI guard now pins the builder's row
      against the contract's declared fields in both directions. The residual is a contract-only
      change merging without the box image moving. (8) The weekly point is PPR-NATIVE, so no
      config/size dimension exists yet — other presets are blocked on GATE 3, not on entitlement.
      Worth saying on the pricing surface so "one free format" does not read as 13 withheld ones.
      (9) w2b now has 1 of its 3 blockers cleared (the serving path); the other two are a LIVE
      stamped injury forward-capture and pre-flip snapshots. w6c/w6d remain blocked solely on
      gate 3. (10) ⛔ INCIDENT, SELF-REPORTED: while exercising the publish path I ran
      `run_weekly_serving --publish` WITHOUT `--s3-bucket` in order to prove the NF1.7 no-bucket
      REFUSAL fires. `$CACHE_BUCKET` is set in a normal working shell, so it resolved a bucket from
      the environment, built, and wrote three objects to the LIVE prod api-cache at 2026-09-05
      18:50:45Z (`fantasy/nfl/weekly/2026/{1/manifest.json,1/players.json}` +
      `fantasy/nfl/weekly/2026/current.json`). Blast radius is bounded and was verified: the prefix
      was previously EMPTY so nothing was overwritten, and nothing can read it (no gateway routes,
      and the Lambda carrying the weekly routes is not deployed). It is still an unauthorized
      outward-facing write on a story that is deploy-held at every ship point, and the cleanup is
      an OPERATOR step because the recursive S3 delete is correctly refused to this session. FIXED
      FORWARD: `--publish` now REQUIRES an explicit `--s3-bucket` and will not inherit
      `$CACHE_BUCKET` — an outward-facing action must not have its target chosen by an environment
      variable the caller cannot see in the command they typed. Guarded two-sided and RED-proven.
