apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: nf-inc-0916-plan
spec:
  goalRef: { name: nf-inc-0916 }
  graph:
    nodes: []   # incident — suppress -> ingest (verify-advance + write-scope) -> class closure -> retrain + measure -> operator un-suppress -> #1137 merge -> lens lift -> closeout
  progress:
    node0: >
      DONE (PR pending). The public weekly page withholds the point, the 80%
      band, the interval bar, the rest-of-season figures and the paid per-stat
      line; statuses (bye chip, opponent), the absence counts and their served
      reasons, weeks-of-form, weeks-left, the framing panels and the provenance
      line all stay. One constant — `WEEKLY_NUMBERS_WITHHELD` in
      `frontend/lib/weekly-suppression.ts` — is the whole lever; the page
      renders through `weeklyRowView`/`weeklyRowOrder` so the withheld and
      restored pages are ONE code path, and the pure function is driven BOTH
      ways in the e2e suite while a rendered clause pins the page to its output
      (the composition, not either half, is the reversal's coverage). The
      rendered clauses branch on the same constant, so the flip carries the
      suite with it rather than demanding a rewrite. 28/28 weekly e2e green
      (desktop + mobile); `tsc` clean; the page's own `metadata.description`
      is flag-driven too, because the shipped one promised exactly what the
      page now withholds.
    node1: >
      DONE (code) — the verification came FIRST and it changed the fix's
      shape, which is exactly what the spec's precondition was for.
      (a) THE SOURCE ADVANCES, measured live 2026-09-15/16: both vendor
      files exist for 2026 and carry week 1 (`stats_player_week` 1,118
      rows; `snap_counts` 1,492). The cadence: an NFL week CLOSES on a
      Monday night (2026 wk1 ran 09-09 → 09-14) and the vendor publishes
      it the NEXT MORNING — `snap_counts_2026.parquet` republished
      2026-09-15T11:25:15Z and `stats_player_week_2026.parquet` at
      14:21:38Z, i.e. 5-8 h after the slate ended.
      (b) THE WRITE SCOPE IS SAFE, and for a reason that is not obvious
      from the write side: `_nflverse_seasonal` reads the WHOLE season
      file every time (nflverse publishes one cumulative file per
      season, not per week), so `replaceWhere season = N` replaces the
      partition with a SUPERSET — cumulative, idempotent. And
      `write_dataframe` SKIPS a 0-row frame, so a not-yet-published week
      can never overwrite a good partition with an empty one. The danger
      is real in general and absent here.
      ⭐ (c) THE CADENCE FINDING THAT CHANGED THE FIX: the roll-forward
      fires MONDAY 06:15 PT (`NFL_ROLL_FORWARD_CRON`). A week closes
      Monday NIGHT and publishes Tuesday morning, so on a weekly cadence
      the just-completed week is missing for a FULL SEVEN DAYS — and
      under the retained-zero convention a missing line is a zero. That
      is this incident recurring weekly at one-sixteenth the size. ⇒ the
      feeds are NOT added to `ROLL_FORWARD_SOURCES`. They are ingested by
      `nfl_weekly_stats_ingest_op`, the FIRST op of
      `sports_nfl_weekly_serving_job`, immediately upstream of the build
      that learns from them — the INC-25 rule in its strongest form (the
      consumer is refreshed downstream of its feed IN THE SAME RUN, so
      there is no cron window and no second schedule that can silently
      revert to STOPPED). `roll_forward.py`'s own scope boundary had
      already said the realized-game stack belongs "on their own
      cadence"; that cadence had never been built.
      ONE OWNER is mechanical: `in_season_stats` asserts at import that
      neither name is in `ROLL_FORWARD_SOURCES`, and a guard clause says
      it by name.
      FRESHNESS CONTRACT: `nfl_weekly_stats_freshness` judges each feed's
      CONTENT (which week it carries) against the SCHEDULE — never a
      Delta commit time (INC-41: a daily re-land of a stale vendor file
      refreshes the commit while the content stands still), and never
      against the feed itself (circular). Five states, and PENDING is
      load-bearing: without it the monitor pages every Monday night on
      the vendor's normal lag, which is how a monitor gets muted.
      SETTLE_HOURS = 24 against a measured 5-8 h lag.
      VERIFIED: the ingest ran end-to-end to a LOCAL Delta root (1,118 /
      1,492 rows, matching the vendor exactly) — zero production impact.
      16 guard clauses green; 18/18 red proof.
    node1_open: >
      ⏭️ OPERATOR: the production backfill has NOT been run from this
      session (it writes production S3). It is listed in the handoff as
      a paste-ready laptop command. ⚠️ NOTE it may be a no-op: the lake
      ALREADY holds 2026 wk1 for both feeds (1,118 / 1,492 rows), written
      2026-09-16T02:43Z as a ONE-OFF — the Delta history shows nothing
      else for these tables since the 2026-07-18 historical backfill,
      while `weekly_rosters` (a real roll-forward source) writes several
      times a day. That contrast is what proves the premise: the rows are
      present and the CADENCE was absent, which is the `stg_ref_players`
      shape and is invisible to a row count.
    node2: >
      DONE (code). TWO refusals on TWO substrates, both RED-proven with
      the exact historical state AND baseline-passed against the real
      lake.
      (1) FRAME-SIDE — `assert_training_stat_coverage` refuses any
      TRAINING week whose share of rows matching a real stat line falls
      below a floor. ⭐ It keys on `_has_stat_row` — whether a stat line
      was JOINED — never on the VALUE that came back, so the
      retained-zero convention is untouched: a player who played and
      scored nothing HAS a stat row and is a true zero. Byes are
      excluded (a bye has no stat line by definition). The target week
      is excluded (it legitimately has no outcome). It refuses an EMPTY
      examination and a frame that lost its columns (NF1.7(a)). It runs
      BEFORE the fit — there is nothing to learn from fabricated labels
      except a wrong P(zero), and the fit is the nine-minute step.
      ⭐ THE FLOOR IS MEASURED, AND THE MEASUREMENT OVERTURNED THE
      INSTINCT. Built through the real code path over 2016-2026 (216
      weeks, byes excluded): per-season minima 0.4157 (2016 wk1) to
      0.6942, medians ~0.68. A 0.60 floor would have refused 5 healthy
      weeks; 0.50 — the instinctive pick — would have refused 1 (2016
      wk1). 0.30 refuses 0 of 216 and sits 0.116 below the worst week
      ever observed, while the defect measures 0.0000.
      (2) MANIFEST-SIDE — `assert_stat_vintage_reaches_training` refuses
      a payload whose `stats_as_of` trails `train_through`. That is the
      incident's own two-field proof: both fields were computed
      CORRECTLY and NOTHING EVER COMPARED THEM. They can disagree
      because `train_through` comes from the training frame's newest row
      (built off the ROSTER spine), so it can name a week whose every
      label was fabricated. A second, independent reading of the same
      defect — the frame vs the artifact a human and the monitor
      actually see.
      TWO-SIDED AGAINST REAL DATA: with today's lake the coverage gate
      PASSES (216 weeks checked, worst 2016-W1 at 0.4157); with 2026
      stats withheld — the state the incident trained on — it REFUSES,
      naming `2026 wk 1=0.0000 (n=520)`. The manifest gate refuses
      ('2025-W18', 2026 wk 1) and passes ('2026-W1', 2026 wk 1).
      19 guard clauses; red proof now 28/28.
    node2_note: >
      ⚠️ ONE EXISTING GUARD WAS RE-ANCHORED, not weakened, and it is
      called out because that is the dangerous-looking edit.
      NF-C6-PH2's `test_the_freshness_op_actually_supplies_the_expected_kickoff`
      AST-scanned the WHOLE job module for a `.classify(` call — correct
      while the module held exactly one. Node 1's freshness op added a
      second, over a different classifier with a different signature, so
      the unscoped form failed on code unrelated to its property. It is
      now scoped to `nfl_weekly_freshness_op`, the op it always meant;
      the assertion itself is unchanged, and a red-proof case shows the
      defect it exists to catch still turns it RED.
    node0_scope_note: >
      ⚠️ RENDERING ONLY, per the spec — the free API and CDN routes still SERVE
      the defective numbers, so a reader who fetches
      `/api/public/weekly-projections` still gets them. That is the spec's
      scope for node 0 (`node 0 touches only its rendering, never the serving
      path`) and the publish-path half is node 2's manifest guard. Stated here
      so the withholding is not mistaken for something stronger than it is.
  closeout:
    verdict: null
    followUps: >
      Findings land HERE. PM triages into: checklist item on the parent card |
      merge into an existing card (name it) | a new spec. Worker sessions never
