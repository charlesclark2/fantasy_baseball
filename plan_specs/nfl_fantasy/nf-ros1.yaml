# Plan spec — NF-ROS1 (FULL tier, MODELING: an honest in-season rest-of-season value —
# preseason prior + 2026 realized production, games-remaining aware)
# Authored by PM 2026-09-17. Commissioned from NF-WVR1's measured gap: NO season-ROS quantity
# exists (the board is deliberately preseason-frozen; the weekly model's ROS is its own
# story). §0.5 discipline binds in full: this is new modeling, registered forward.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: nf-ros1
  vertical: nfl_fantasy
  card: https://trello.com/c/PMVQXY99
  status: CLOSED(CONSTRAINT_REFUSED)  # worker closeout 2026-09-17 — certified NO, nothing ships; pending PM acceptance
spec:
  description: >
    Produce a rest-of-season fantasy value per player that honestly
    reflects both the preseason prior AND 2026 realized production,
    decremented by games played — the quantity WVR1's value column
    and the trade engine (EPIC NF-SEASON member 4) both need, and
    which the codebase measurably lacks: fantasy/nfl/<season>/
    projections.json is preseason-frozen (max g=17 with week 1
    complete; in-season channels are role/health/market only, by
    leakage-safe design — correct for drafting, structurally wrong
    for "what changed since the draft"; Fernando Mendoza topped an
    FA pool at 268.3 having taken zero snaps). best_alpha=0: this is
    a calibration/honesty product — the deliverable includes its own
    registered evaluation and ships only what clears it; the gates
    saying NO is an acceptable outcome and is reported as such.
    ⛔ SUBSTRATE: the preseason board's machinery + realized
    stats_player_week/snap_counts (facts). The WEEKLY model's
    outputs stay out of bounds unless the NF-INC-0916 lift has
    occurred AND this spec's registration explicitly declares which
    output it uses and why — silence means none. ⛔ No fourth
    scorer; fantasy-point translation of any projected stat line
    goes through the existing scoring machinery.
  acceptanceCriteria:
    - description: >
        §0.5 FORWARD REGISTRATION, committed before any fitting:
        (a) the FORM family, declared with mechanism — the natural
        candidate is a shrinkage blend (preseason prior updated by
        realized per-game production with games-remaining weighting)
        but the registration declares the actual family, its
        parameters, and the DEGENERATE ANCHORS it must beat
        (preseason-frozen carried forward; naive realized-per-game ×
        games-remaining; last-N-weeks extrapolation) plus a matched
        foil; (b) the EVALUATION, registered forward: walk-forward
        on historical seasons — predict ROS value at week k from
        data through week k, score against realized rest-of-season
        (the 24-season lake supports this... for NFL use the
        realized weekly history the lake carries; state the seasons
        and weeks used and WHY, before fitting — a window chosen
        after seeing fits is the E2.1-r inversion); (c) the SHIP
        BAR, declared before results: what calibration/accuracy
        margin over the anchors licenses serving, with the honest
        alternative stated (if the blend cannot beat carrying the
        preseason prior forward, THAT is the finding and the
        consumers keep their stated absences); (d) classify_null
        with declared field size; reproduction pins at 1e-9.
    - description: >
        THE WAIVER-SPECIFIC REPLACEMENT LEVEL, same registration
        discipline: the NF-C7/C5/WVR1-measured lesson (draft-VOR
        over a below-replacement pool floats kickers: 14 K / 8 DST
        in a top-25) means cross-position waiver value needs its own
        replacement definition — declare it forward (candidate: the
        best AVAILABLE player per position in a league of the given
        size, i.e. pool-relative), evaluate it on the same
        walk-forward, and ship it only for the surfaces that need
        cross-position comparison; within-position ordering needs no
        replacement arithmetic and ships on the value alone.
    - description: >
        DATA DEPENDENCIES, verified not assumed (the spec-premise
        rule): stats_player_week's recurring ingest is INC-0916's
        (nfl_weekly_stats_ingest_op — confirm its serving state and
        that the #1139-era promote landed; the operator backfill
        covers history either way); games-remaining from the
        schedule with bye-awareness; the preseason prior from the
        board's published projections with its vintage stamped. A
        player with no prior (in-season addition) and a rookie with
        no realized history get DECLARED handling, not NaN
        arithmetic. The NF1.5 contrib-vintage item parked on this
        card (nf1_v1 stamps over an nf1_5_v1 payload, 702/870 rows)
        is confirmed-or-dismissed in passing while the board's
        artifacts are open — one paragraph in the closeout, owner's
        answer, no scope growth.
    - description: >
        DELIVERABLE + BOUNDARIES: a PUBLISHED artifact (per-player
        ROS value + interval + vintage + games-remaining basis) with
        a contract FROM BIRTH (the census discipline: validated
        dump + write-gate + served-bytes assertion — never
        validate-and-discard; the 0917B pattern verbatim) and an
        executing entrypoint smoke from day one. NO serving-page
        code, NO waiver/trade surface changes (WVR1 and the trade
        engine consume the artifact in their own stories); the
        my-teams "preseason" copy fix stands until this artifact
        certifiably replaces the figure it describes. Guards
        RED-proven (unique anchors + baseline-pass + NOT-SELECTED +
        resolve-every-node); per-row fold series for any pooled
        stat; renderers exercised on real producer output. Standing:
        worktree; PR -> dev; >2-min operator paste-ready; no
        Trello; roadmap frozen; findings to closeout.followUps; a
        refused ship bar is closed out as a certified NO, not
        retried with a softer bar (E2.1-r).
---
