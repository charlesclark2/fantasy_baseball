spec:
  description: >
    Close the rookie-path availability gap BEFORE the 2026-08-30 cutdown.
    Both existing availability discounts — the formal RES/PUP/NFI/SUS games
    cap AND the NF-D11 return-from-absence prior — live inside
    project_veterans; project_rookies calls neither (81 of 794 board rows).
    A rookie IR'd at cutdown today receives ZERO discount. Measured basis:
    50/60 historical flagged rookies project above the incumbent's own
    ceiling (Guice, RES all 2018, projected 12.5 games) vs 0/496 veterans;
    the live meter (_warn_formal_tag_without_discount, built by
    NF-INJ-NEWS-1 under PM ruling 2b) reports the current count each build.
    PRIMARY (must land before 8/30): route the FORMAL status cap through
    the rookie frame. SECONDARY (in-story if time permits, else recorded
    for follow-up): the Mendoza stat-line/games decoupling (rookie
    fp_target vs slot-bucket games — NF-INJ1 §2.2), whose surface harm is
    currently contained by NF-INJ1-C suppression. best_alpha=0;
    DEPLOY-HELD; the ship decision returns to the operator with the
    measured board delta.
  acceptanceCriteria:
    - description: >
        FORMAL CAP FOR ROOKIES uses the INCUMBENT CONSTANTS path
        ({RES/PUP/NFI: 4.0, SUS: 7.0} @ blend 0.7), NOT the NF-INJ3b
        hurdle_transfer model — its covariates (prior_games, log1p_prior_fp,
        weeks_since_last_game) are veteran-history quantities a rookie does
        not have; serving it to rookies would be an uncertified
        re-derivation (MH2.1). Record this boundary in the code and the
        closeout. If NF-INJ3b-M's certified artifact later ships for
        veterans, rookies REMAIN on constants until a registered read
        covers them.
    - description: >
        NF-D11 RETURN PRIOR: evaluate applicability on MECHANISM first —
        it conditions on prior-season absence patterns rookies cannot have.
        If the mechanism does not transfer, DO NOT force it: record
        NOT-APPLICABLE-BY-CONSTRUCTION with the reasoning and route only
        the formal cap. Transferring the FINDING, not the feature, is the
        recorded landmine.
    - description: >
        Implementation shape: prefer extracting the availability chain
        (formal cap → NF-D11-where-applicable → reported-absence cap) into
        ONE shared step both frames call, over copy-pasting caps into
        project_rookies — "one logical thing, many owners" is the repo's
        most-repeated defect class, and NF-INJ-NEWS-1 already had to attach
        proj_status to the rookie frame for detection. The reported-absence
        cap's existing rookie wiring must keep working unchanged (its
        guards pin it).
    - description: >
        VERIFICATION AGAINST REALITY, not fixtures (the NF-INJ-NEWS-1
        method lesson): re-run the historical flagged-rookie read (the
        50/60 basis) with the routing in place — flagged rookies must now
        cap; 0 unflagged rows may move. The
        _warn_formal_tag_without_discount meter must read 0 on a healthy
        with-fix build (and its guard proves it still fires when the
        routing is deliberately broken — RED). All existing veteran-path
        outputs byte-identical (this story touches rookies only).
    - description: >
        LEVEL-ADJACENT SHIP PATH (deploy-held, measured before any
        publish): with-fix board dry-run rebuild → diff vs published
        (rookie rows only should move) → placement read + interval reval
        via the --out stems (NF-INJ3b-M's D4 fix — coordinate if not yet
        merged) → ship-decision packet to the operator. ⚠️ Composition:
        NF-INJ-NEWS-1 adoption and NF-INJ3b-M's cap change are also
        pending; the FIRST publish carrying any two of these requires one
        final combined placement + interval read.
    - description: >
        SECONDARY (decoupling): if attempted, scope = the rookie frame's
        games/stat-line coherence only (fp_target and slot-bucket games
        move together); no NF1.5 changes (NF-INJ2b territory); assert the
        NF-INJ1 violation predicate returns zero rookie rows after the fix
        (Mendoza is the live case). If not attempted, record explicitly.
