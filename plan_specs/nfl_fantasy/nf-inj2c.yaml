    verdict: >
      NODE 1 REFUTED (2026-08-29) — the games-floor hypothesis is dead by a two-sided
      measurement, and the story STOPPED at its hard gate and returned to the PM as the
      spec requires. PM re-scope ruling 2026-08-31 resolved the fork to the STRICT-
      DOMINANCE route (see `pmRescope`, transcribed verbatim in the acceptance criteria):
      the PRIMARY full-coherence disposition is RETIRED on the §4 per-stat bound and moves
      to NF-COH2; nodes 3-7 proceed re-scoped. `best_alpha = 0`; DEPLOY-HELD; SERVED_ARM
      stays incumbent until the gated ship path + operator approval.
    followUps: >
      NODE-1 FINDINGS, retained (they are the re-scope's licensing evidence).

      (1) The games floor is INERT on every fold: min proj_games 0.814-1.215 (3.3-4.9x the
      0.25 floor), zero non-finite rows, zero rows at or below it, zero rows the kernel
      floored — by BOTH the recorded `games_floor_binding()` definition and the wider one
      the kernel applies. The mechanism could not act (NF1.9 / NF-D20).

      (2) All 349 violating stat-rows, every arm and fold, are STAT MIX: the multiset a
      rate arm preserves is the FANTASY-POINT rate multiset, not each counting stat's own
      rate. Zero floor, zero clamp-lo, zero pre-existing. `rate_refit` 2019 = LAMAR
      JACKSON, rushAtt 12.44/g vs an all-time 11.73 (1.06x), on 16.5 expected games.

      (3) ⭐ THE §4 BOUND, now the licensing evidence for retiring the primary: the
      envelope is a per-STAT ceiling while every assignment rule permutes a per-PLAYER
      aggregate, so NO aggregate-permuting rule can be coherent BY CONSTRUCTION against
      it. Routed by the PM to NF-COH2 (Backlog), which also owns writing it into
      prod-state.

      (4) The two residual populations, which the ship route MEASURES AND REPORTS rather
      than gates: rate arms at worst 1.06-1.10x with zero rows under 2 expected games;
      `stratified` at 8.57 players/fold on 7/7 folds, worst 1.85x, 36.8% of violating rows
      under 2 expected games, against an incumbent residual of 19.14/fold, 2.51x, 34.2%.

      (5) `nf_inj2_rate_permutation.games_floor_binding()` counts `isfinite(g) & (g <
      FLOOR)` while the kernel floors `~(isfinite(g) & (g > FLOOR))`, so the recorded
      self-check cannot see a non-finite row the kernel does floor. Inert on every
      population measured. Routed by the PM into PLAT-CVP2 (item 2).

      (6) A fresh worktree silently REBUILDS the gitignored NFL feature caches from a live
      upstream, so a reproduction there is measured on a different feature vintage (51/56
      bare vs 55/56 after rsyncing the main checkout's caches). Landed in CLAUDE.md.

      REMAINING FINDINGS from nodes 3-7 land here. PM triages into: checklist item on the
      parent card | merge into an existing card (name it) | a new spec. Worker sessions
      never create Trello cards.
