# RE-SCOPED by PM 2026-08-31 on the node-1 refutation — see `pmRescope` below, transcribed
# VERBATIM. The dispositions it resolves were declared BEFORE any scoring, so the re-scope is
# a choice between pre-declared branches, ⛔ not a post-hoc relaxation (E2.1-r).
