spec:
  description: >
    Fresh forward registration of the ASSIGNMENT-RULE fix — the mechanism
    NF-INJ2b's matched foils actually isolated (+0.4452 CRPS, 7/7 folds,
    p=0.0009, ordering held at all four positions; the rate fit-target
    read mildly harmful, refuting NF-INJ2's stated mechanism). NF-INJ2b
    nulled on (a) a mis-specified coherence gate (=0 demanded of a
    per-fold mean, not attribution-controlled) and (b) DSR 0.9325 vs 0.95,
    POWER_LIMITED at +1 fold. This is the fourth fix-the-spec successor
    (MARGIN2->3, W7->W7b, VAL3->VAL3b). HONESTY CLAUSE (verbatim, per the
    2b session's own seam): the assignment-rule result is settled; what is
    NOT settled is whether that arm can clear a correctly-specified
    coherence clause at all — 8.57 violations/fold is not an edge case a
    tolerance absorbs, and this story may buy a properly-specified record
    of a second refusal. Still funded: either outcome closes the question
    honestly. best_alpha=0; DEPLOY-HELD; SERVED_ARM stays incumbent until
    the gated ship path + operator approval.
  acceptanceCriteria:
    - description: >
        NODE 1 IS A HARD GATE — DIAGNOSE THE GAMES-FLOOR FIRST: establish
        or refute the hypothesis (assignment floors at max(games, 0.25)
        while the check uses real games; surviving evidence is only a
        count+position, 2019/QB/1 player — the row is gone). ⛔ IF REFUTED:
        STOP after node 1 and return to the PM — clauses below get
        re-scoped BEFORE the pre-registration is written, not after. Only
        a confirmed-or-refuted mechanism licenses a tolerance.
    - description: >
        THE PRE-REGISTRATION (committed before any scoring) carries:
        (a) the coherence clause declared FORWARD — attribution rule +
        tolerance, designed on the node-1 diagnosis, never "=0" of a
        per-fold mean; (b) primary arm = the assignment rule in point
        space (stratified's isolation), with the 2b field members carried
        by name; (c) the +1-fold question settled on DATA-FIDELITY grounds
        (the 2019-2025 window was inherited from NF1.5 score_from, not
        chosen — extend to 2018 only if data-honest, declared forward;
        admissible because classify_null read POWER_LIMITED with a
        reachable fold, not an NF-D18 trigger); (d) V-membership, BH
        family, pbo_application="field", and the positive control per the
        2b conventions (note PLAT-CVP2's CONSTRAINT_BLOCKED fix may not
        have landed — if BLIND fires on injection-invariant gates, carry
        the 2b annotation pattern).
    - description: >
        ⚖️ PM RE-SCOPE RULING 2026-08-31 (node-1 refutation) — TRANSCRIBED VERBATIM,
        PM-AUTHORED. It SUPERSEDES the disposition ordering in the clause below,
        which is left in place unedited because the branches it declares are what
        the ruling chooses between (E2.1-r: a pre-registration is not rewritten,
        it is resolved).

        "1. THE PRIMARY DISPOSITION (full coherence restoration) is RETIRED FOR THIS
        STORY, on the §4 bound as the licensing evidence: the envelope is a per-stat
        ceiling and every aggregate-permuting rule is structurally incapable of zero
        against it — points_rate_permute's own 1.09x residual proves it. Demanding =0
        of this family is the decision-in-a-gate's-clothing the program refuses. The
        full-coherence question moves to NF-COH2 (PM-carded: the per-stat mechanism +
        the new ordering mechanism it requires — options (a) and (c) merged,
        post-Week-1, bounded by §4).

        2. THE REGISTERED SHIP ROUTE is the STRICT-DOMINANCE disposition, alone:
        stratified vs the SERVED incumbent, forward margins on EVERY measure —
        violations/fold, worst-x, give-back %, CRPS, per-position ordering, interval
        floors — improve-or-tie everywhere, regress nowhere. Coherence is MEASURED AND
        REPORTED (both residual populations, per your §2 table), never gated at zero.

        3. THE GIVE-BACK RE-MEASURE IS A PREREQUISITE, exactly as you flagged: the
        82.70% -> 27.85% figures rode a board whose pin failed at 40.58/797 rows.
        Capture-pin a fresh board + market snapshot (the D3 convention) and re-measure
        the give-back and the coherence table on it BEFORE the prereg quotes any
        number. If the re-measured dominance no longer holds on any dimension, that is
        a NULL, not a margin to adjust.

        4. THE +1 FOLD is registered forward on the data-fidelity ruling already given
        (2018 admitted only if data-honest; state the finding either way). DSR at 8
        folds is then a real gate, not a formality — 0.9325 at 7 does not guarantee
        0.95 at 8.

        5. DISCLOSURE IS PART OF THE SHIP: the residual impossible lines (8.57/fold,
        incl. Easton Stick) remain covered by NF-INJ1-C's suppression and NF-RATE1's
        rate-line fix (in flight — coordinate only at the level of confirming its
        guards stay green on your counterfactual; no shared files). The operator packet
        states plainly: this HALVES the incoherence and the give-back, it does not end
        them, and NF-COH2 is the recorded successor for the rest."

        HONESTY FRAMING for the record (PM, verbatim): "if this clears, Week 1 ships a
        board that is strictly better on every measured dimension with its remaining
        defects disclosed — which is what the identity actually demands; if it nulls on
        the re-measure, the question closes at a specification nobody can argue with.
        Either way the thread ends honestly."

        ⛔ SEQUENCING THE SESSION ADDS, so ruling 3 cannot re-import the inversion it
        exists to prevent: the re-measure shows the ARM's numbers, and margins written
        after seeing them would be reverse-engineered from the result (E2.1-r). So the
        margin CONSTRUCTION RULE — how every forward margin is derived, from DESIGN
        quantities only (a measurement's own precision, a per-fold SE), never from an
        observed gap — is committed BEFORE the re-measure runs; the re-measure then
        fills in the SERVED INCUMBENT's baseline through that already-committed rule.
        Ruling 3's pre-committed NULL branch is what makes this safe either way.

    - description: >
        REGISTERED DISPOSITIONS, in order (PM ruling on 2b §9#2, declared
        HERE forward — 2b's record is never re-read on this):
        PRIMARY: full coherence restoration under the correctly-specified
        clause + all standing gates -> the normal gated ship path.
        SECONDARY — STRICT-DOMINANCE-IMPROVEMENT: shippable ONLY if the
        arm improves or ties EVERY registered coherence + give-back
        measure vs the SERVED incumbent (violations/fold, give-back %,
        each declared with a forward margin) AND regresses NOTHING
        (ordering per position, CRPS, interval floors) — with the residual
        incoherence still disclosed on-surface (NF-INJ1-C suppression +
        chips remain load-bearing and their guards must stay green on the
        counterfactual). A dominance ship is still deploy-held to the
        operator with the full measurement.
        NULL: closes cleanly with its class; no re-test trigger unless
        genuinely reachable.
    - description: >
        Carried executions from 2b's rulings: D4 — the marked annotation
        on NF-INJ2's give-back figure (self-referential apply_2026
        baseline; the figure did not decide that verdict; pointer to the
        forward fix) — annotate, never re-run; D3 — the pin-against-
        capture landmine appended to CLAUDE.md in the staged wording
        (a repro pin over a live-snapshot-fed surface pins a captured
        artifact, not a re-pull); plus the 2b uniform-injection/PBO
        lesson if not already landed.
    - description: >
        Reproduction discipline per the D3 convention: capture the board
        + its market snapshot at study start and pin against the capture;
        record the freshness reading beside it. Standing rules: no bitwise
        comparisons (population-scoped 1e-9; rookie-band motion vs a
        >=5-draw same-commit envelope); RED-proofs with unique mutation
        anchors (the 2b harness lesson); >2-min commands to the operator
        paste-ready; run the owning CI shard for any shared guard touched.
    - description: >
        IF EITHER SHIP DISPOSITION FIRES: the level-adjacent path —
        counterfactual rebuild, diff, placement read + interval reval via
        --out stems, served give-back measured with the FIXED apply_2026
        (arm-independent baseline), operator packet with top-25 moves per
        config incl. superflex; combined read on the exact
        publish-candidate board; the publish decision is the operator's.
