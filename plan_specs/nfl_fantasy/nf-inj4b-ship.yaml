apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: nf-inj4b-ship-plan
spec:
  goalRef: { name: nf-inj4b-ship }
  graph:
    nodes: []   # MINI tier — precondition verify -> wiring+NF-C9 (one PR) -> measurement battery -> operator packet -> publish is the operator's -> closeout
  closeout:
    verdict: >
      SHIPPED 2026-09-14 — the operator said YES, merged to dev then main, and fired
      `sports_nfl_board_publish_job` by hand rather than waiting for the 07:15 PT
      schedule. The served board carries the discount: the manifest stamp reports
      `serving_enabled: true`, `feed_readable: true` and 60 eligible rows, and 54 of
      58 scoreable captured rows moved (45 exactly onto the first-order figure, 9
      within the measured base-drift envelope of a three-days-fresher rebuild).
      ⚠️ VERIFICATION IS NOT YET CLEAN, AND THE GAP IS IN THE CHECK, NOT THE SHIP:
      `--verify-published` flagged 4 rows and asserted "the discount is not reaching
      the served board", a claim it could not support — it compares the live board to
      an expectation captured three days earlier, so it cannot tell a missed discount
      from a BASE that drifted by more than the discount, and those 4 carry the four
      SMALLEST discounts in the set (0.067-0.152 games against a board rounded to one
      decimal). NF-INJ4b-VERIFY (this follow-up) makes the build RECORD what it moved
      and the check read that, so the next publish settles it from ground truth rather
      than inference. Until that board is published the per-row question is OPEN and
      is reported as AMBIGUOUS, never as a pass.
      The ORIGINAL verdict, unchanged: WIRED_AND_MEASURED. The precondition
      PASSED on all three clauses (counterfactual exists; §3 no-op control PASSED
      across 14 boards at 0 max rank move / 1.0000 agreement; the run priced the
      CERTIFIED winner `desig_x_practice`, whose constants re-derive exactly and in
      which the registered-arm ×0.8682 appears nowhere). The wiring, the NF-C9
      retirement and the changelog ship as ONE PR; the battery ran on the captured
      publish candidate and the operator packet is generated from it. ⚠️ MERGING THE
      PR IS THE DEPLOY — the board is published by a RUNNING Dagster schedule off the
      box image, so there is no later publish gate; that is why the copy rides the
      same PR. The capture-pinned REBUILD is NOT reachable from a laptop (the D3
      precondition was RUN and REFUSED; the served board's ecr_as_of 2026-09-10 is
      unrecoverable — FantasyPros serves only the current snapshot) and remains the
      operator's step, so every packet figure is FIRST-ORDER and says so.
      best_alpha = 0; nothing was published.
    nextActions: >
      ⏱️ TIME-CRITICAL — THE PUBLISH CADENCE FALLS OFF A CLIFF ON 2026-09-15.
      `is_draft_season` is Aug 1 → Sep 15, so `sports_nfl_board_publish_schedule`
      fires DAILY at 07:15 America/Los_Angeles only through Tue 2026-09-15 and then
      drops to WEEKLY (Mondays). Remaining daily fires: Mon 2026-09-14 and Tue
      2026-09-15. The next one after that is Mon 2026-09-21. Every action below is
      dated against that, not against "the next publish".

      (A) CLOSE THE PER-ROW VERIFICATION — operator, LAPTOP, ~30 s. ⛔ BLOCKED until
      NF-INJ4b-VERIFY (PR #1104) is promoted dev → main AND the Orchestration CD
      deploy completes: `rows_discounted` is written by the BUILD, so it first
      appears on the first publish from an image carrying that code, and MERGING TO
      dev IS NOT ENOUGH — the box image ships from main. Then, after the next 07:15
      PT publish:
      `uv run python -m quant_sports_intel_models.football.nfl.fantasy.run_nf_inj4b_ship_battery --verify-published`
      EXPECT `the discount moved N of N designated row(s) at build time` ⇒ the four
      rows flagged on 2026-09-13 were BASE DRIFT and this story closes clean. If N is
      short of the designated count there IS a per-row gap and the check now names it
      instead of gesturing at the whole board. ⚠️ If the promotion misses both 09-14
      and 09-15, the next opportunity is 09-21 — a full week of the season served on
      a per-row claim nobody has checked, which is the whole reason this is dated.

      (B) DECIDE `DNR` / `NA` — PM. No hard deadline, but it costs continuously: the
      build logs 16 player(s) carrying game-status tokens it cannot read (NA ×14, DNR
      ×2). They render "unknown" and take NO discount, which is safe by construction
      — but if either is a real designation we are declining to price 16 live rows
      every week of the season, and that ALERT line is the only place it surfaces.
      Resolution is one entry in `sleeper_injuries_source.WEEKLY_DESIGNATIONS` plus a
      constant, or an explicit decision that the token is not priceable.

      (C) NOTHING IS BLOCKING AND NOTHING NEEDS ROLLING BACK. The board serving today
      is correct: the manifest reports `serving_enabled: true` / `feed_readable: true`
      / 60 eligible rows, and 54 of 58 scoreable captured rows moved. (A) settles a
      MEASUREMENT question about four rows, not the ship.

    followUps: >
      (0) ⭐⭐ A POST-PUBLISH CHECK THAT INFERS FROM A CAPTURED BASELINE WILL EVENTUALLY
      ACCUSE THE SHIP IT GUARDS. This one did, on its first real run, four hours after
      merge — it rendered "this row's base drifted" and "the wiring is broken"
      identically and resolved the ambiguity toward the alarm. Two separate causes,
      both now fixed: it had no state for a player CLEARED since the capture (carrying
      no discount is CORRECT for him), and it inferred application from a board whose
      pre-discount base it cannot observe. The cure is the principle the exporter's own
      freshness block already states one function over — read what the BUILD wrote,
      never re-derive at read time, because re-deriving answers a different and more
      flattering question. `rows_discounted` now rides the served manifest; an absent
      one is UNKNOWN, ⛔ never zero. ⚠️ A SECOND FINDING FROM THE SAME RUN: the build
      logs `[ALERT] NF-C9: 16 player(s) carry a game-status value this build does not
      recognise {'NA': 14, 'DNR': 2}`. Those 16 render "unknown" and take NO discount
      (safe by construction), but if DNR/NA are real designations we are declining to
      price 16 live rows, and that log line is the only place it surfaces — a PM call,
      carded rather than decided here.

      (1) ⭐⭐ GUARD THE WIRING, NOT TOKEN SPELLINGS — the whole 52-clause NF-C9 suite
      passed GREEN over the wired discount that made its copy false, because its
      boundary clause scanned three token spellings in `season_projection.py` while
      the feed read and the caller live one and two modules over. Re-keyed here; the
      class is worth a sweep of other "the code form of the copy clause" guards.
      (2) ⚠️ `run_nf_inj4b_counterfactual`'s RENDERER prints PRESEASON prose over
      IN-SEASON data — §1 says "-4 days before Week 1" and "the preseason shape" for a
      run four days after kickoff, and §5's "Today's zero is the SCOPE RULE refusing
      every row" is emitted UNCONDITIONALLY and is false on a run that moved 549–640
      ranks per board. The JSON is correct throughout. Deliberately NOT edited (a
      decided story's artifact; re-running it is the operator's command), and this
      story quotes the JSON instead — but a reader trusting the narrative over the
      table reaches the opposite conclusion. Needs a PM call: fix the renderer, or
      annotate the artifact.
      (3) `assert_vintages_match` is pinned to NF-INJ2c's baseline directory, so its
      refusal quotes THAT manifest's vintages rather than the caller's capture. The
      verdict stays right; the quoted figures describe a different board. Worth a
      `manifest_path=` parameter so a later story's pin reports its own capture.
      (4) The market caches are gitignored, so a fresh worktree reads every vintage as
      None and a pin is unreachable there. The durable habit — capture the board AND
      its market inputs together, promptly after a publish — is recorded in the battery.
      (5) Population facts for the next designation story: no rookie on the current
      board carries a weekly designation (all 60 designated rows are veterans), and 16
      players carry a feed value we cannot interpret (disclosed as unknown, priced at
      nothing).
      (6) The manifest's new `designationDiscountStamp` records the CONFIGURED policy
      and the ELIGIBLE population only. The decisive per-row evidence is
      `nf_inj4b_ship_expected_effect.json` + `--verify-published`; if a future story
      wants the stamp to say what the build DID, the per-row
      `_designation_discount_applied` column would have to reach the artifact (it is
      currently build-time scaffolding, deliberately excluded from OUTPUT_COLS).
