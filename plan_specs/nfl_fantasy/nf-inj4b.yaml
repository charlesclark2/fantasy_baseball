      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 1-prereg
        desc: "Fresh registration: matched-resolution anchor (both readings named), forward invariance declarations, honesty clause verbatim — committed BEFORE scoring."
      - id: 2-run
        desc: "Decisive run (~1s compute; still slice-timed for honesty; operator handoff if anything >2 min)."
