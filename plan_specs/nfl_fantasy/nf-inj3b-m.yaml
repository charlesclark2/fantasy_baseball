spec:
  description: >
    Close NF-INJ3b's blocking §5(d): MEASURE the served-point impact of the
    certified injury-games caps, and build the serving artifact for the
    certified arm so the measurement is of the thing that would actually
    ship. NF-INJ3b CLEARED 9/9 on hurdle_transfer (a fitted GLM hurdle:
    P(plays>=1) x E[games | plays>=1] over onset_carryover,
    weeks_since_last_game, prior_games, log1p_prior_fp, is_qb). PM ruling
