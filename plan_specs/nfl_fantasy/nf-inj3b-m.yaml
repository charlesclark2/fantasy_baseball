    best_alpha=0; DEPLOY-HELD throughout; the ship/no-ship returns to the
    operator with the measurement. NO --publish anywhere in this story.
  acceptanceCriteria:
    - description: >
        Persisted serving artifact for the fitted hurdle_transfer object
        (versioned, stamped into NF-G0 conventions like level_model_version),
        with a guard proving the served object reproduces the validated
        arm's predictions (pin 1e-9) — not a re-fit.
    - description: >
        Counterfactual 2026 board rebuilt DRY-RUN on that artifact (RES/PUP
        via hurdle_transfer; SUS/NFI via incumbent constants). Diff vs the
