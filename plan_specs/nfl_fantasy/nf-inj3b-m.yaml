apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: nf-inj3b-m-plan
spec:
  goalRef: { name: nf-inj3b-m }
  graph:
    nodes:
      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 0b-claude-md
        desc: "Separate commit: the D3 artifact-provenance rule appended to CLAUDE.md."
      - id: 1-runner-out-stems
        desc: "D4 fix + RED-proof (do this FIRST so the rest of the story uses it)."
      - id: 2-serving-artifact
        desc: "Persist + version the fitted hurdle_transfer; reproduction guard at 1e-9."
      - id: 3-counterfactual-rebuild
        desc: "Dry-run board rebuild (RES/PUP arm + SUS/NFI incumbent); NO --publish. Rebase on dev first if NEWS-1 landed."
      - id: 4-diff-and-reads
        desc: "Published-vs-counterfactual diff + counterfactual placement read + interval reval via --out stems."
      - id: 5-packet-closeout
        desc: "Ship-decision packet to the operator; verdict + findings into closeout.followUps."
  closeout:
    verdict: >
      MEASURED — NF-INJ3b §5(d) is CLOSED. Nothing shipped; nothing published;
      `injury_games_policy.SERVING_ENABLED` is False on disk. The ship/no-ship is
      the operator's, and this hands over the measurement it was blocked on.
      ⭐⭐ THE RESULT VINDICATES THE REFUSAL TO ESTIMATE. Flagged (22): mean
      Δgames −2.610 but mean Δpts(PPR) only **−1.234** (median −0.488; 19 down,
      3 UP; 17 rank moves, worst −82). UNFLAGGED: **348 players' POINTS change
      and 517 change rank**, and the LARGEST single point move on the whole board
      (**11.46 PPR**) lands on an UNFLAGGED player — ~9× the mean move on a
      flagged one. GIVE-BACK: with NF1.5's re-order disabled the same cap change
      moves the flagged players −12.06 PPR; with it enabled, −1.23 ⇒ **~90% of
      the raw point impact is absorbed and REDISTRIBUTED**. A proportional
      estimate would have been wrong by an order of magnitude AND structurally
      blind to the 517 unflagged rank moves.
      NOISE FLOOR MEASURED FIRST (the baseline built twice): replicate max |Δ|
      3.6e-15 games / 3.1e-13 pts and an IDENTICAL replicate rank order, so every
      move reported is readable and none is build noise.
      Per-config placement across all 14 published configs; superflex_10/12 read
      on their OWN rows (max |move| 120/112 vs a non-superflex range 62–164),
      because NF-TR2b's VOR shield is ADDITIVE-only and does not cover a
      cross-pooled QB. Band integrity measured on BOTH boards; the COVERAGE half
      stays `run_interval_revalidation`'s job and passes (ALL FLOORS MET).
      Delivered: the certified hurdle PERSISTED as a versioned coefficient table
      reproducing the validated arm at EXACTLY 0.0 (tol 1e-9) with the writer
      REFUSING to write if it missed; the D4 `--out` fix with a live two-sided
      proof that the DEFAULT invocations no longer touch either decided artifact;
      the D3 provenance rule in CLAUDE.md. Guards: 106 tests, RED proofs 22/22
      and 25/25. best_alpha=0 throughout.
    followUps: >
      Findings land HERE. PM triages into: checklist item on the parent card |
      merge into an existing card (name it) | a new spec. Worker sessions never
      create Trello cards.

      (1) ⭐ A PUBLISH-TIME STAMP GUARD IS THE MISSING SAFETY NET, and this story
      created the need for it. Serving the certified arm requires a covariate feed
      (`onset_carryover`, `weeks_since_last_game`, `log1p_prior_fp`) that exists
      NOWHERE in the board build — it is now an optional parameter threaded
      build_projection -> build_veteran_projection -> project_veterans plus
      `--injury-covariates`. Because `project_veterans` is ALSO called by NF1.5's
      INTERNAL research-frame assembly (which legitimately has no feed), a call
      site DECLARES `feed_supplied=False` and gets the incumbent on a RECORDED
      path. The residual risk is real and named: a SERVED build that forgot its
      feed would quietly ship the incumbent under the fitted arm's stamp. The
      guard belongs on the ARTIFACT at publish (does the published board carry
      `injury_games_model_version` == the fitted version, and do the flagged rows
      actually differ from the incumbent cap?) — the NF-K1 lesson, and it should
      land in the same change as any flip.

      (2) ⚠️ THE PM's SHIP DECISION NOW HAS A DIFFERENT SHAPE THAN WHEN IT WAS
      FRAMED. NF-INJ3 sold this as "22 draftable veterans are served at ~2× their
      fitted availability." That is true of `proj_games` and is ~90% UNTRUE of the
      served POINT: after NF1.5 the flagged players move −1.23 PPR on average and
      three move UP, while the largest single point move on the board lands on an
      UNFLAGGED player. So the honest product question is no longer only "are the
      caps too high" but "do we accept 517 unflagged rank moves and a
      redistribution of ~90% of the discount as the price of a more accurate
      `proj_games`?" — a question about NF1.5's ordering step as much as about the
      caps. NF-INJ2b (the ordering-learner successor) is where that lives.

      (3) A DEFAULT-STEM CHANGE ON A STANDING JOB, flagged for reversal if the PM
      disagrees: the D4 fix makes `run_interval_revalidation` and
      `run_nf_tr2b_placement_read` write to a NEUTRAL `<stem>_latest` path by
      default, so refreshing NF1.9's / NF-TR2b's decided record is now an explicit
      `--out <decided stem>`. That follows the spec's wording ("the DEFAULT
      invocation no longer rewrites ...") and both runners SAY so loudly on every
      non-decided write, but it does change the standing ANNUAL interval
      re-validation's default output path. One-line reversal if unwanted.

      (4) TWO DEFECTS FOUND ONLY BY RUNNING IT, both fixed: (a) a wrong NF1.5
      report suffix made `load_selection` return {} so the re-order scored 0 of
      758 veterans — the board still built and the diff still printed a confident
      number, which was the proportional answer in disguise (now refused by
      `_assert_reorder_fired`, reading the shipped build's own `capture`
      OUT-param); (b) forcing the policy on process-wide killed the entire build
      via NF1.5's internal `project_veterans` calls. Neither was visible in code
      review or in a green suite. ⭐ (a) is also what produced the −12.06
      comparison that quantifies the give-back — the accident became the control.

      (5) The board build is NOT bit-deterministic run to run (ULP-level drift on
      ~156–224 of 794 rows with byte-identical code). It cannot move a rank and it
      is far below any effect here, but any future board diff should measure its
      own replicate floor rather than credit every non-zero delta.

      (6) UNCHANGED and still open from NF-INJ3b: the cap never reaches a ROOKIE
      (NF-INJ3c), and NF-INJ3-CAP (stop overwriting the Sleeper Delta partition)
      remains non-gating. The PM boundary is ENFORCED IN CODE: SUS/NFI retain the
      incumbent constants, guarded two-sided.

      (7) COMPOSITION, per the spec's binding note — and it was EXERCISED, not just
      noted. NF-INJ-NEWS-1 (PR #1013) MERGED to dev while this story was in flight,
      so this branch was REBASED onto the merged dev as the spec's OverlapCheck
      requires. `run_season_projection.py` conflicted (both stories add an
      availability feed to the same call chain) and was resolved as a UNION —
      neither side dropped; taking a side would have silently reverted a sibling
      PR's wiring. Verified after the rebase: NEWS-1's 48 tests pass and its
      29-clause RED proof still fully bites, and the union carries BOTH paths
      (`reported_absence_*` 12 references, `injury_covariates` 7).
      ⭐ THE COMPOSITION QUESTION WAS THEN MEASURED, not assumed: the whole
      counterfactual was RE-RUN on the post-NEWS-1 tree and every substantive
      figure is IDENTICAL (flagged mean Δpts −1.2341, Δgames −2.6104; unflagged 348
      points / 517 rank moves; `per_config_placement` and `band_integrity`
      byte-identical). Only `generated_at`, the fresh replicate noise measurement
      and sub-1e-9 row values move. ⇒ NEWS-1's step is INERT on today's board (its
      disjointness rule holding, and it is itself deploy-held), so this
      measurement stands as recorded.
      ⚠️ That does NOT retire the spec's binding note: NEWS-1 is inert only while
      it has no seeded override rows and stays deploy-held. The FIRST publish
      carrying BOTH changes live still needs ONE final combined placement +
      interval read before the operator approves it.
