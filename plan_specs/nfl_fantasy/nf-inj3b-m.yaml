# Plan spec — NF-INJ3b-M (measurement + serving-artifact story; closes NF-INJ3b §5(d))
# Authored by PM 2026-08-23 per rulings D1=A, D2=A, D3=accept, D4=fold-in.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: nf-inj3b-m
  vertical: nfl_fantasy
  card: https://trello.com/c/SGsvQJPb   # continues the NF-INJ3b thread; M card linked on creation
  status: IN_PROGRESS
spec:
  description: >
    Close NF-INJ3b's blocking §5(d): MEASURE the served-point impact of the
    certified injury-games caps, and build the serving artifact for the
    certified arm so the measurement is of the thing that would actually
    ship. NF-INJ3b CLEARED 9/9 on hurdle_transfer (a fitted GLM hurdle:
    P(plays>=1) x E[games | plays>=1] over onset_carryover,
    weeks_since_last_game, prior_games, log1p_prior_fp, is_qb). PM ruling
    D2=A: serve the certified object via a persisted artifact (MH2.1 —
    serve what was validated, never a re-derivation); fitted_status is NOT
    admissible on this study's evidence (4/7, p 0.1265 — post-hoc arm
    choice). PM boundary: certified population is RES/PUP — SUS and NFI
    rows RETAIN the incumbent constants (zero live rows; exploratory
    channels) until a live row exists and a registered read covers them.
    best_alpha=0; DEPLOY-HELD throughout; the ship/no-ship returns to the
    operator with the measurement. NO --publish anywhere in this story.
  acceptanceCriteria:
    - description: >
        Persisted serving artifact for the fitted hurdle_transfer object
        (versioned, stamped into NF-G0 conventions like level_model_version),
        with a guard proving the served object reproduces the validated
        arm's predictions (pin 1e-9) — not a re-fit.
    - description: >
        Counterfactual 2026 board rebuilt DRY-RUN on that artifact (RES/PUP
        via hurdle_transfer; SUS/NFI via incumbent constants). Diff vs the
        PUBLISHED board: pts, proj_games, overall rank, within-position
        rank, per-config placement including superflex_10/12. The NF1.5
        give-back interaction is thereby MEASURED, not estimated — no
        proportional shortcut anywhere.
    - description: >
        Counterfactual placement read (the decision-relevant one) + interval
        revalidation on the counterfactual board, using the --out stems from
        the D4 fix so no decided artifact is clobbered.
    - description: >
        D4 fix shipped: --out stem on run_nf_tr2b_placement_read.main() and
        run_interval_revalidation (including under --no-report); RED-proof
        that the default invocation no longer rewrites
        nf_tr2b_placement_read.* / nf1_9_interval_revalidation.json.
    - description: >
        D3 rule appended to CLAUDE.md (separate commit): "A committed
        ablation artifact must be regenerated from the committed code that
        claims to have produced it — the generating code's commit must be
        the same as or an ancestor of the artifact's commit."
    - description: >
        Deliverable to the operator: a ship-decision packet (moved rows with
        names, rank deltas by config, interval status, the give-back
        measurement) — recommendation permitted, decision not made.
        ⚠️ COMPOSITION NOTE (binding): this measurement is vs today's
        published board; NF-INJ-NEWS-1's measurement is too. The two do NOT
        compose additively — the FIRST publish that carries both changes
        requires one final combined placement + interval read before the
        operator approves it.
