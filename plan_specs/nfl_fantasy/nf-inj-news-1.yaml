apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: nf-inj-news-1-plan
spec:
  goalRef: { name: nf-inj-news-1 }
  graph:
    nodes:
      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 1-schema-and-loader
        desc: >
          Overrides file + loader with the disjointness, cap-only, review_by,
          and normalized-id rules; unit + RED-proof coverage.
      - id: 2-availability-consumption
        desc: >
          Wire the cap into the season availability path beside the formal
          caps; build-log line for every applied AND every ignored override.
      - id: 3-payload-stamp
        desc: "Manifest/payload provenance stamp on affected rows (additive fields only — NF-C0)."
      - id: 4-measure
        desc: "Placement read + interval reval on the with-overrides board; write the report."
      - id: 5-seed-proposal
        desc: "Draft the sourced seed list as a proposal file for operator confirmation."
      - id: 6-chip
        desc: >
          Frontend chip + methodology-panel disclosure — ONLY after NF-INJ1-C's
          PR is merged; rebase on dev first.
      - id: 7-closeout
        desc: >
          Verdict + findings into closeout.followUps; hand the operator the
          publish decision with the node-4 report + node-5 proposal.
  closeout:
    verdict: >
      BUILT AND AMENDED, DEPLOY-HELD. All 7 plan nodes complete, then re-opened
      for PM rulings 1, 2b and 3 (2026-08-23) and closed again. The mechanism
      ships with the curated file EMPTY, so the board is byte-identical to the
      pre-story board until the operator adopts rows. Nothing is published.
      It is an OPERATOR JUDGMENT with provenance, never a model: not fitted,
      never backtested, no accuracy or improvement claim anywhere,
      best_alpha = 0.
      RULING 1 — the combination rule is the REMAINING-SEASON RATE
      (min(current, (17-n) x current/17)); the ceiling it replaced was measured
      inert on 5 of 6 real rows. Effects now: Tyson 13.61 -> 9.608 (-4.003),
      Kamara 11.49 -> 10.139 (-1.352). No inert tier remains and every applied
      row logs its effect size.
      RULING 2b — disjointness turns on whether a formal discount was APPLIED,
      not on whether a tag EXISTS, so a rookie on IR (who receives zero from
      the formal path) is no longer also un-overridable. A board-wide detector
      names every tag-without-discount row on every build; it counts rookies
      explicitly, which required attaching proj_status to the rookie half FOR
      DETECTION ONLY (no discount — the rookie-path fix is NF-INJ3c's).
      RULING 3 — the qualifying policy: regular-season time reported, and
      n >= 2 (mechanically enforced). Four of the six proposed rows fall out on
      BOTH halves; TWO qualify (Tyson 5, Kamara 2). The two disciplinary
      exclusions are confirmed and recorded so they are not re-litigated.
      64 guard clauses, 38/38 RED-proven, plus a rendered-output E2E.
    followUps: >
      1. ✅ RESOLVED BY PM RULING 1 — the cap rule. The ceiling was measured
      inert for 5 of 6 candidates and is replaced by the remaining-season rate.
      Recorded in the acceptance criteria above and implemented; the superseded
      measurement is retained verbatim in
      ablation_results/nf_inj_news_1_board_delta.md §1, because the ruling was
      made on those numbers and a record that rewrote itself would leave the
      decision resting on evidence nobody can check.

      2. ⏭️ OPERATOR STEPS BEFORE THE FIRST PUBLISH: (a) confirm/edit the seed
      rows in data/reported_absence_overrides.proposed.yaml and move the accepted
      ones into reported_absence_overrides.yaml (player_ids are resolved and
      listed in the node-4 report); (b) run run_nf_inj_news_1_measure.py in the
      MAIN CHECKOUT for the A/B board delta and the give-back on this cohort;
      (c) run_nf_tr2b_placement_read --from-dir on the with-overrides board;
      (d) run_interval_revalidation as a regression check. (b)-(d) need the lake
      and the panel caches, gitignored and absent from a worktree (NF-INFRA1).

      3. ⭐ ROUTED BY PM RULING 2a — the rookie population has NO availability
      path at all (the formal RES/PUP/NFI/SUS cap AND the NF-D11 return prior
      both live in project_veterans; project_rookies calls neither, on 81 of
      the 794 rows of the 2026 board). Merged into the NF-INJ3c rookie-path
      bundle card, which the PM promoted to the Sprint with a before-8/30
      target because the IR wave lands at the cutdown onto a population with no
      formal availability path. NOT this story's to build. This story fixed it
      for its OWN cap only, and ruling 2b stops the gap compounding with this
      mechanism. `_warn_formal_tag_without_discount` is the live detector for
      that population and runs on every build.

      4. ✅ CORRECTED — nf_c8_injury_designation_gap.md placed Jordyn Tyson in
      ARIZONA; he is a NEW ORLEANS WR (confirmed against the live Sleeper
      snapshot, team = NO). Fixed in place with a marked factual correction.

      4b. ⚠️ OUT-OF-SCOPE DEFECT ENCOUNTERED AND FIXED, reported rather than
      absorbed: test_ingest_umpires_per_game_skip mocked `insert_rows` with
      `list.extend()`, which returns None, and main() logs it through
      `log.info("Inserted %d ...", loaded)` — a TypeError that fires ONLY when
      the record is actually FORMATTED. That made it order-dependent: green
      alone and on dev, red under -n 4 once this story's added tests shifted
      xdist's distribution. Fixed in the test (one line, no production change).
      ⭐ THE UNDERLYING MECHANISM IS NOT FIXED AND IS WORTH A PM DECISION:
      scripts/ingest_umpires.py calls logging.basicConfig() AT MODULE SCOPE,
      which is the import-time global mutation CLAUDE.md forbids precisely
      because it makes results depend on which shard a test lands in. Left
      alone here because changing it could alter logging on the box.

      5. ⏳ SHELF LIFE: the 2026 cutdown to 53 is 2026-08-30. This whole
      population exists because IR placements have not happened yet, and several
      candidates are described in reporting as IR candidates once teams cut down.
      Every proposed review_by is set to the cutdown. The design handles the
      transition automatically (the formal path wins and the override is ignored,
      named in the build log) — but the seed list itself goes stale fast.

      6. ⭐ METHOD NOTE for the next session in this area: two real defects in
      this story were invisible to 44 passing guards and were found ONLY by
      resolving candidates against the REAL published board — the rookie wiring
      gap and the inert-cap measurement. A synthetic fixture cannot know which
      production function built it.

