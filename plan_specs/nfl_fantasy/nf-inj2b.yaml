  closeout:
    verdict: >
      DECISIVE RUN COMPLETE (operator, 2026-08-29, 48.5s, 7 folds 2019-2025). VERDICT **NULL** on
      the pre-registration's §6 branch 3 — the winning arm does not restore coherence. `best_alpha
      = 0`; DEPLOY-HELD, `SERVED_ARM` still `None`, `GATE_STATUS` now `NULL` and pinned to the
      committed report by a guard.

      ⭐ THE HEADLINE, AND IT REFUTES THIS STORY'S OWN PREMISE ON THE STORY'S OWN TERMS. NF-INJ2's
      refusal was attributed to a MECHANISM — "the ordering learner is fitted on season POINTS, so
      handing it a RATE multiset asks a question it was never validated on." Re-fitting the learner
      on a per-game rate target does NOT restore the ordering constraint: `ordering_not_regressed`
      reads **False** for `rate_refit`, `rate_refit_stratified`, `rate_refit_reselect` AND for both
      points-fitted rate-assignment arms. The matched pair that isolates the fit target puts it at
      **-0.0873 CRPS, positive in 1 of 7 folds, one-sided p = 0.977** — the rate target is, if
      anything, mildly HARMFUL. Meanwhile the pair that isolates the ASSIGNMENT rule in POINT space
      (`stratified` - `incumbent`) puts it at **+0.4452, 7/7 folds, p = 0.0009**, and `stratified`
      holds the ordering constraint at every position. ⇒ the lever is the ASSIGNMENT rule, not the
      fit target; NF-INJ2's stated mechanism is refuted by a matched foil exactly as NF-D15 (g')
      refutes a winner's stated mechanism — here applied to a REFUSAL's stated mechanism.

      WHY IT IS STILL A NULL. `stratified` wins the selecting metric, clears fold consistency (7 of
      a calibrated 6 required), BH-FDR (p = 0.0009), the degenerates, the own-form ceiling and the
      ordering constraint — and FAILS `coherence_restored` (8.57 violating players/fold in-fold; 7
      attributable on the 2026 board). Coherence is the correctness constraint the whole story
      exists to satisfy, so the pre-registered branch refuses it. It also fails DSR (0.9325 against
      0.95); `classify_null` reads that leg **POWER_LIMITED** at +1 fold, with
      `field_remedy_admissible = False` (the <=7-arm figure is arithmetic, never advice - MH2.2).

      PRECONDITION VERIFIED FROM INSIDE THE SERVED ARTIFACT, not assumed — `nf_inj2b_rate_ordering.SERVED_ARM` is `None`, so
      the board keeps serving NF-INJ2's `incumbent`, and `assert_coherent()` runs at import and
      refuses a flag flip the record does not support.

      PRECONDITION VERIFIED FROM INSIDE THE SERVED ARTIFACT, not assumed: the flip board reads
      `injuryGamesStamp.verdict = FLIPPED_AND_MOVED` (passed, 25/25/25 fitted rows moved, max move
      4.00 games), Alec Pierce at g = 3.7, 'AJ Dillon' present (the 32 all-caps names are D/ST),
      the injury input 0.8h fresh against its 72h bar, `reportedAbsenceCount = 0` and 11 coherence
      violations. Nothing was reversed on 2026-08-25 and the board has republished twice since with
      the flip intact, so the flip board IS the baseline.

      WHAT WAS BUILT — a 10-arm field declared on MECHANISM before any scoring: a 2x2 over the two
      factors NF-INJ2's own diagnosis names (the score's FIT TARGET x the multiset ASSIGNMENT rule),
      plus the two NF-INJ2 members the spec carries by name and two pre-registered degenerates. The
      four specification items NF-INJ3's null turned on are fixed FORWARD: `V`'s membership
      (degenerates AND the `incumbent` reference arm excluded per DSR-CONV + MH2.1 (a), `n_trials`
      at the full declared field), the BH family named per leg, `pbo_application="field"`, and the
      injected-effect positive control declared APPLICABLE with its reason (arms 2-6 are near-clones
      on the assignment axis). The ordering constraint is NF-INJ2's bar VERBATIM, not relaxed.
    followUps: >
      ══ POST-RUN (2026-08-29) — findings from the decisive run itself ══

      (A) ⚖️ NEEDS YOUR CALL — A DEFECT IN THIS STUDY'S OWN COHERENCE GATE, FOUND AFTER THE RUN,
      RECORDED RATHER THAN REPAIRED. `coherence_restored` demands `= 0`, and its input is (i) a
      per-fold MEAN and (ii) NOT attribution-controlled, though the gate's own comment says
      "attributable". No eligible arm reaches exactly 0: `rate_refit` carries ONE violating player
      in ONE of seven folds (2019 only) for a mean of 0.1429. So the pre-registration's claim that
      the rate arms are "coherent BY CONSTRUCTION" is REFUTED at the edge, and the gate reads False
      for every arm in the field. ⛔ NOT re-scored: relaxing a gate after seeing it fail is the
      E2.1-r inversion in its most literal form, and the verdict is robust to it either way (the
      winner `stratified` fails coherence at 8.57/fold in-fold and 7 attributable on the board under
      ANY tolerance). What it DOES change is the reading of item (B). The legitimate remedy is a
      SUCCESSOR whose coherence clause declares its attribution rule and its tolerance FORWARD —
      the MARGIN2->3 / W7->W7b / VAL3->VAL3b shape, four times now.

      (B) ⭐ THE POSITIVE CONTROL RETURNED `BLIND`, AND THE MEASURED MECHANISM OF THE BLINDNESS IS A
      DETERMINISTIC CONSTRAINT, NOT STATISTICAL INSENSITIVITY — a distinction PLAT-CVP1's taxonomy
      cannot currently express. `BLIND` means "a null from this family is free." But the blocking
      table shows `stratified` and `feasibility_clamp` blocked under injection by
      `coherence_restored` ALONE — every metric gate AND `dsr` fire correctly for them at the
      injected effect. Since the injection moves CRPS and tier-rho and cannot move a board's
      coherence, that gate is INJECTION-INVARIANT, so the control could not have returned anything
      but BLIND however sensitive the family is. ⇒ this is NF-D18's `CONSTRAINT_REFUSED` — the state
      the seven-state null taxonomy had to add because it classified only STATISTICAL nulls —
      appearing one level up, inside the positive control. The honest reading is neither "the null
      is free" nor "the family is fine": the family's statistical half demonstrably fires, and its
      verdict is decided by a hard constraint no injection can reach. ⭐ SUGGESTED INSTRUMENT FIX
      (cross-vertical, your call whether to card): `injected_effect_positive_control` should take a
      declared set of INJECTION-INVARIANT gates and report `CONSTRAINT_BLOCKED` when the only
      blockers are in it — otherwise every study carrying a deterministic constraint gets a `BLIND`
      badge that reads as "your gates are worthless" (the MH2.7 lesson: a defect corrected N times
      downstream is a defect in the INSTRUMENT).

      (C) ⭐ A RENDER DEFECT THAT MADE THE RECORD CONTRADICT ITSELF, FIXED WITHOUT A REFIT. The
      leaderboard's coherence column printed a per-fold MEAN at 0 decimals, so `rate_refit`'s real
      0.1429 RENDERED AS "0" — one page above a `coherence_restored` gate that demands exactly 0 and
      read False. The table asserted and the gate denied the same fact about the same number (E9.61),
      and the rounding is what hid finding (A) from a reader. Fixed by adding `--rewrite-report`,
      which re-derives the markdown from the COMMITTED json with zero re-scoring (the NF-W2e rule:
      derive the report at report time, so correcting a wrong record never costs a decisive re-run —
      which is the pressure that leaves a known-wrong record published). Every number through
      tier-rho is byte-identical after the re-render; only the coherence column's representation
      changed, and it now carries the fold count beside the mean.

      (D) ⚠️ THE REPRODUCTION PIN FAILED — 40.58 worst absolute difference over 797 rows against a
      0.05 tolerance — and the freshness gate PASSED (7.30h against a 48h bar) on the same run. The
      two are asking different questions and the passing one gave false comfort: `--market-refresh`
      pulls a live ADP/ECR snapshot that FEEDS the ordering, so a 7.3h gap is enough for the market
      to swap two players and open a full point-gap at those rows. ⇒ the 48h freshness bar is far
      too loose to support a reproduction pin, and the caveat carried in the pre-registration is now
      QUANTIFIED. What it does and does not invalidate: every arm in §9 is built from the SAME local
      board, so ARM-VS-ARM comparisons (the give-back column, the attributable-violation counts that
      drive the verdict) are internally consistent and the verdict is unaffected; what does NOT
      transfer is treating those percentages as the numbers on the served board. A successor wanting
      a clean pin must build and score inside the publish window.

      (E) 📎 The 2x2 interaction is +0.0482 against a sum-of-halves of -0.1042 — the halves are
      CANCELLING, not additive (NF-W7e). Reading either marginal delta as a measurement of the other
      setting would be wrong in both directions; the joint cell was scored, not inferred.

      ══ PRE-RUN (2026-08-27/28) — findings from building the harness ══

      Findings land HERE. PM triages into: checklist item on the parent card |
      merge into an existing card (name it) | a new spec. Worker sessions never
      create Trello cards.

      (1) ⭐ MEASURED BEFORE ANY SCORING, AND IT BOUNDS WHAT THE STORY'S OWN HEADLINE CAN ACHIEVE —
      recorded in the pre-registration §1b so a weak primary cannot later read as an excuse. The fit
      target reaches `PosRefinedBlend`'s score ONLY through its inner model, which exists only when
      `anchor == "learned"`. RB's selected class (`pos_blend_flat`) anchors on `mvp1_fp`, so at RB
      the rate re-fit is BYTE-IDENTICALLY INACTIVE (measured max |Δscore| = 0.000e+00, confirmed
      0/2 folds active on the smoke). An RB result under the primary is UNINFORMATIVE, never a pass
      (NF-D20) — and the joint criterion now reports the active-cell count beside the pass count.
      It does not threaten the criterion (RB was not the breached position), but it had to be
      measured rather than discovered. ⚠️ AND WHERE THE RE-FIT IS ACTIVE IT MOVES THE ORDERING ONLY
      SLIGHTLY — rho(points-fit, rate-fit) >= 0.9918 at every active position — because the score
      is a z-blend whose market axis (`market_score`, an ADP/ECR season-TOTAL consensus) is
      TARGET-INVARIANT. A target swap alone cannot make the score availability-neutral, which is
      exactly why the field also carries an arm acting on the MULTIPLY (`rate_refit_stratified`)
      rather than on the score. `rate_refit_reselect` DOES rescue RB (2/2 folds active) because it
      can move the class off the mvp1 anchor.

      (2) 🔴 A SILENT-VACUITY DEFECT INHERITED FROM NF-INJ2's RUNNER, FIXED HERE — worth the PM's
      attention because it is live in a DECIDED story's code. `apply_2026` substituted the ARM'S OWN
      BOARD for a missing served baseline (`served if served is not None else board`), which makes
      every served-relative figure compare an arm to itself and reports a structural zero as a
      measurement. NF-INJ2's own record therefore carries a `served_giveback_pct` that may be its
      arm's own number rather than the served board's. NF-INJ2b REFUSES instead, and reads the
      baseline from the PUBLISHED artifact rather than any rebuild. Two-sided proven: with the real
      baseline staged, `served_giveback_pct` is now IDENTICAL (121.4) across three arms, as a
      property of the served board must be.

      (3) 🔴 A 1e-9 REPRODUCTION PIN AGAINST THE PUBLISHED BOARD IS UNACHIEVABLE, NOT STRICT.
      `projections.json` serves `fpPpr`/`g` rounded to ONE decimal, so a 1e-9 bar against it is a
      tolerance nothing could ever meet (the E9.61 class: an API-rounded side compared against a
      recomputed side manufactures phantom deltas). The pin now runs at half the artifact's own
      rounding unit and SAYS SO; the story's 1e-9 discipline still governs every LOCAL diff. Any
      future story pinning a rebuild against the wire inherits this.

      (4) ⚠️ A PREREQUISITE THE DECISIVE RUN CANNOT PROCEED WITHOUT, and the guard that found it.
      The local MVP-1 2026 board is 58.2h from the served board, against a 48h bar — so the 2026
      application REFUSES (verified live: it raises, naming the lag). Every 2026 number computed off
      it would be about a board nobody is served. The operator must rebuild the marts + MVP-1 board
      and RE-STAGE the published `projections.json` immediately before the run. ⭐ AND A CONSTRAINT
      WORTH KNOWING: `--market-refresh` pulls a live ADP/ECR snapshot that FEEDS THE ORDERING and
      moves daily, so an exact pin against a published board is only reachable close to that board's
      own publish. This is a property of the chain, not of this story.

      (5) ⭐ A METHOD FINDING ABOUT THE NEW POSITIVE CONTROL, MEASURED RATHER THAN ASSUMED, and it
      generalises to every study that runs one. A UNIFORM ADDITIVE injection is a STRUCTURAL NO-OP
      on a rank-based FIELD statistic: CSCV/PBO ranks arms within each in-sample half, so a common
      shift cannot re-order the treated arms among themselves (measured 0/35 splits moved). Reading
      "PBO did not move under injection" as evidence about the field would be reading a property of
      the injection. MLB-HV2-1's PBO rose because its injection was a bias on the DATA that each arm
      responded to DIFFERENTLY — a different object. The control now COUNTS the splits its injection
      moved and reports the statistic INERT when that count is zero. ⛔ The fix is NOT a non-uniform
      injection: uniformity is what preserves the near-clone geometry the control exists to probe.
      Carried into CLAUDE.md beside the PM's gate-class convention.

      (6) ⭐ THE PLAT-CVP1 DEFECT-4(a) DETECTOR CAME BACK EMPTY, AND THE EMPTINESS IS THE FINDING.
      `field_level_gates_applied_per_arm == []` because this study's registered per-arm gate table
      deliberately OMITS `pbo` — a field-level statistic must not be carried as a per-arm pass/fail.
      Predicted in the pre-registration amendment before the control was run, so it is a confirmed
      prediction rather than an absence of one.

      (7) ⚖️ NEEDS YOUR CALL AFTER THE DECISIVE RUN — the pre-registration's §6 first branch says a
      TIE on the selecting metric still SHIPS, because coherence is a correctness constraint the
      incumbent FAILS on 11 live rows. That is the pricing-vs-discrimination family rule and it is
      written down in advance precisely so it cannot look like a post-hoc rescue. It did not decide
      NF-INJ2 (that arm WON the metric and was refused on the ordering constraint), and it may not
      decide this one either — but if the run lands on it, the disposition is yours, not the gate's.

      (8) 📎 The two SHIPPED-CODE additions are strictly additive and guarded as such: `score_target`
      defaults to `"points"` and `capture` to `None` on both `learned_scores_by_player` and
      `build_season_projection`, so any caller that never heard of NF-INJ2b is byte-identical
      (NF-C0 / E8.6). `apply_learned_ordering` now resolves the served arm through ONE owner
      (`nf_inj2b_rate_ordering.resolve_served_arm`), which refuses a state where both registrations
      name a non-incumbent arm (INC-30 / INC-36 / INC-38).
