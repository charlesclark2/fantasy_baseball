# Plan spec — NF-INC-0917B (remediation of the weekly-page outage's ROOT defect, which is
# still in production: the manifest publishes with declared fields absent from the wire)
# Authored by PM 2026-09-16. The outage itself (758 min, /fantasy/weekly hard-down) is fixed
# and recorded (PR #1143 fix + #1144 record, plan_specs/nfl_fantasy/nf-inc-0917.yaml). This
# successor closes what that fix deliberately did not: the page now tolerates the missing
# block honestly, but every weekly build KEEPS publishing without it.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: nf-inc-0917b
  vertical: nfl_fantasy
  card: https://trello.com/c/iG6gCYw5
  status: IN_PROGRESS
spec:
  description: >
    The root defect measured by NF-INC-0917: the weekly manifest
    builder calls NflWeeklyManifest.model_validate(manifest),
    DISCARDS the result, and writes the raw input dict; the
    /nfl/weekly/manifest route is a pass-through with no
    response_model. A defaulted field therefore CANNOT fail
    validation by being absent — the default lands on an object that
    is thrown away — so the wire is missing framing, positions,
    season_type, scoring_system_id, interval_lo_level,
    interval_hi_level, ros_basis, ros_sigma_lo_level,
    ros_sigma_hi_level today, and only one of those happened to be
    dereferenced, which is why this was one crash and not a cascade.
    The page currently renders degraded-but-honest (absence copy
    where the measurement notes belong). This story makes the wire
    carry the contract: serve the VALIDATED MODEL, not the input
    dict, at both halves — the builder (box CD path) and the route
    (deploy.sh path) — and audits every defaulted field on this
    contract for the same hole. Principle for the record, quoted
    from the incident: "a declared field, a passing validation, and
    nothing on the wire" — validation that does not gate what ships
    is decoration. best_alpha=0; no model change; the payload's
    VALUES do not change, only its completeness against its own
    declaration.
  acceptanceCriteria:
    - description: >
        THE FIX, both halves, in dependency order: (1) the builder
        serializes the VALIDATED model (model_validate -> model_dump,
        the validated object is what's written — never validate-and-
        discard), so defaults materialize on the wire; (2) the route
        gains response_model=NflWeeklyManifest (or the equivalent
        explicit coercion) so the wire shape is enforced at serving
        regardless of what a future builder writes. ⚠️ TWO DEPLOY
        PATHS, stated in the handoff: quant_sports_intel_models/** →
        box CD on merge to main (currently behind the #1139
        promotion hold — see the coordination clause); app/backend/**
        → operator deploy.sh. The pre-TD and post-TD published
        artifacts must both still be readable (NF-C0) — coercion
        adds defaults, it must never reject the already-published
        blobs; prove both directions on the real committed payloads.
    - description: >
        THE DEFAULTED-FIELD AUDIT, this contract first, class-wide
        census second: for NflWeeklyManifest + the weekly per-row
        contract, enumerate every field with a default and verify
        each now reaches the wire (assert on the SERVED bytes, not
        the model — the incident's whole lesson); then a REPORT-ONLY
        census of other publish paths that validate-and-discard or
        serve raw dicts without response_model (the draft board
        export, track record, player history — the entrypoint-sweep
        family) with findings to closeout.followUps for PM triage,
        not fixed in-story.
    - description: >
        GUARDS, keyed to how this one hid: a wire-shape guard that
        fetches/builds the ACTUAL published bytes and asserts the
        declared keys are present (a fixture generated by the
        shipping writer cannot catch a writer that omits — this
        guard must construct the omission); RED-proven with the
        exact historical state (a manifest without framing) +
        baseline-pass + NOT-SELECTED + resolve-every-node. The
        FIXTURE-REACHABILITY finding is bounded in-story to the
        weekly surface family: for each weekly E2E, state which
        payload shapes its fixtures can produce, and add the
        writer-independent degenerate fixture where the answer is
        "only what the shipping writer emits." The repo-wide
        fixture-reachability audit is NOT this story — census line
        in followUps only.
    - description: >
        NOTIFICATION + CSP, the small halves of the same outage:
        (a) CSP worker-src — one line in next.config.mjs
        securityHeaders so Sentry's session-replay worker is not
        blocked by the script-src fallback (replaysOnErrorSampleRate
        is 1.0 and the one replay that mattered was blocked); verify
        live post-deploy that a replay attaches. (b) The Sentry
        NOTIFICATION RULE is an operator UI step, not code: hand the
        operator a paste-ready config — alert on ANY unhandled
        client exception on a serving route, first-seen and
        low-steady-trickle sensitive, NOT spike-thresholded (this
        outage was a low steady trickle for 12.6h; a spike rule
        plausibly never fires) — plus the verification click-path.
        (c) Close the two open verifications from the incident:
        the Sentry issue's last-seen timestamp vs the 04:10:44Z
        deploy (independent instrument confirming the fix), and the
        combined-page review once #1139 ships — the suppression
        (INC-0916) and the framing absence copy will both render;
        they are different facts and may both belong, but nobody has
        seen them together: look, and reconcile the copy if it reads
        as two apologies where one sentence would be honest.
        Standing: worktree; PR -> dev; box ops operator-run; >2-min
        paste-ready; no Trello; roadmap frozen; findings to
        closeout.followUps; coordinate the builder half's arrival on
        main with the INC-0916 session (it owns the #1139 hold and
        node-4 sequencing — your builder fix rides a promote THEY
        gate; do not press the hold).
---
