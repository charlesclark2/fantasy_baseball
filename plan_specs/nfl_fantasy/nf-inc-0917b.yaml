      - id: the-coercion-degrade-is-a-named-trade
        summary: >
          RECORDED SO IT IS NOT DISCOVERED: the route coercion DEGRADES to the
          pass-through (logging at ERROR with season and week) when a published blob
          omits a field the contract REQUIRES, rather than raising.

          This is the one direction in which this fix could have been worse than
          what it replaced. Hard-failing would have meant that adding a required
          field to `nfl_weekly.py` — an ordinary change, which does NOT trigger the
          box deploy — took every already-published week's page down for a build
          cycle. That trades a silent incompleteness for a loud outage, which is the
          same mistake with better manners.

          ⚠️ The honest cost: the degraded path is only as visible as a CloudWatch
          ERROR line, because the API Lambda has no `send_alert` path at all
          (E9.8-P2, already carded). The Sentry rules above do not cover it either —
          they watch the CLIENT. PM: if the Lambda ever gets a paging path, this log
          line is a candidate for it.
