apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: nf-inc-0917b-plan
spec:
  goalRef: { name: nf-inc-0917b }
  graph:
    nodes: []   # MINI — builder serializes validated model -> route response_model -> defaulted-field audit on served bytes -> weekly fixture-reachability -> CSP line + Sentry rule handoff + the two open verifications -> closeout
  closeout:
    verdict: >
      SHIPPED. The wire carries the contract. Both halves landed: the builder
      serialises the validated model (rebinding `manifest`/`payload`/`current`,
      so `stage()` and `publish()` — which both write `built[...]` — have no path
      to S3 that skips it), and the route declares `response_model` and catches a
      contract failure rather than 500ing on it. A write-path gate
      (`assert_contract_shaped`) refuses a blob short of its own contract at the
      write rather than one function upstream of it.

      MEASURED, on the real published artifacts rather than inferred: coercion
      ADDS 9 manifest fields + 4 inside `lineage` + `scoring_system_id` on the
      players blob, REMOVES nothing, and changes no value on any of 500 rows.
      Both published generations (pre-TD and the post-TD shape) coerce additively
      and neither is rejected. `best_alpha = 0`; no model, number or value moved.

      Guards RED-proven 12/12 attributably, case 1 being the historical line
      itself. Every case is driven by the REAL published blob or by a key DELETED
      from one — never a hand-written fixture, which is the shape that kept the
      suite green through the whole outage.

      ⚠️ NOT DONE HERE, and deliberately: the Sentry notification rule (operator
      UI, config + proof path in `docs/nf_inc_0917b_operator_handoff.md`), the
      live replay verification (needs the frontend deploy), and the combined-page
      copy review (needs an operator eye — see follow-up 9).
    followUps:
      - id: census-pass-through-routes
        summary: >
          CENSUS (report-only, as specced): 15 serving routes carry the SAME
          structural shape the weekly manifest had — no `response_model`, returning
          a store blob verbatim. Measured by AST over `app/backend/routers/` (129
          routes total; 51 declare a response_model, 78 do not; 16 of those read a
          store, and 15 of the 16 return the raw dict — only
          `/nfl/weekly/league-board` constructs a model and is therefore already
          safe).

          THE FIFTEEN: bets.py `/props/batters`, `/props/starters`; fantasy.py
          `/mlb/prospects/board`, `/mlb/prospects/manifest`, `/nfl/board`,
          `/nfl/league-board`, `/nfl/manifest`, `/nfl/projections`,
          `/nfl/weekly/projections`, `/nfl/weekly/projections-full`;
          fantasy_public.py `/manifest`, `/{season}`; players.py
          `/{batter_id}/tb-projection`, `/{batter_id}/zone-overlay`,
          `/{pitcher_id}/k-projection`.

          ⚠️ THE RIGHT TRIAGE IS PER-ROUTE, NOT A SWEEP, and the reason is in this
          story: a bare `response_model` on a route whose payload carries keys the
          model does not declare SILENTLY DROPS THEM (E9.41). That is measured here,
          not feared — `NflWeeklyManifest` drops
          `entitled`/`freeBoard`/`locked`/`lockedSeason` from the live weekly
          response, which is why this story shipped a response model that declares
          the envelope. Any route on this list that goes through
          `entitlement.open_*_payload` has the same trap. A blanket "add
          response_model everywhere" PR would convert a missing-field class into a
          dropped-field class across fifteen surfaces at once.

          PM: this overlaps the entrypoint sweep (GyD9hoeD) + the hygiene bundles.
      - id: census-validate-and-discard
        summary: >
          CENSUS, the other half: ZERO validate-and-discard sites remain repo-wide
          outside tests (AST scan for `model_validate` / `model_validate_json` /
          `parse_obj` as a bare expression statement, over app/, pipeline/,
          scripts/, quant_sports_intel_models/, betting_ml/, frontend/e2e/).

          There were exactly two, and both are fixed here: the weekly builder, and
          — the one worth recording — `frontend/e2e/fixtures/build-nfl-weekly.py`,
          which dumped the manifest and DISCARDED the payload's validation under a
          comment reading "the contract, as the box enforces it". A fixture
          generator is the closest thing this repo has to a second implementation
          of the writer, and the two had drifted in exactly the place that mattered:
          the fixtures were a THIRD shape, neither the contract nor the wire, so the
          E2E suite could not have reproduced production even by accident.

          ⭐ `test_the_weekly_builder_never_validates_and_discards` bans the pattern
          in the runner by AST. Whether that ban should be repo-wide is a PM call:
          it is a one-line generalisation, but a bare `model_validate` IS legitimate
          as a pure assertion when nothing downstream writes the value, so a global
          ban needs an exemption mechanism rather than just a wider glob.
      - id: census-publish-paths-without-a-contract
        summary: >
          THE CENSUS'S OTHER HALF, and it reframes the first one. The spec named the
          draft board export, track record and player history as
          validate-and-discard suspects. They are not — they are something else, and
          the measurement is stark:

          ⭐ OF THE 12 WRITERS THAT REACH THE SERVING api-cache, EXACTLY ONE
          VALIDATES AGAINST A DECLARED CONTRACT — `run_weekly_serving.py`, and only
          because NF-C6-PH2 built it that way. The other eleven
          (`export_prospect_board_json`, `export_draft_board_json`,
          `export_player_history_json`, `export_track_record_json`,
          `run_nf_d21_publish`, `run_nf_serving_board_snapshot`, `run_realized_week`,
          `run_sleeper_player_ingest`, `write_api_cache`, `write_ncaaf_serving_store`,
          `write_serving_store`) reference no pydantic model at all. Of the further
          S3 writers (lake, raw, research artifacts), zero validate — but those have
          no typed consumer, so they are a different question.

          ⚠️ THE DENOMINATOR WAS FIRST RECORDED AS 10 AND THAT WAS AN UNDERCOUNT —
          corrected here rather than quietly, because the way it was wrong is the
          reusable part. The first scan keyed on a file calling `put_object(` itself,
          which MISSES A PUBLISHER THAT DELEGATES ITS UPLOAD TO A SHARED HELPER:
          `run_nf_d21_publish` uploads through `GP.copy_tree_uploader` and
          `run_realized_week` through `_maybe_publish`, so neither has an S3 call of
          its own to find. A per-file scan for the WRITE is the wrong shape when the
          write is factored out — same family as INC-27's "the dbt DAG is not the
          full consumer list", facing the writer side. The headline survives (both
          additions are `NO CONTRACT`), which is luck rather than method.

          ⭐ AND A FALSE-POSITIVE SHAPE WORTH NAMING, caught by NF-WVR1 spot-checking
          this census rather than relaying it: `run_nf_d21_publish` contains
          `GP.validate(...)` — a GATE check, not an output-contract check — so a naive
          `grep -E "model_validate|\.validate\(|pydantic|BaseModel"` reads it as a
          second validating writer, and reads `write_serving_store` as one too. The
          scan used here is `\.model_validate\w*\(`, which excludes both (verified
          two-sided: the naive pattern HITs on d21 and `write_serving_store`, this one
          does not). ⚠️ It has its own known weakness in the same direction — it asks
          whether a file validates ANYTHING, not whether it validates THE BLOB IT
          WRITES, so a file that validates an input while publishing an unchecked
          output would read as VALIDATES. No such case occurred here (only one file
          matched at all), but the number is a screen, not a proof.

          ⚠️ THE DISTINCTION MATTERS AND CUTS BOTH WAYS. "No contract" is NOT the
          defect this story fixed. The weekly manifest had a contract that DECLARED
          nine fields and shipped without them — a promise not kept. A path with no
          declaration makes no promise, so nothing can silently fall short of it, and
          "add a model everywhere" is not automatically an improvement.

          ⭐ WHAT MAKES FOUR OF THEM WORTH LOOKING AT ANYWAY: the draft board, track
          record, player history and prospect board ARE consumed by typed frontend
          code, so an assumed shape exists — it is just held in TypeScript only, with
          nothing on the Python side to hold it to. That is the same
          one-logical-thing-two-owners shape as the weekly contract before NF-C6-PH2,
          minus the owner. Whether that is worth closing is a PM call about cost, and
          the honest framing is "these surfaces have no declared contract" rather
          than "these surfaces are broken" — nobody has measured whether any of them
          is actually short of what its client reads.

          ⭐⭐ AND THE PAIRED INSTANCE, WHICH IS THE PART WORTH CARRYING FORWARD.
          Within the same hour, two sessions produced the SAME defect from opposite
          ends of the same graph, each while citing INC-27 at the other:

            · MINE, on the WRITE side — a per-file scan for `put_object(` cannot see
              a publisher whose upload is factored into a shared helper.
            · NF-WVR1's, on the CALLER side — a `grep` for callers scoped to
              `pipeline/ scripts/ services/` missed `run_realized_week.py`, the CLI
              sitting in the module's OWN directory, so "this publisher has no
              caller" was asserted twice before the obvious directory was checked.
              (Independently verified here before citing it: the CLI exists, with
              `--season --week --publish --smoke --s3-bucket`; and nothing outside
              its own directory references it, so the missing thing is the RECURRING
              wiring, not the command.)

          Two people, two directions, one shape: A SCOPED SCAN ANSWERS A QUESTION
          ABOUT ITS SCOPE, NOT ABOUT THE REPO — and the scope is chosen before you
          know where the answer lives, which is why the error is systematic rather
          than careless. INC-27 is usually quoted as "grep the whole repo before
          dropping a table"; the general form is that ANY completeness claim
          ("N writers", "no callers", "nothing reads this") inherits the boundary of
          the scan that produced it, and the claim should carry that boundary with it.

          ⇒ CONSEQUENCE FOR THE PM, since it sharpens the cheap-window point above:
          `run_realized_week` is ALREADY the 12th uncontracted serving writer, not a
          hypothetical one — code-ready, CLI-complete, with the artifact still
          unpublished. So it has no contract AND no published history right now, and
          the first `--publish` closes that window permanently (E9.49 is the bill for
          the other ordering). Not a WVR1 scope request from either side — they
          consume that artifact and do not own it; both records carry it so the PM
          sees it twice rather than as one story lobbying for another's work.

          Instrument, so this is re-runnable rather than a snapshot: AST scan for a
          bare `model_validate`/`model_validate_json`/`parse_obj` expression
          statement, plus a scan for S3 writers keyed on `put_object(` OR a known
          upload helper (`_maybe_publish`/`copy_tree_uploader`/`upload_json`/
          `publish_json`) OR a `--publish` + boto3 pair, split on whether the file
          references the api-cache. ⚠️ That helper list is itself a scope — it is the
          set measured today, not a closed one.
      - id: scoring-system-id-and-the-type-ranking
        summary: >
          A TENTH ABSENT FIELD, not in the spec's list: `scoring_system_id` was
          missing from the served PLAYERS payload as well
          (`/api/public/weekly-projections`, measured live 2026-09-16), and
          `frontend/lib/nfl-weekly.ts` declares it REQUIRED on `NflWeeklyPayload`.
          Fixed by the builder half.

          ⭐ AND THE GENERALISATION, which is the part worth keeping: the reason
          this one was latent while `framing` was fatal is a property of TYPE, not
          of anyone's care. An absent OBJECT field throws on its first property read
          (`framing.interval_note`); an absent SCALAR renders `undefined` and the
          page limps on. `framing` is the only object-valued DEFAULTED field on this
          contract — which is the whole mechanical reason the outage was one crash
          and not a cascade, and it is a cheap risk-ranking for any contract with
          defaults. Pinned by
          `test_an_absent_object_throws_where_an_absent_scalar_only_renders_undefined`,
          which fails if that set ever grows.

          PM: the frontend mirror is a separate question. `framing` was widened to
          optional by PR #1143; `scoring_system_id` is still declared required in TS
          and is about to start arriving. Leaving it required is now CORRECT rather
          than lucky, but nobody has decided that on purpose.
      - id: the-guard-that-covered-the-wrong-blob
        summary: >
          A BUILDER-SIDE GUARD FOR EXACTLY THIS ALREADY EXISTED AND WAS SCOPED TO
          THE ONE BLOB THAT WAS FINE.
          `test_nf_c6_ph2_weekly_serving.py::test_the_builder_emits_every_field_the_contract_declares`
          names the hazard precisely in its own docstring — "the E9.41
          silently-dropped-field class arriving from the WRITER side" — and then
          asserts set-equality for `NflWeeklyPlayer` only, which is the contract the
          builder happened to populate by hand and which was complete on the wire
          the whole time. The manifest, the payload envelope and the pointer had no
          equivalent.

          ⭐ Same shape as the incident's own finding, one level deeper: NF-INC-0917
          found that the E2E ASSERTIONS existed but the fixtures could not reach the
          broken state; this is the BUILDER guard existing but pointed at the wrong
          object. Both are coverage that reads as total and is partial, and neither
          is visible by reading the test — only by asking what it can see.
      - id: e2e-fixture-reachability-weekly
        summary: >
          FIXTURE REACHABILITY, bounded to the weekly family as specced. Which
          payload shapes can each weekly E2E's fixtures produce?

          · `weekly-projections.spec.ts` — could produce ONLY what the shipping
            writer emits until PR #1143 added `withoutFraming` (one key, deleted
            from the real payload). NOW ALSO produces the full degenerate: this
            story adds `withoutDefaultedFields`, which strips EVERY defaulted field
            at BOTH levels (manifest + `lineage`) — byte-for-byte the shape
            production served. ⭐ The set is DERIVED, not typed out:
            `build-nfl-weekly.py` writes `nfl-weekly-contract-defaults.json` from
            `model_fields`, so a field added with a default joins the degenerate on
            the next fixture build with nobody in the loop. A hand list would cover
            today's page rather than the defect — the first component to read
            `interval_lo_level` would need someone to REMEMBER to extend the
            transform, and remembering is the thing that failed.
          · `weekly-projections-mobile.spec.ts` — writer-shaped only. Left as is:
            it asserts layout, and no payload-shape branch is under test.
          · `weekly-designation.spec.ts`, `stat-line-suppression.spec.ts` — already
            PLANT their fixtures (both say so in their own headers), so they are not
            in the class; `weekly-designation` plants because neither shipped fixture
            carries `gameStatus` at all.

          ⏳ AND A RETIREMENT IS NOW DUE, which nobody has actioned:
          `build-nfl-weekly.py`'s header says "⚠️ RETIRE THESE ON THE FIRST PUBLISH
          and re-capture raw from the live API (E9.64b)". The first publish happened
          2026-09-15. ⭐ The live payload is the DEFECTIVE one, which makes it an
          unusually valuable capture rather than a routine one — a fixture that can
          disconfirm what the writer assumes is the entire point of capturing. PM:
          worth carding, and worth capturing BEFORE the corrected build replaces it.
      - id: fixture-reachability-repo-wide
        summary: >
          CENSUS LINE ONLY, explicitly out of scope per the spec: the repo-wide
          fixture-reachability audit — for every E2E spec, which payload shapes can
          its fixtures produce, and which branches are therefore structurally
          untestable. NF-INC-0917 identified the class; this story bounded it to the
          weekly family. PM: this is the general version and it is a real body of
          work, not a checklist item.
      - id: sentry-rule-and-the-two-verifications
        summary: >
          OPERATOR STEPS, written out paste-ready in
          `docs/nf_inc_0917b_operator_handoff.md` §4 and §5.

          (a) TWO Sentry rules, org `credence-sports` / project
          `javascript-nextjs`: a FIRST-SEEN rule ("A new issue is created",
          environment=production, level=error) — which is the one that would have
          caught this, since the first event was at 15:33Z and a human found it at
          ~03:47Z — and an absolute LOW-COUNT recurrence rule ("seen more than 4
          times in 1 hour"). ⛔ NOT a percent-change/spike rule: this outage was a
          low STEADY trickle from its very first event, so there is no percentage
          increase to detect and a spike rule plausibly never fires. ⚠️ I have no
          Sentry access, so none of it is verified — the handoff carries a proof
          path (Preview, then a LABELLED synthetic event) because an alert rule
          nobody has seen fire is the same class of object as the guard that was
          green through this outage.

          (b) Sentry last-seen vs the 04:10:44Z deploy — NEARLY closed by PR #1145
          already: it records an event at 2026-09-16T03:47:19Z, which is before the
          restoring deploy. What it does not state is whether that is the issue's
          LAST event, which is the actual claim; that is a one-field read in the UI.

          (c) The replay verification is blocked on the frontend deploy — the CSP
          line has no server-side signal, so the only proof is forcing an error on
          production afterwards and seeing a replay attach.
      - id: combined-page-copy-review
        summary: >
          DONE — LOOKED AT, AND IT WAS WORSE THAN "TWO APOLOGIES". Driven with a real
          browser against production 2026-09-16 (Playwright against the live page,
          read-only; ⛔ never `curl | grep` — the weekly table is client-rendered and
          React escapes apostrophes, which already produced one false RED during this
          incident).

          ⭐ THE FINDING: the framing-absence panel ended "…and the projections above
          are unaffected", and the projections above are WITHHELD. That is not a tone
          problem, it is a FALSE STATEMENT, and it is false precisely when someone is
          most likely to be reading it. Corrected to "…and nothing else on this page
          depends on them", which is true in both states, and guarded as a CLASS
          rather than as a sentence: a panel explaining ONE absence may not assert the
          STATE of anything another mechanism can withhold
          (`test_the_absence_copy_makes_no_claim_about_the_projections_status`, with a
          paired clause so the guard cannot be satisfied by deleting the copy).

          ⚠️ AND ONE CLAUSE I EXPECTED TO BE FALSE IS TRUE, which is why this was
          measured rather than reasoned: "it is on the '80% range' column heading
          itself" still holds — under suppression the columns DO render, with their
          cells withheld (`["PLAYER","TEAM","OPP","THIS WEEK","80% RANGE",…]`, read
          off the live page). Had I gone by the argument rather than the browser I
          would have rewritten a sentence that was correct.

          ⏭️ THE REMAINING QUESTION IS A JUDGMENT AND IS THE PM's: should the
          absence panel RENDER AT ALL while the numbers are withheld? It annotates a
          range whose values are not displayed, so a reader meets two failure stories
          where one applies. The page already gates several things on
          `WEEKLY_NUMBERS_WITHHELD` (standfirst, ordering, row view, the bye note), so
          the change is one condition. This session did not make it: it is a product
