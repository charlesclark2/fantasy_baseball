# first shipped member; REALIZED stats, league-scored through the one scorer)
# Authored by PM 2026-09-16. Chosen deliberately as the NF-SEASON member the TD gap does NOT
# block: realized touchdowns exist in box scores even though projected ones don't yet exist
# in the weekly payload. Backend before frontend inside the story (the standing rule).
