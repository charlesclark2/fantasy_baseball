    #   (4) SEASON-TO-DATE ARTIFACT (PM ruled ⑯ = b): `realized/<season>/season/{players,manifest}
    #       .json`, rebuilt every cadence fire FROM THE SERVED WEEKLY FILES (never a second lake
    #       read, so it cannot disagree with them and inherits the restatement discipline — a
    #       parked revision is not served and never enters it). One row per player-GAME, columnar
    #       (measured 179 KB/week vs 1.10 MB as objects → ~3.2 MB for 18 weeks, no gzip needed).
    #       ⭐ Per-game rather than season totals: the scorer IS linear today, so totals would score
    #       the same — but that is a property of today's scorer, and per-game rows make the artifact
    #       a checkable concatenation (row-count and week-set identities).
    #       ⛔ A GAP ENDS IT AND NAMES ITSELF: it covers the longest run 1..K of served, FINAL,
    #       hash-verified, contract-passing weeks; anything later is listed in `excluded` with a
    #       reason and NOT summed in. Every exclusion except `not_final` PAGES CRITICAL. ⛔ It never
    #       shrinks (`refuse_regress`, a WARN event) and never publishes empty (`skip_empty`).
    #       Same contract discipline from birth (`season_contract_report`), read-back verified.
    #       Week directory is the literal `season`; both week-listers require an all-digit parent,
    #       so it can never read as a published week (pinned).
    #   ⭐ MEASURED BEFORE SHIPPING: a fresh week-1 build's hash survives the publish→S3-JSON→load
    #     round trip (else every week would read `hash_mismatch` and page daily).
    #   ⚠️ AND A REAL RESTATEMENT IS SITTING IN WEEK 1: the served file differs from today's lake in
    #     exactly ONE cell — player 00-0036335 (2026_01_NO_DET) `position` LB → DE. Because the
    #     served week-1 manifest predates the hash, the first fire classifies it `backfill_hash`
    #     and overwrites it, as designed; it is the one vendor restatement that will be logged as a
    #     backfill rather than as a `restate` event. Recorded here so nobody goes looking for it.
    #   VERIFICATION: 35 new clauses (`test_nf_wk_rc1_contract.py`), one isolating mutation of the
    #   real week per clause; 19 new red-proof breaks, each reproducing a defect (43/43 RED overall).
    - description: >
        TIMING + GUARDS: the first fully-scoreable week is week 2
        (completes Tue 09-16 night; realized lines land per node 1's
        finding — sequence the runtime gate after that landing).
        Fixtures captured RAW from the live realized source once
        landed (E9.64b); pre-completion state renders a stated
        "week in progress" absence, never a partial total presented
        as final (a Sunday-night read of a half-played week is the
        dangerous default — the completeness gate from node 1 decides
        when a week may render as FINAL, and rendering early must
        say LIVE/PARTIAL explicitly or refuse). E2E per surface both
        ways (scored week, absence-bearing week, anon-refused);
        rendered-output assertions; parity RED-proven via deliberate
        weight mutation; no scorer file outside app/backend/services
        touched (guard-pinned); RED-proofs with unique anchors +
        baseline-pass + NOT-SELECTED + resolve-every-node; owning CI
        shard. Standing: worktree; PR -> dev; >2-min operator
        paste-ready; no Trello; roadmap frozen; findings to
        closeout.followUps.
---
