        STRUCTURAL (the paste flow re-fetches nothing; say so in the
        absence copy in plain words), Yahoo's is the known app-side
        OAuth gap (its record card exists; do NOT chase it here).
        THEN the paid authed endpoints on the my-teams/league-board
        pattern: (1) weekly recap per league (per-team: per-slot
        realized league points off the FETCHED lineup + team total +
        the fetched opponent result; absences per ABSENCE_REASONS — a
        player with no realized line renders a stated absence: bye /
        inactive / no-line-recorded distinguishable); (2) power
        rankings per league (per-team: record, league-scored PF/PA,
        rank, and the rank's stated arithmetic). Contracts
        Pydantic-declared, additive; 401-anon at the gateway;
        byte-identity/CDN rules untouched (authed routes, absent from
        CDN allowlists; decide the cache side BEFORE writing).
        SCORING PARITY proven not assumed: server-scored realized PPR
        under a full-PPR config must equal an independently computed
        PPR on the same line within float tolerance, on every covered
        player of a real league week (the MT1 1e-9 pattern; the
        method travels in the spec record). Runtime gate: operator
        curls on the deployed Lambda against a real league and the
        completed week — deploy.sh only, merged never means served;
        the deploy discriminator must be an AUTHED read (G100-D1:
        anon cannot distinguish deploy-missing from healthy) and
        every probe field name read from the actual payload first
        (the MT1 probe lesson: uniform absence ⇒ suspect the probe).
