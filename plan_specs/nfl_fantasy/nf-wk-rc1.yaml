spec:
  description: >
    After each NFL week completes, every imported league gets (a) a
    TEAM RECAP — each roster's REALIZED league-scored week: per-slot
    actual points under the league's own settings, scored SERVER-SIDE
    through league_scoring.py (the ONE scorer; no fourth
    implementation, none of the three moved), with a per-team total
    and the week's result — and (b) LEAGUE POWER RANKINGS derived
    from realized results (record, league-scored points for/against,
    and any additional ranking signal ONLY if it is a transparent
    arithmetic of served numbers — no opaque composite score).
    best_alpha=0; recaps are FACTUAL surfaces (what happened), which
    is why realized data can carry claims projections cannot.
    ⛔ BOUNDARIES: (i) the projected-vs-actual comparison, where
    shown, runs in POINTS-HEAD PPR terms on both sides (the PPR
    projection is complete — TD value lives implicitly in the head;
    the league-scored projection is TD-less until NF-WK-TD1 lands and
    MUST NOT be presented as the yardstick a league-scored actual is
    judged against — if shown at all it carries the coverage
    disclosure, adjacent to the number per the MT1 ruling ③ pattern);
    (ii) no start/sit, no "should have started" imperatives — the
    recap states what scored, never what the user ought to have done;
    (iii) waiver/trade recommendations are NF-SEASON members 3–4, not
    this story. Paid feature behind the existing membership
    entitlement (the personalization wall, operator ruling 09-14/16).
