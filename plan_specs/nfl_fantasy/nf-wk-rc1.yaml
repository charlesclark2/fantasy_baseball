      ⭐ THE LIVE EXPOSURE IS NARROWER THAN IT SOUNDS, and the honest version is
      the useful one: a ONE-SCORER change necessarily also touches
      `quant_sports_intel_models/fantasy_engine/`, which IS a trigger path, so
      the box rebuilds anyway and the scorer is largely self-protecting. What is
