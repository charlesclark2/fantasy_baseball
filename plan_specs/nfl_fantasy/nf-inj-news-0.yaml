      - "NF-INJ-NEWS-1 (sibling) — consumes this probe's recommendation; does NOT depend on it to ship (manual population day one)."
      - "NF-W0a-CADENCE / weekly capture cards — weekly in-season capture cadence; different question (preseason untagged absences)."
      - "NCAAF P2.7 availability probe (Backlog) — same probe SHAPE for a different vertical; note transferable findings in followUps."
  triedLedger:
    files:
      - "ablation_results/nf_c8_injury_designation_gap.md (names the gap + the leakage hazard)"
      - "production_model_state/nfl_season_fantasy.md (NF-W4: projected availability adds nothing over the injury-aware champion — the value here is DATA reach, not a new model)"
    recordedNulls:
      - "NF-W4 GENUINE_ABSENCE at QB/RB/WR (weekly availability modeling) — not re-approached; this probe is about acquiring a signal that does not currently exist in any ingested field, not re-modeling an existing one."
  supersedes: []
  dependsOn: []
  feedsInto:
    - "NF-INJ-NEWS-1 population automation; the post-season §0.5 duration model's training-data design; adopt-or-close on the NLP lead"
