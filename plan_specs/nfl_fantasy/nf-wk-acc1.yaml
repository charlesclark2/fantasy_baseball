# Plan spec — NF-WK-ACC1 (MINI-to-MEDIUM: recap accuracy closure — close the measured gaps
# between our itemisation and the league's own numbers, term by term)
# Authored by PM 2026-09-17. Bundles two carded, bounded investigations that share one
# surface: card 1KQeqWC0 (fum + the 40+yd TD bonuses) and card fXIYuvMN (the D/ST residual).
# Both cards are pulled into this story; the PM keeps the cards, the session works the spec.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: nf-wk-acc1
  vertical: nfl_fantasy
  card: https://trello.com/c/1KQeqWC0   # + fXIYuvMN; both pulled into this story
  status: IN_PROGRESS
spec:
  description: >
    The recap surface (NF-WK-RC1) serves the league's platformTotal
    as the standings fact and our per-seat scoring as the
    explanation, with the gap disclosed. This story shrinks that
    disclosed gap with measured, term-by-term closures — every
    closure verified against Sleeper's own published figures on the
    existing cross-check harness. Three parts, strictly ordered by
    cost: (1) `fum` — the league's any-fumble penalty has no
    canonical scorer key, so it rides through captured; closing it
    alone moves team-total agreement 14/48 -> 27/48. Realized source
    exists (fumbles_total, landed). ⚠️ ENTITLEMENT CHECKPOINT:
    PAID_PLAYER_FIELDS derives from STAT_FIELD, so this addition
    changes the paid field set — the derived diff comes to the PM
    BEFORE merge, never as a silent side effect. (2) THE D/ST
    RESIDUAL (fXIYuvMN): our construction reproduces Sleeper on only
    35/48 team-weeks; one mechanism already found+fixed
    (fumble_recovery_tds separate from def_tds); explain the
    remaining 13, mechanism by mechanism, against the harness —
    cleanest target SEA 2025-wk1 (ours 6.00 vs Sleeper 8.00,
    realized line fully accounted, no term in the complete 56-key
    settings able to supply the 2). ⛔ MH2.2: no settings term is
    invented to force agreement — if Sleeper's number cannot be
    derived from stats + settings, THAT is the finding, reported.
    (3) STRETCH, only after 1+2 land: the three 40+yd TD bonuses
    need pbp (passing_40 counts 40+yd PLAYS, not TDs — the wrong-key
    RC1 refused); pbp ingest under the standing discipline
    (verify-source-advances, partition semantics, freshness
    contract, ONE ingest owner recorded against INC-0916's ledger),
    then the derivation cross-checked against Sleeper totals. If
    time or size says no, part 3 closes as PREPARED-NOT-EXECUTED
    with the ingest design recorded. best_alpha=0 throughout; the
    served standingsTotal is the league's and never changes here —
    what changes is how much of it our itemisation explains.
  acceptanceCriteria:
    - description: >
        MEASUREMENT DISCIPLINE: every closure lands with a
        before/after reading on the SAME harness and weeks that
        produced the 14/48 and 35/48 baselines (per-seat and
        per-team-total agreement counts, quoted with their week
        set); the divergence recorder's explained/unexplained split
        updates so the residual signal stays clean; the recap's gap
        DISCLOSURE text narrows automatically (it names terms from
        the coverage report — verify the flip on a real league
        payload, and verify the #1155 lesson still holds: the
        disclosure requires a MEASURED gap, so a league where the
        closed terms scored nothing shows no contradiction).
        D/ST seat provenance: IF part 2 reaches full 48/48
        reproduction, flipping the served seat from league_published
        to our scorer is a PM DECISION reported with the evidence —
        not an automatic consequence; the seat stays league_published
        until ruled. FA-pool defence facts (WVR1's stated absence)
        unlock the same way — note the state for WVR1's record.
    - description: >
        GUARDS + BOUNDARIES: every fix RED-proven on the harness
        case that motivated it (unique anchors + baseline-pass +
        NOT-SELECTED + resolve-every-node); the fum addition rides
        the derived-map discipline (no hand-typed mirrors beyond the
        three the map owns); no scorer file outside
        app/backend/services touched beyond the map addition; the
        MNF-schedules staleness (card yOhLHprC, open) is tagged in
        any D/ST reading it could pollute rather than chased here.
        Standing: worktree; PR -> dev; >2-min operator paste-ready;
        no Trello; roadmap frozen; findings to closeout.followUps;
        one frontend story at a time is UNTOUCHED (this story is
        backend/scoring only — the disclosure copy it narrows is
        server-supplied text, not page code).
