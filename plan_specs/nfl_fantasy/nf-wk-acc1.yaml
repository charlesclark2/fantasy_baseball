      ═══ RULING ② — THE GATE SAID CONTRADICTED; REVERTED TO OPTION C ═══
      The gate was committed WITH ITS BAR SET AND NO RESULT (commit c4c69d42) before
      it was run, so the pass/fail rule is provably prior to the answer. It then
      returned CONTRADICTED on ALL 19 rows, and the map is UNTOUCHED.
      WHY: Sleeper has TWO stat namespaces and our importer maps the one that appears
      in LEAGUE SETTINGS.
        team-defence : `sack` / `ff` / `fum_rec`  -> credited ONLY to `DEF` and
                       `TEAM_*` entries, never to any individual of any position.
                       These are the keys a league's `def_*` weights reference.
        individual   : `idp_sack` / `idp_ff` / `idp_fum_rec` / `st_ff` / `st_fum_rec`
                       -> what an individual player is credited with.
      Sleeper credits every one of the 19 offensively-listed rows under the SECOND
      namespace — Trey Benson wk4 carries `idp_fum_rec` 1.0, Jalen Hurts wk14
      `idp_fum_rec`, Devontez Walker wk16 both `idp_ff` and `idp_sack`. ⇒ the rule is
      NAMESPACE, not position. Position-scoping would have given the right answer for
      the WRONG REASON on these rows and the WRONG answer for a league paying
      `idp_*`. Per the ruling that is a study, not a guess, so nothing moved.
      ⭐ THE REAL DEFECT THE GATE EXPOSED, and it is bigger than the row that
      started it: our seven `def_*` terms ARE Sleeper's team-defence weights, and
      they sit in the PLAYER-grain realized map. So a league's team-defence weight is
      applied at player grain to anyone whose weekly line happens to carry the
      counter — while the D/ST construction applies it correctly at team grain. And
      the importer maps NO `idp_*` key at all, so an IDP league's IDP terms are
      silently unscored. That is the study the PM asked for; ⛔ it is NOT the
      position scope, and a session reading only "Trey Benson is still 1.00 out"
      must not reach for one. A guard pins the non-change.
      ⚠️ THE FIRST RUN OF THAT GATE WAS VACUOUS and is recorded as such rather than
      quietly corrected. It read the team-defence keys, which NO individual player of
      ANY position ever carries, so it could not have failed and returned PASS on
      nothing — in a file whose own header warned about exactly that mechanism. The
      RULE the PM pre-declared is unchanged; only which column the gate reads moved.
      A vacuity control now refuses to report a sweep of zeros as a PASS unless every
      individual key demonstrably reaches someone (measured: `idp_sack` 634,
