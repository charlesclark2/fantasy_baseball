      that player's TD count of that type) holds on 5,780 of 5,780 derived
      player-weeks over 1999-2025 with 0 unjoined. Each check is BLIND to the
      other's error class — a threshold of 41 or 39 breaks the aggregate on 5 of 18
      weeks and the identity on none; swapping passer/receiver breaks the identity
      138 times and the aggregate on none. Either figure alone would have been a
      guard that cannot fail in the direction that matters.
      ⭐ THE AGGREGATE IS SUMMED ON PURPOSE. Sleeper's own `gsis_id` is NULL for
      most recent players (3,125 of 9,421 active; Bijan Robinson and Michael Penix
      both null), so a per-player join to Sleeper would have dropped exactly the
      players a fantasy league cares about while reporting a high match rate — the
      NF-W9-0 rookie-crosswalk trap, avoided by needing no crosswalk at all.
      ⚠️⚠️ THE LATERAL CLAUSE WOULD OTHERWISE HAVE SHIPPED WRONG AND BEEN
      INVISIBLE, and it is the strongest thing part 3 learned. On a play ending in
      a lateral the touchdown belongs to whoever crossed the line, not to the
      player who caught the pass; nflverse records that in
      `lateral_receiver_player_id` and leaves the primary column pointing at the
      first player. Measured on 2024 wk17 (Goff -> 1 yard to Amon-Ra St. Brown, who
      laterals to Jameson Williams for 41 and the score): Sleeper credits WILLIAMS
      and not St. Brown. NEITHER CHECK CATCHES IT ALONE — a lateral moves WHICH
      player is credited without changing HOW MANY, so the weekly total is
      byte-identical either way (6/1/6 on that week under both rules), and that
      week St. Brown scored a different, shorter receiving touchdown so his
      `receiving_tds` was 1 and the identity bound was satisfied by the WRONG
      touchdown. Only the external per-player authority separated them. Across the
      whole lake the simple rule produces 3 identity violations and every one is a
      lateral — the check found the mechanism unaided before anyone looked for it.
      ⭐ A SECOND AUTHORITY CORROBORATES THIS SPEC'S OWN WRONG-KEY PROOF: Sleeper
      carries BOTH spellings as separate keys (`rec_40p` the play count beside
      `rec_td_40p` the touchdown count), so the platform we reproduce distinguishes
      exactly the two quantities `passing_40` would have conflated.
      (b) THE MAP CARRIES TWO SOURCES NOW. `REALIZED_PBP_SOURCE` holds the three
      keys, `REALIZED_SOURCE_ALL` is the union the scorer reads, and
      `REALIZED_STAT_COLUMNS` stays the weekly-line SELECT — asking
      `stats_player_week` for a play-derived column would fail the read outright.
      The column names are declared on BOTH sides (the Lambda cannot import
      `quant_sports_intel_models`) and PINNED to each other by a guard, the same
      shape part 2 used for the D/ST terms. The three 40p entries in
      `REALIZED_ABSENCE_REASON` were REWORDED rather than deleted, because their
      MEANING changed: they no longer say "we have no source for this" but "the
      plays for this week have not landed yet", which points at a different fix.
      ⭐ THE COUNTS ARE WRITTEN AS ZERO ON EVERY ROW, not only on the scorers, and
      that is load-bearing: `available_fields` decides APPLIED vs CAPTURED on
      whether the field is present AT ALL, so crediting only the handful of long-TD
      scorers would make the verdict depend on whether anyone happened to score one
      — and a week with no 40+ yard touchdown would report the bonus as "not in
      this number" when it was applied and correctly came to nothing.
      📌 THE DEGRADED PATH IS LEGIBLE, as part 2's is: the manifest carries
      `playerConstruction` (`pbp_joined` | `player_week_only`) plus a
      `playerConstructionFallbackReason`, and `served_columns` declares the derived
      columns ONLY when they were derived — declaring them unconditionally would
      make every week whose plays are not published yet fail its own publish
      contract, turning a legitimate degraded build into an outage.
      (c) ⛔ A NEW PUBLISH DECISION WAS REQUIRED, AND WITHOUT IT THIS WHOLE CHANGE
      WOULD HAVE BEEN A NO-OP FOREVER — the single most consequential thing part 3
      found. Any new column changes every row's content hash, so every
      already-published week would have classified as a vendor `restate`, kept
      serving its old rows, and never shown the bonus, while the log filled with
      restatement events blaming the vendor for a change we made ourselves.
      `widen_columns` is the case RC1's own `upgrade` already implies (a build that
      is strictly MORE than what is served is not a conflict). ⛔ It cannot become a
      back door: the verdict is decided on a hash taken over the PUBLISHED week's
      OWN column set, so a vendor correction landing in the same build still falls
      through to `restate`, and with no rows supplied it refuses to assume the
      harmless case. `publish` now ASSERTS that each decision's `servingWrite` flag
      and the write-action set agree — this story's new action announced
      `servingWrite: True` while the set omitted it, which would have been a
      serving write silently skipped, i.e. a week that simply never updates.
      (d) ⚠️ THE JOIN FIX CORRECTS THIS SPEC'S OWN ⑥. Travis Hunter does NOT fail
      the name join — his name matched perfectly in every week. He is `WR` on
