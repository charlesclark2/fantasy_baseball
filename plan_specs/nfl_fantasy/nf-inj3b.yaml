spec:
  description: >
    Fresh §0.5 FORWARD re-registration of the injury-games caps. NF-INJ3
    measured the served caps ({RES/PUP/NFI: 4.0, SUS: 7.0} @ blend 0.7) ~2x
    too high — robust across every arm/form/served row (22/22 flagged
    draftable veterans move DOWN; live exposure includes Kittle, Pierce,
    Charbonnet, Higgins, Musgrave) — but returned POWER_LIMITED because DSR +
    BH-FDR failed on PRE-REGISTRATION SPEC GAPS (V-membership never invoked
    per MH2.1(a); BH family never named), not on the evidence. This story
    re-registers the study with the spec fixed and re-runs the existing
    harness (~2s). Sanctioned successor per NF-INJ3 recorded ruling D2=A.
    best_alpha=0 throughout; DEPLOY-HELD — nothing serves until the gated
    ship path passes AND the operator approves.
  acceptanceCriteria:
    - description: >
        BINDING REGISTRATION ITEMS (verbatim in the prereg, committed BEFORE
        any scoring run — E2.1-r provenance turns on this ordering):
        (1) V membership named up front — degenerates NOT in V AND the
        incumbent reference arm NOT in V (MH2.1(a): its trial Sharpe is
        0-by-construction and inflates a small-family V);
        (2) the BH family named up front — one mechanism, one population, no
        position axis (arguably single-hypothesis; say which and why);
        (3) hurdle form (hurdle_transfer, the NF-W2 split) declared PRIMARY;
        (4) the coherent narrower family declared ON MECHANISM FIRST — NO
        per-candidate-field DSR menu; DSR is computed only AFTER the family
        is declared;
        (5) era floor: training window starts 2016 (pre-2016 outcome status
        is season-end BACKFILLED = outcome-contaminated). Note in the prereg
        that the incumbent's docstring claims a 2015-2024 fit, i.e. one
        contaminated season inside it — the floor is a DATA-FIDELITY
        quantity, not an outcome choice;
        (6) HONESTY CLAUSE: the DSR outcome is largely foregone (0.973 from
        NF-INJ3's diagnostic) — this story buys a PROPERLY-REGISTERED record
        plus an honest BH answer, NOT new evidence. The report must say so;
        a foregone DSR pass is never presented as fresh confirmation.
    - description: >
        PROHIBITIONS: no re-read of NF-INJ3 off the 0.973 diagnostic
        (E2.1-r); no post-hoc field trim (MH2.2); no "more seasons" re-test
        trigger (28 folds = 28 seasons; V-composition was binding, not
        power). classify_null called with declared_field_size= and the
        field_remedy_admissible flag read, not the prose.
    - description: >
        Valid outcomes: CLEARS (all registered gates pass) or a classified
        null (its class named per cv_power). A null closes cleanly with no
        re-test trigger unless a trigger is genuinely reachable.
    - description: >
        IF IT CLEARS — the gated ship path, in order, all still deploy-held:
        a served-cap change is LEVEL-ADJACENT (point = rate x games), so
        (a) whole-board cross-position placement read
        (run_nf_tr2b_placement_read) against the PUBLISHED artifact;
        (b) run_interval_revalidation (NF-D16/D21 machinery);
        (c) the NF-TR2b superflex caveat carried (the VOR shield is
        ADDITIVE-only and does not cover superflex);
        (d) the served-POINT impact MEASURED, not assumed proportional —
        NF1.5 hands part of the availability discount back (NF-INJ1/2
        territory), so the cap change's point-level effect is unknown until
        measured. Ship/no-ship is then an operator decision.
    - description: >
        Reproduction pin at 1e-9 (never round(...,6)); RED-proofs on new
        guards with mutation-landed + predicate-moved assertions; guards
        prove they can fail.
