apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: nf-inj3b-plan
spec:
  goalRef: { name: nf-inj3b }
  graph:
    nodes:
      - id: 0a-spec-commit
        desc: "Commit this spec file BEFORE any other work (provenance anchor)."
      - id: 0b-claude-md-append
        desc: >
          As a SEPARATE commit, append two landmines to CLAUDE.md:
          (1) a diagnostic DSR does not transfer to a narrower field — declare
          a mechanism-justified family BEFORE computing any per-family DSR, or
          the family choice is laundered; (2) "ask what transfers" can mean
          the FINDING, not the feature (the NF-W2 -> NF-INJ3 example).
      - id: 1-prereg
        desc: >
          Write + commit the fresh pre-registration
          (ablation_results/nf_inj3b_preregistration.md) carrying ALL SIX
          binding items from acceptanceCriteria[0]. Commit BEFORE any scoring.
      - id: 2-run
        desc: >
          Re-run the existing harness (run_nf_inj3_injury_games.py, ~2s —
          no operator handoff needed; a cheap smoke first per MH2.2 process
          note) under the new registration. No new arms invented mid-run.
      - id: 3-classify
        desc: >
          Score the registered gates; classify via cv_power.classify_null
          (declared_field_size=, read field_remedy_admissible). Record the
          decisive record + verdict in ablation_results/nf_inj3b_*.
      - id: 4-gated-ship-path
        desc: >
          ONLY IF CLEARED: placement read, interval revalidation, superflex
          caveat, measured served-point impact. Everything stays deploy-held;
          hand the operator the ship/no-ship decision with the measurements.
      - id: 5-closeout
        desc: "Verdict + findings into closeout.followUps; session summary to the operator."
  closeout:
    verdict: null
    followUps: >
      Findings land HERE. PM triages into: checklist item on the parent card |
      merge into an existing card (name it) | a new spec. Worker sessions never
      create Trello cards.
