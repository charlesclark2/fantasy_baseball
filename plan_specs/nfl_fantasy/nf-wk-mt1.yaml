# Plan spec — NF-WK-MT1 (FULL tier: the my-teams WEEKLY lens — league-scored weekly points
# through the ONE server-side scorer; the pragmatic first slice of gate 3)
# Authored by PM 2026-09-14. Backend-first inside the story (the sequencing rule): the
# league-scored weekly endpoint lands and is verified served before any page code.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: nf-wk-mt1
  vertical: nfl_fantasy
  card: https://trello.com/c/HvVAWD9f   # consumer-chain thread; MT1 card linked at kickoff
  status: IN_PROGRESS
spec:
  description: >
    The paid question the weekly stack exists to answer: "who do I
    start, on MY roster, in MY league's scoring." My-teams already
    holds imported leagues with server-side season scoring
    (league_scoring.py — the ONE scorer, NF-EPIC 1); NF-C6-PH2 serves
    weekly per-stat components. This story joins them: a PAID
    league-scored weekly endpoint that scores the weekly component
    line under the league's settings SERVER-SIDE through the existing
    scorer, and a my-teams weekly lens rendering each roster slot's
    league-scored weekly point + the honest band. ⛔ HARD BOUNDARIES:
    (a) NO fourth scoring implementation and none of the three moved —
    the server scorer is REUSED on weekly stat lines via the same
    STAT_FIELD map; the browser and fantasy_engine scorers are
    untouched (touching either trips the parity merge-gate — that is
    gate 3 proper, still deferred); (b) DISTRIBUTIONS under arbitrary
    scoring (re-scoring the 39-level vector / per-stat distributions)
    are NOT this story — the league-scored POINT is exact (linear
    scoring over the component line); the BAND renders as the served
    PPR-quantile band with an honest label until the distributional
    re-scoring story exists — never a pseudo-band pretending to be
    league-scored; (c) start/sit RECOMMENDATION language is out —
    render projections + bands; the win-prob optimizer is NF-OPT1.
    best_alpha=0; paid feature behind the existing entitlement.
  acceptanceCriteria:
    - description: >
        PHASE A — SERVING (verified before page code, the P3.3 gate
        pattern): a paid endpoint (the my-teams/league-board pattern —
        server reads the weekly components from the box artifact,
        scores under the league's stored settings via league_scoring,
        returns league-scored weekly points per rostered player; the
        browser NEVER sees the component substrate on this route
        beyond what the entitlement standard already allows).
        Contract Pydantic-declared, additive; absences per
        ABSENCE_REASONS (a rostered player missing from the weekly
        payload renders a stated absence — bye/absent/K-DST-uncovered
        each distinguishable); byte-identity untouched (this is a
        paid, authed route — it takes the Request, is absent from CDN
        allowlists, 401s anon; decide the cache side BEFORE writing,
        per the G100 rule). SCORING PARITY, proven not assumed: the
        server-scored weekly PPR under a full-PPR league config must
        equal the served fpPpr within float tolerance on every
        covered player (the one cross-check the independent heads
        allow — and the C6-PH2 coherence caveat applies to COMPONENT
        sums, so this parity check is against the scorer's own output
        on the same line, not against the points head; state which
        comparison each clause makes). Runtime gate: operator curls
        on the deployed Lambda (a real league, real week; 401 anon;
        one absent-player case), deploy.sh only, merged never means
        served.
    - description: >
        PHASE B — THE LENS: my-teams gains a weekly view per imported
        team — each starter/bench slot: league-scored weekly point,
        the band (labeled honestly per boundary (b)), designation
        badge where the feed carries one (the served status — no
        forecast language), bye/absent states; weekly ROS renders as
        the model's own PPR rest-of-season figure, carried unchanged
        and labelled — the SAME treatment as the band, and NOT
        league-scored.
        # ⭐ AMENDED 2026-09-14 (PM disposition ①), and it is a
        # CORRECTION rather than a descoping: the clause previously
        # read "weekly ROS renders league-scored the same way", which
        # is not satisfiable. THE REASON, quoted so it is not
        # re-litigated: "the weekly payload carries no ROS component
        # line; league-scored ROS requires a backend emission story;
        # until then ROS renders as the model's PPR figure, labelled."
        # ⛔ The tempting middle — scaling the PPR ROS by the ratio the
        # weekly point moved — is the SAME fabrication boundary (b)
        # refuses for the range, and allowing it here while refusing it
        # there would be incoherent. ⚠️ Registered LOUDLY rather than
        # left implicit because the scaled version is PLAUSIBLE: the
        # frozen-form ROS basis holds each player's stat mix roughly
        # constant across the horizon, so the fabrication would look
        # defensible to a future reader who did not know it had been
        # considered and refused.
        Each rostered player renders TWO numbers and the PPR one may
        never be hidden where the band renders: league points are the
        headline, the PPR point is the band's ANCHOR (visually bound
        to the band), and one line states that the two are independent
        outputs of one model — neither correcting the other.
        # ⭐ BINDING RATIONALE (PM disposition ③, 2026-09-14): a band
        # rendered beside a league-scored point with no PPR point in
        # sight reads as THAT point's band, which is false. ⛔ No copy
        # may imply a rank-ordering or a correction between the two.
        The per-league SCORING COVERAGE the endpoint already reports is
        a FIRST-CLASS element of the view — not a tooltip and not a
        footnote glyph alone.
        # ⭐ PM disposition ② (2026-09-14): VISIBLE. "Your fumble
        # scoring isn't in this number" is true; "contributed nothing"
        # is false, and only a visible disclosure separates them. Shape:
        # a plain per-team statement, e.g. "8 of your league's 28
        # scoring terms apply to weekly stats; the rest (fumbles, 2-pt,
        # K/DST, …) are not in this number." ⚠️ The DIRECTION of the
        # bias may be stated ONLY where it is derivable per-league from
        # the served coverage list — never as a blanket claim.
        A caller without the membership capability meets a STATED
        BOUNDARY in the tab itself ("the weekly lens is a membership
        feature"), never a dead end that reads as a bug.
        # ⭐ PM disposition ④ (2026-09-14): KEEP PAID. The weekly lens
        # stays behind the membership capability; the free league's
        # SEASON board is untouched and route mounting stays where the
        # entitlement standard puts it. No widening.
        Copy through the claim-copy conventions: no start/sit
        imperatives, no matchup language; the PPR-band label states its
        scope in plain words. The season my-teams view, scorer, and
        entitlement gates are untouched; the lens is additive
        navigation within my-teams.
    - description: >
        TIMING + FIXTURES: Phase A can build now (the box artifact
        exists; the first weekly publish is imminent) but its runtime
        gate needs a REAL served weekly payload — sequence the
        operator curls after the first-publish verification (card
        iMHg7nm6). Fixtures captured RAW per E9.64b once live; the
        pre-publish state renders the same stated absence FE1 ships.
        One frontend story at a time: Phase B starts only after
        NF-WK-FE1's #1103 is merged (verify, don't assume).
    - description: >
        Guards: E2E per surface both ways (a scored roster, an
        absence-bearing roster, an entitlement-refused anon read);
        rendered-output assertions; the parity clause RED-proven (a
        deliberate scoring-weight mutation must move it); no scorer
        file outside app/backend/services touched (guard-pinned);
        RED-proofs with unique anchors + baseline-pass + NOT-SELECTED
        + resolve-every-node; owning CI shard for shared guards.
        Changelog (user-facing, paid feature) lands only when the
        lens actually renders live data. >2-min commands operator
        paste-ready; worktree; PR -> dev; no Trello; roadmap frozen.
---
