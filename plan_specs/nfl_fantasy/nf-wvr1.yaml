      model, which the same ruling forbids. Options as I read them, none taken
      unilaterally: (a) ship value as an HONESTLY-LABELLED full-season figure
      ("preseason full-season projection, refreshed daily for injury and market
      news; it does not yet reflect in-season performance") and accept a gap
      that grows ~1/17 per week; (b) ship the FA pool + need annotation with NO
