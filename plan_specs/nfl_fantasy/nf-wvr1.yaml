      ⑤ A TRUNCATED LEAGUE MUST REFUSE, NOT RENDER. `bound_league_rosters`
      drops WHOLE TEAMS at MAX_LEAGUE_ROSTER_PLAYERS = 500 and records it on
      `league_rosters_truncated`. An FA pool computed from a truncated roster
      set contains every dropped team's players — i.e. it recommends players who
      are rostered, which is precisely the plausible-but-wrong class. The flag
      is already on the record, so the refusal is available for free; it just
      has to be taken. Binding on whatever WVR1 ships.


