        over the live board, 12-team full-PPR, the top-25 available
        players are 6 QB / 3 TE / 16 K by points and 14 K / 8 DST /
        2 TE / 1 QB by VOR — the FA pool is the below-replacement
        population BY CONSTRUCTION, so draft-VOR is <=0 across it and
        the lowest-dispersion positions float up (NF-C7/NF-C5, one
        surface over). ✅ ANSWERED: coverage 97.8% of real week-1
