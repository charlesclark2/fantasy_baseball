        rest-of-season figure; `base_season: 2025`; rebuilt DAILY on
        live ADP/ECR/injury inputs but never decremented for played
        weeks. The ONLY ROS artifact in the system is the WEEKLY
        model's roll-up, which this spec forbids ⇒ the phrase "the
        season product's ROS projections" names an artifact that does
        not exist (plan_spec_process spec-premise class, PM ruling
