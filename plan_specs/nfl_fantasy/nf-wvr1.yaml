apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: nf-wvr1-plan
spec:
  goalRef: { name: nf-wvr1 }
  graph:
    nodes:
      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 1-diagnosis
        desc: "FA-pool freshness (RC1 dependency stated) + the season-ROS source named precisely + coverage vs deep pools."
      - id: 2-ranking
        desc: "Transparent value + need arithmetic; one scorer; intervals carried."
      - id: 3-phase-a
        desc: "Paid endpoint; bounded fan-out; runtime gate on a real league with a known waiver move. ⚠️ #1139 hold — surface if a main promote is needed."
      - id: 4-phase-b
        desc: "Waiver view (queued behind RC1 Phase B); claims-disciplined copy; changelog on live render only."
      - id: 5-closeout
        desc: "Verdict + the value+need framework statement for the trade engine into closeout.followUps."
  closeout:
    verdict: null
    followUps: >
      Findings land HERE. PM triages into: checklist item on the parent card |
      merge into an existing card (name it) | a new spec. Worker sessions never
      create Trello cards.


      ── NODE 1, 2026-09-15 (evidence: docs/nf_wvr1_fa_pool_diagnosis.md) ──


      ① 🚨 BLOCKING — PM RULING NEEDED ON THE SUBSTRATE. The season board
      publishes a FULL-SEASON projection, not a rest-of-season one (max g =
      17.000; 53 rows > 16.0; week 1 complete 2026-09-14), and nothing
      decrements it as weeks are played. The spec's substrate ruling names a
      quantity that does not exist. The only ROS artifact belongs to the weekly
      model, which the same ruling forbids. Options as I read them, none taken
      unilaterally: (a) ship value as an HONESTLY-LABELLED full-season figure
      ("preseason full-season projection, refreshed daily for injury and market
      news; it does not yet reflect in-season performance") and accept a gap
      that grows ~1/17 per week; (b) ship the FA pool + need annotation with NO
      value ranking until a ROS substrate exists; (c) fund a season-ROS
      quantity as its OWN successor spec: the INPUTS are all held today (the
      board's own `g`/`bye`, plus `schedules`, which is in ROLL_FORWARD_SOURCES
      and carries 2026), and it would NOT touch the weekly model. ⚠️ But it is
      NOT a one-line pro-rate, and I do not want to hand a successor that
      premise: `g` already encodes a FULL-SEASON injury cap (NF-INJ3b, 44 rows
      fitted), so scaling it by remaining-team-games would double-count games a
      player has ALREADY missed — and games-played-to-date is exactly the
      quantity we do not currently ingest (NF-INC-0916 owns
      `stats_player_week`). Scoped honestly it is real work with a real
      dependency; (d) wait for NF-INC-0916. Recommendation: (c) is the only
      option that makes the product's own claim true, and it is the one I would
      fund, but ⛔ NOT on a "it is small" premise — see the caveat above; (a) is
      shippable sooner if the label carries real weight. NOT a WVR1 decision.


      ② 🚨 BLOCKING — PM RULING NEEDED ON THE RANKING. Measured through the real
      scorer, an FA pool ordered by the board's raw points is 16/25 kickers, and
      ordered by its VOR is 14/25 kickers plus 8 team defences. This is NF-C7's
      recorded lesson ("best value on the board late in a draft is structurally
      a backup TE/QB") and NF-C5's ("a starter-cutoff replacement carried into
      an auction is the bug") on a third surface. The skew is entirely
      CROSS-POSITION; within a position the board's ordering is legitimate. The
      narrowing that needs no new arithmetic is RANK WITHIN POSITION, NEVER
      ACROSS — which the need annotation already selects for, and which is
      strictly more conservative than the spec's "any combined ordering states
      its rule". Offered, not taken. If the PM instead wants a cross-position
      number, that is a waiver-specific replacement level = new modelling, and
      belongs in its own spec with the §0.5 posture, not smuggled into a
      serving story.


      ③ ⚠️ LIVE COPY DEFECT, independent of whether WVR1 ships. my-teams.tsx:80
      tells paying users "Projections are the rest-of-season figure (pre-kickoff,
      so this is effectively the full season)"; :26 and :368 repeat it. The
      parenthetical was true when written and expired at kickoff. A shipped paid
      surface now calls a full-season number rest-of-season. Suggest: checklist
      item on the parent card, or fold into whichever NF-SEASON member touches
      my-teams next. (This copy is also the likeliest ORIGIN of the spec's F1
      premise — the spec-premise rule working exactly as the process doc
      predicts.)


      ④ THE ROSTER RE-FETCH SEAM — one owner, and it is NOT RC1's module.
      RC1 owns the weekly MATCHUP fetch (starters, frozen per week). An FA pool
      needs the CURRENT full rostered set (bench/IR/taxi included), which is
      `/league/{id}/rosters` — already owned by `platform_import/sleeper.py`
      (`_fetch_teams`) and also called by RC1's `_team_names` for labels. Two
      different objects on one host, with OPPOSITE freshness semantics. Suggest
      the PM confirm the seam before either session writes it, so it is written
      once. Whoever writes it also owns re-stamping `league_rosters_synced_at`.


      ⑤ A TRUNCATED LEAGUE MUST REFUSE, NOT RENDER. `bound_league_rosters`
      drops WHOLE TEAMS at MAX_LEAGUE_ROSTER_PLAYERS = 500 and records it on
      `league_rosters_truncated`. An FA pool computed from a truncated roster
      set contains every dropped team's players — i.e. it recommends players who
      are rostered, which is precisely the plausible-but-wrong class. The flag
      is already on the record, so the refusal is available for free; it just
      has to be taken. Binding on whatever WVR1 ships.


      ⑥ THE FA-POOL SUBTRACTION MUST STAY ON THE NAME JOIN. 113 of 870 board
      rows carry synthetic non-gsis ids (81 rookies + 32 D/ST); Sleeper rosters
      carry a third id vocabulary. `league_scoring._join_key` (name+pos, D/ST by
      franchise) is immune and measured clean (870 rows -> 870 distinct keys, 0
      collisions). Anything that "improves" this to an id join silently drops the
      rookie class — the NF-INFRA1/NF-C-LDA-0 crosswalk defect. Worth a guard
      pinning zero key collisions on the published board, since that is a
      property of today's data rather than a guarantee.


      ⑦ A STATED-ABSENCE REASON IS OWED FOR THE BOARD'S TAIL. 2.2% of real
      week-1 skill performers (8 of 357) are past the board entirely; all scored
      under 4 PPR, so the stakes are low, but a deep-league FA pool will contain
      them and they must render a stated absence, never a zero or an omission
      (ABSENCE_REASONS, extended additively).


      ⑧ ANSWERED (was "unmeasured" in the first pass; the structural answer is
      decisive and it CHANGES THE WEIGHT OF OPTION (a) in ①). The board has NO
      in-season PRODUCTION channel, BY DESIGN. `run_nf1.assemble_features`
      states its own contract — "every column is a BASE-SEASON realized quantity
      or a leakage-safe forward designation" — with `base_season: 2025`; and the
      daily publish refreshes exactly `BOARD_INPUT_SOURCES = ["depth_charts",
      "rosters", "weekly_rosters"]` (sports_nfl_board_publish_job.py:82), i.e. no
      results feed at all, consistent with RC1's independent finding that
      `stats_player_week` holds zero 2026 rows. So every performance feature
      (pergame_fp, snap_share, target_share, carry_share, base_games) is a 2025
      quantity. The board's 2026-responsive channels in full are: depth chart,
      roster status, injury/designation status, Vegas win totals, and ADP/ECR —
      ROLE, HEALTH and MARKET, never PRODUCTION. That is the CORRECT design for
      a leakage-safe preseason draft board and the wrong substrate for a waiver
      ranking, which is precisely a question about what has changed since the
      draft. ⇒ an honest label under option (a) cannot stop at "refreshed daily
      for injury and market news" — that leaves the impression the number tracks
      performance. It has to say the projection DOES NOT REFLECT 2026 ON-FIELD
      PRODUCTION AT ALL. (Fernando Mendoza tops the available pool at 268.3
      projected points and did not take a snap in week 1.)


      ⑨ OBSERVED, NOT ADJUDICATED — the `contrib` driver block's vintage. On the
      live payload: 702 of 870 rows carry `contrib`;
      `featureContributionsMeta.generated_at` is 2026-08-02 (~6 weeks old) and
      its `model_version` is `nfl_fantasy_nf1_v1` while the payload's own is
      `nfl_fantasy_nf1_5_v1`. ⚠️ I have NOT established this is a defect: the
      metadata stamps its own vintage and version honestly, and NF1.5 is a
      market-aware refinement layered on NF1, so NF1 attributions may
      legitimately explain the NF1 component. Recorded because a waiver surface
      might want to show "why", and because a reader of the board should know
      the driver block is not the same vintage as the number it sits beside.
      For whoever owns NF1.5 to confirm or dismiss — not a WVR1 finding.

