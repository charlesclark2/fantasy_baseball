# Plan spec — NF-INJ3b-SHIP (FULL tier: the D5=A flip — feed, stamp guard, flip, combined read)
# Authored by PM 2026-08-24 per operator ruling D5=A and PM rulings D6/D7/D10.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: nf-inj3b-ship
  vertical: nfl_fantasy
  card: https://trello.com/c/oKvTkBsi   # continues the NF-INJ3b/-M thread; SHIP card linked on creation
  status: IN_PROGRESS
spec:
  description: >
    Execute operator ruling D5=A (2026-08-24): flip the certified
    hurdle_transfer injury-games caps ON for the veteran RES/PUP
    population, with the D6 stamp guard and D7 covariate feed as
    prerequisites IN THIS CHANGE, and the D10 combined read gating the
    first publish. Basis: NF-INJ3b CLEARED 9/9; NF-INJ3b-M measured the
    served impact (flagged veterans -2.61 games / -1.23 PPR mean; ~90% of
    the raw point impact absorbed by NF1.5's re-order; 517 unflagged rank
    moves; largest point move 11.46 PPR on an unflagged player). The
    operator accepted that trade with eyes open; this story makes the flip
    real and safe, and hands the operator the final publish decision with
    the combined evidence. best_alpha=0. DEPLOY-HELD until the D10 read
    passes AND the operator approves; ⛔ no --publish from this session.
  acceptanceCriteria:
    - description: >
        D7 — THE COVARIATE FEED: onset_carryover, weeks_since_last_game,
        prior_games, log1p_prior_fp built into the BOARD BUILD and supplied
        to the availability chain (apply_availability_chain /
        injury_games_serving) with feed_supplied=True on the serving path.
        NF1.5's internal research-frame call sites keep feed_supplied=False
        on their recorded path. Feed values must reproduce the study's
        covariate definitions (cite the prereg definitions; pin one known
        row per covariate against the study artifact at 1e-9).
    - description: >
        D6 — THE PUBLISH-TIME STAMP GUARD, in the same change and RED-proven
        BOTH ways: the published artifact must (a) carry the fitted
        injury_games_model_version, AND (b) show flagged veteran rows
        actually differing from the incumbent caps. The named failure mode
        it kills: a served build that forgot its feed quietly shipping the
        incumbent under the fitted arm's stamp. RED legs: stamp present +
        rows unchanged -> FAIL; stamp absent + rows changed -> FAIL;
        legitimate flip -> PASS; legitimate flag-off build -> PASS with no
        stamp.
    - description: >
        THE FLIP: injury_games_policy.SERVING_ENABLED=True for veteran
        RES/PUP only. Boundaries enforced in code and pinned two-sided:
        SUS/NFI retain incumbent constants (exploratory channels, zero live
        rows); rookies retain incumbent constants via the NF-INJ3c routing
        (injury_games_serving never reached from the rookie frame — do not
        alter that); fitted_status remains REFUSED and unreachable.
    - description: >
        BOARD COMPARISONS under the standing non-determinism rule
        (NF-INJ3c §6, card QkpAHBYa): material tolerance rtol/atol 1e-9,
        scoped by population, NEVER bitwise; any moved rookie-band cell is
        read against a SAME-COMMIT control before being attributed to this
        change. Reproduce the -M measurement's headline figures on the
        flipped build as the sanity anchor (flagged ~-2.61 games / ~-1.23
        PPR; materially divergent numbers HALT the story, not the gate).
    - description: >
        D10 — THE COMBINED READ gates the first publish: one placement read
        + one interval revalidation on the exact board the operator would
        publish — carrying this flip PLUS whatever else is live at publish
        time (adopted NF-INJ-NEWS-1 overrides; NF-INJ3c rookie routing,
        active post-cutdown). Per-story reads cannot attribute a board that
        moved for two reasons; only the combined read counts. Use the
        --out stems; never touch decided artifacts.
    - description: >
        OPERATOR PACKET to close: top-25 rank moves by config (incl.
        superflex_10/12) with names, the flagged-cohort table, the combined
        read verdicts, the stamp-guard proof, and the publish/hold call
        left explicitly to the operator. Changelog entry DRAFTED but
        committed only on the publish path (a declaration must not outrun
        production — the NF-INJ3c convention).
    - description: >
        CLAUDE.md append (separate commit): the NF-INJ3c landmine — "No
        board comparison in this repo may be bitwise: same-commit rebuilds
        differ in the rookie band (fp_ppr_sd/p10/p90) at 0-21 material
        cells. Compare at material tolerance scoped by population, and read
        any rookie-band move against a same-commit control first. (Located?
        remove this note via the QkpAHBYa card.)"
