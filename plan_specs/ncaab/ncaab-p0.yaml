kind: Plan
metadata:
  name: ncaab-p0-plan
spec:
  goalRef: { name: ncaab-p0 }
  graph:
    nodes:
      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 1-captures-first
        desc: "⏱️ Credits measured live -> operator arithmetic + cadence proposal + fan-out ceiling -> operator enables. Calendar-priority: futures/early lines are now-or-never."
      - id: 2-source-audit
        desc: "Measured audit of the free sources -> the paid-necessity VERDICT document for the operator."
      - id: 3-lake-entities
        desc: "ncaab/ lake + ingestion jobs + dim_ncaab_team (SCD) + staging/marts; backfill per audit; monitoring posture recorded."
