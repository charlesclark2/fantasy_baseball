        desc: "Runtime gate: real box ingestion runs + capture rows verified from artifact content; guards RED-proven."
      - id: 5-closeout
        desc: "Audit verdict + credit arithmetic + P1 readiness statement into closeout.followUps; operator summary."
  closeout:
    verdict: >
      ✅ RUNTIME GATE PASSED 2026-09-14 — verified from ARTIFACT CONTENT, never from a
      green run status. The box wrote the ncaab/ S3 prefix on its first attempt
      (`Found credentials from IAM Role: credence-dagster-ec2-role` -> 1,629 rows),
      so NO IAM grant was needed and the E8.5 risk did not materialise; the box's
      DuckDB reaches hoopR over HTTPS; the lake reads back with a capture_timestamp
      from the firing hour; and the full mart chain builds — 6 models, 23 tests,
      22 success + 1 warn (28 passes + 1 warn), reproducing the recorded
      PASS=28/WARN=1/ERROR=0 exactly. The P1 surface is real: 69.1-69.6
      possessions/team-game across 2022-26 with zero possessions_unusable rows,
      off-rating rising 101.8 -> 108.1 by season (and ORtg == DRtg per season, which
      is the correct identity — league-wide every possession scored is one allowed),
      454 team-versions with 80 teams multi-version, and Arizona correctly reading
      Pac-12 (21) for 2022-24 then Big 12 (8) from 2025.

      ⭐ THE GATE EARNED ITS KEEP: it found THREE defects, none of which any gate
      that runs before merge could see (CI mocks all IO). See followUp 10.

      SHIPPED. All five nodes complete, verified against real data rather than
      fixtures. (1) CAPTURES: every Odds-API unit price measured on live
      x-requests headers and reconciled against an independent free-/sports
      bracket — the two instruments AGREED exactly on every leg. 787 credits
      spent total (0.0164% of a 4,812,933 balance — the session balance delta;
      a first tally said 775 by summing the per-leg brackets and missed 12). Proposed cadence: futures
      daily + game lines every 30 min = 14,938 credits/season (0.31%). A
      fan-out ceiling ships REFUSING, not truncating, because a per-event loop
      over an NCAAB board is 105x the bulk call for identical data. Historical
      probe: archive floor 2020-11-16 (the vendor named it via next_timestamp),
      5-minute granularity from 2022-23, 6 recoverable seasons, backfill priced
      at 55,440 credits for the recommended resolution. (2) AUDIT VERDICT: FREE
      SOURCES SUFFICE — no paid purchase is needed to reach launch. hoopR (CC BY
      4.0) gives 24 fully-scored seasons, every NCAAF-parity MVP field, and the
      possession identity from 2003; ESPN's D-I group independently corroborates
      366 teams against hoopR's 366. (3) LAKE + ENTITIES: ncaab/ Delta lake with
      content-timestamped writes, dim_ncaab_team SCD-2 (80 teams carry multiple
      versions touching 2023+; Arizona reads Pac-12 through 2024 then Big 12),
      dbt build PASS=28 WARN=1 ERROR=0 over 6 ingested seasons, 69.2
      possessions/team-game. (4) VERIFY: 35 guards RED-proven 10/10 under four
      controls. (5) The free ingest schedule ships RUNNING and heartbeat-checked;
      the PAID capture job + schedule are wired but ship STOPPED, so enabling is
      a Dagit toggle rather than a code change during the season.

      🪤 THE CAPTURE'S MERGE CARRIED A HISTORY-DESTROYING BUG THAT ONLY A REAL
      RUN CAUGHT, and it is the most transferable finding here. Odds accumulate
      all season while the lake's ordinary write is a season-grained replaceWhere
      OVERWRITE, so the capture does a read-merge-write (the NCAAF-P0.6b
      landmine, inherited). But the first cut wrote through the raw_json path,
      which wraps every field into ONE VARCHAR — so the read-back carried NONE of
      the merge key's columns, every EXISTING row keyed to (None, None, None),
      and the merge collapsed a whole season into ONE row. Silently, on the
      second capture. Measured: two captures merged back to one. The cure is that
      the merge must read back the SAME SHAPE it writes (typed path), the key
      RAISES on an unrecognised shape rather than defaulting, and an UNREADABLE
      partition refuses the merge outright (an unreadable table returning [] is
      the same catastrophe reached by the error path). Re-verified on a real
      Delta tree: three captures, 3 rows, 3 distinct stamps, re-merge idempotent.

      ⚠️ ONE THING IS NOT DONE AND IS NAMED RATHER THAN IMPLIED: the capture
      enablement (PM-recommended ON; the operator's action). The box runtime gate
      is now PASSED — see the top of this verdict.
    followUps: >
      1) ⭐ THE BRIEF'S "NOW-OR-NEVER" FRAMING FOR FUTURES IS CORRECTED BY
      MEASUREMENT, and it changes the decision calculus rather than just a
      number: NCAAB title futures ARE recoverable from /historical back to
      2023-10-24 at 10 credits a snapshot. The urgency is a 10x COST PREMIUM,
      not permanent loss, for anything after Oct 2023. Forward capture is still
      right (10x cheaper, and the only way to hold THIS week), but "we lose it
      forever" should not be an input.

      2) ⭐ TWO SCOPE FINDINGS THE ROADMAP SHOULD ABSORB. There is NO
      conference-futures sport key at this vendor (the live /sports list carries
      exactly two NCAAB keys), so the spec's "futures (title/conference)" ships
      as TITLE ONLY. And NCAAB PLAYER PROPS ARE NOT OFFERED AT ALL (measured:
      HTTP 200, 0 books, 0 markets, 0 credits) — the E5-style props track in
      ncaab_guide.md is blocked at the SOURCE, not a budget question. Neither is
      purchasable.

      PM DISPOSITION (2026-09-14), both accepted: the props track is NOT deleted
      from ncaab_guide.md — it is marked BLOCKED-AT-SOURCE carrying the dated
      measurement, because a REMOVED section reads as never-considered while a
      BLOCKED one reads as answered, and the next reader must inherit the evidence
      rather than an absence. And the spec's own "futures (title/conference)"
      clause is SUPERSEDED BY MEASUREMENT: conference futures do not exist at this
      vendor, so the deliverable is title-only and the spec text is the stale half.

      3) ⭐ THE BINDING CONSTRAINT ON MARKET-RELATIVE WORK IS AN ARCHIVE LIMIT,
      NOT A BUDGET ONE: game data reaches 24 seasons free, market data 6. Any
      P1/P2 design that needs the market in its training window is capped at 6
      seasons at ANY spend.

      ⭐ PM RULING (2026-09-14) — THIS IS NOW A RECORDED REGISTRATION CONSTRAINT,
      not an advisory: **any P1/P2 clause that touches market data declares its
      window INSIDE the 2020-11-16 archive floor, and no story is ever scoped
      around a longer one.** Carried verbatim in the P1 readiness statement
      (followUp 8) and in ncaab_data_inventory.md §8, which is where a P1 spec
      author actually arrives.

      4) 🔧 THE SHARED LAKE LAYER HAS ALREADY FORKED, and NCAAB declined to make
      it a third fork. s3io.py differs by 216 lines between the NCAAF and NFL
      copies (the NFL one carries the INC-45 DuckDB-secret cure and two typed-
      write hardenings the NCAAF one never received), and query_lake.py by 189
      of 210 lines — while the NCAAF package's own docstring asks for the
      modules to be "lift[ed] to a shared package when NFL/NCAAB instantiate".
      NCAAB IMPORTS the NFL copy (already the de-facto canonical one: the
      cross-cutting monitors import it to read the lake for EVERY sport) through
      a single seam, lake.py. RECOMMENDED FOLLOW-UP: relocate the shared layer to
      a neutral package and migrate NCAAF + NFL onto it. Not done here because it
      touches two in-season verticals; it is a one-file change in NCAAB when it
      happens. The same shape exists in dbt — ncaaf_lake.sql and nfl_lake.sql are
      the same six lines twice; a shared sport_delta() macro now exists and
      ncaab_delta delegates to it, so migrating those two is one line each.

      5) 🔧 FRESHNESS CONTRACTS ARE DECLARED BUT NOT ARMED, deliberately. NCAAB
      has no scheduled odds writer, and that registry's own rule is that a
      contract for a table nothing writes is a permanent false page (why INC-41
      rejected a table from its own registry). betting_ml/monitoring/
      ncaab_freshness.py holds them; registration_snippet() prints the paste.
      Arm each in the SAME change that enables its writer.

      6) 🪤 A REAL DRIFT WAS CAUGHT BY WRITING THE CHECK, and the shape
      generalises: the monitor's season window is MONTH-granular and the ingest's
      is DAY-granular (April 1-10), so they can never be equal. The invariant is
      CONTAINMENT — the coarser window must be the WIDER one — which is the same
      shape as INC-41's hour-granularity windows being unable to express a
      30-minute grace. A narrower monitor window would have blinded it on live
      April game days. Now explicit and guarded.

      7) 📋 OPERATOR DECISIONS — PM-DISPOSITIONED 2026-09-14, operator acts
      separately. (a) FORWARD CAPTURE: RECOMMENDED ON NOW. This story's own
      measurement removed the reason to wait — an empty board bills 0, so ticks
      before the season posts lines are free — 0.31%/season is trivial, and
      forward capture remains the only way to hold THIS week at 1x rather than
      10x. (b) THE HISTORICAL BACKFILL: DEFERRED-ON-DEMAND, explicitly NOT
      approved as a block. The archive is not going anywhere, so the honest
      sequencing is that P1/P2's REGISTERED DESIGNS NAME the market window they
      need and the purchase buys exactly that window — never a speculative 6
      seasons ahead of a design that consumes it. Recorded with its reasoning in
      docs/ncaab_p0_credit_arithmetic.md §4 so the decision travels with its own
      justification rather than as a bare "deferred". (c) THE BOX RUNTIME GATE:
      the only calendar-bound item and the one this spec is held open on — see
      the verdict.

      10) 🔬 WHAT THE RUNTIME GATE ITSELF FOUND — three defects, and the common
      shape is that each is invisible to every gate that runs before merge.

      (a) 💣 THE DELTA SCHEMA IS DONATED BY WHICHEVER SEASON IS WRITTEN FIRST, AND
      PRODUCTION WRITES THE WORST POSSIBLE DONOR. The daily job writes
      season_for() — the CURRENT season, which out of season has no games played.
      hoopR's pre-season 2027 schedule file has 83 columns instead of 86 and carries
      game_json_url as an all-null INT32 (it is VARCHAR in every played season). Our
      first S3 write was 2027, so the Delta column pinned to Int32 and EVERY real
      season then failed: "Cannot cast string 'https://...' to value of Int32 type".
      A whole backfill blocked by one degenerate column. ⭐ IT HID BECAUSE
      DEVELOPMENT WROTE ASCENDING (2022 -> 2027) — a complete season donated the
      schema and the pre-season file conformed — WHILE PRODUCTION WRITE ORDER IS THE
      REVERSE. Blast radius measured at exactly ONE column (all 83 checked); the
      three MISSING columns were absorbed correctly by schema_mode="merge", so only
      the TYPE conflict errored. FIXED in the SHARED write path
      (s3io._stabilise_all_null_columns): an all-null column carries no values, so
      its declared type is meaningless and must never decide anything — adopt the
      existing table's type when the table exists (which can only turn a would-be
      conflict into a no-op, hence safe for the in-season NFL/NCAAF tables), and
      fall back to string when it does not. RED-proven: removing the call reproduces
      the production error verbatim.

      (b) 📅 A CURRENT-SEASON-ONLY UPSTREAM WOULD HAVE PAGED CRITICAL EVERY DAY FROM
      FIRST TIP. MEASURED: hoopR publishes the team crosswalk for exactly ONE season
      at a time (only 2026 existed; 2024, 2025 AND 2027 all 404). classify_absence
      escalates any in-season 404, so from ~2026-11-03 the daily job would have
      raised every day until hoopR rolled the file — and a historical backfill
      already escalated on 4 of 5 seasons, exiting 1 on a healthy run. FIXED with a
      SourceSpec.current_season_only flag, pinned two-sided (schedules/team_box must
      STILL escalate in season — a one-sided test passes just as happily on a
      blanket-disabled classifier). ⛔ AND THE OBVIOUS FOLLOW-ON IS REFUSED ON
      PURPOSE: no freshness contract was added for the crosswalk, because between
      hoopR's rolls NOTHING writes it, legitimately, for weeks — an SLA there pages
      on a healthy file (INC-45's deliberately-static lesson). The instrument that
      actually answers the question is dim_ncaab_conference.name_unresolved, a
      CONTENT check at the point of use. Recorded in ncaab_freshness.py so the gap
      is not later "fixed" into a false page.

      (c) 🧨 `dbt build --select ncaab` SEGFAULTS dbt-fusion 2.0.0-preview.218, and
      it is NOT our SQL and NOT the data. Compile is 29/29 on both targets,
      deterministically; the EXACT compiled SQL over the SAME S3 Delta tables runs
      3/3 clean on one python DuckDB 1.5.3 connection with correct row counts. The
      fusion binary crashes nondeterministically (SIGSEGV 139 / SIGTRAP 133).
      ⭐ TWO KNOBS ARE NOT THE FIX AND BOTH LOOK LIKE IT: --threads 1 still crashes,
      and memory_limit reads as a clean OOM story off a single run (2GB passed once)
      until you re-run it — 2GB then crashed 2 of 3 and 4GB PASSED 1 of 3. A single
      green run "proves" whichever knob you happened to turn; this was one edit away
      from shipping as a recommendation. WORKING RECIPE (deterministic, 2/2 trials
      plus the operator's confirming run): one model per invocation, in dependency
      order. docs/ncaab_p0_dbt_build.md. ⚠️ NOT SOLVED, and named rather than
      implied: there is NO NCAAB Dagster dbt job at all, so the marts never rebuild
      on the box; a future one cannot use a single dbt build; and whether the box's
      dbt-runner container crashes on this workload is UNKNOWN AND UNTESTED —
      establish it before anything serves off these marts.

      9) 🚨 A DEFECT FOUND WHILE WRITING THE RUNTIME-GATE HANDOFF, and it would have
      fired on the first deploy. The free daily ingest job's docstring says "The
      Odds API captures are deliberately NOT in this job — wiring them here would
      turn that decision into a default nobody chose." That claim was FALSE in the
      shipped code. `sports_ncaab_ingest_job` ships RUNNING and calls
      `run_ingest(seasons=[season])` with no source names, which resolves to
      DEFAULT_SOURCES — defined as "every source that is not on_demand". `on_demand`
      marks the paid /historical BACKFILL; the two LIVE odds feeds are paid but not
      on_demand, so they sat in the default set.

      TWO CONSEQUENCES, and the second is the serious one. (a) SPEND: the RUNNING
      schedule would have billed live futures + game lines daily (~4 credits/day)
      from the moment of deploy — small in absolute terms, but it bypasses the
      operator spend gate this whole story is built around, which is the harm.
      (b) DATA LOSS: those writes go through run_ingest's ordinary path, a
      season-grained `replaceWhere` OVERWRITE, onto the two tables the capture
      ACCUMULATES into via read-merge-write. So once the capture was enabled, the
      14:00 UTC ingest would have REPLACED that season's accumulated snapshots with
      the single board it happened to fetch — every day, silently. That is the exact
      catastrophe the capture's read-merge-write was built to prevent, arriving from
      the other direction, from a job documented as not touching odds at all.

      ⭐ THE GUARD NAMED FOR THIS COULD NOT FAIL. `TestPaidFeedsAreOptIn` asserted
      "no on_demand source is in DEFAULT_SOURCES" — the DEFINITION restated back to
      itself, true by construction (the NF-C0e "a test that reads a value back under
      the key the code wrote" class). A class titled "the paid feeds cannot run by
      accident" was therefore green throughout. The lesson generalises past this
      repo: A GUARD MUST NOT KEY ON THE SAME PREDICATE THE DEFINITION USES. The
      replacement keys on an explicit NAME list (no flag change can satisfy it), on
      the REFUSAL's behaviour (exercised, not inspected), and on the two writers'
      table sets being disjoint by name.

      🔧 FIXED AT THE REGISTRY, NOT THE CALL SITE: `SourceSpec.paid` (defaulting to
      TRUE, so an unconsidered new source fails toward NOT-landing rather than toward
      spending), `SourceSpec.capture_owned`, DEFAULT_SOURCES = free only, and
      `run_ingest` REFUSES a capture-owned source even when named explicitly —
      one writer per table. A guard pins that the op does NOT hand-narrow its own
      source list, because a fix at one call site leaves the registry wrong for every
      other caller. RED-proven both ways: restoring the old definition fails 3
      clauses; deleting the refusal fails 2. NCAAF is NOT affected — its scheduled
      job uses an explicit ROLL_FORWARD_SOURCES subset and never runs its default set.

      8) 📈 P1 READINESS STATEMENT — the canonical copy. Mirrored into
      ncaab_data_inventory.md §8; keep them in step.

      THE FITTING SURFACE: fact_ncaab_team_game (box line, shared possession
      estimate, per-100 efficiency, point-in-time-correct conference resolved
      through the SCD). 24 seasons available, 6 ingested; extending is a re-run,
      not a code change.

      ⭐ REGISTRATION CONSTRAINT (PM ruling, binding): ANY P1/P2 CLAUSE THAT
      TOUCHES MARKET DATA DECLARES ITS WINDOW INSIDE THE 2020-11-16 ARCHIVE
      FLOOR, AND NO STORY IS EVER SCOPED AROUND A LONGER ONE. Game data reaches
      24 seasons free; market data reaches 6, at any spend. A design that needs
      the market in its training window is bounded there by the vendor's archive,
      not by budget — so the window is a design input, not a discovery.

      ⭐ THE TRAINING WINDOW IS A DECLARE-FORWARD CHOICE, NOT A POST-FIT ONE (PM
      sharpening). 10-15 seasons is this story's SUGGESTION and nothing more; P1's
      pre-registration must DECLARE ITS WINDOW FAMILY FORWARD, citing the
      MECHANISM for each candidate cut — the 2008 birth of the neutral-site flag,
      the 2015 shot-clock reduction to 30 seconds, and the 2023-25 realignment
      wave. A window chosen after seeing fits is the E2.1-r inversion in its most
      literal form. The data supports 24 seasons either way; which of them are the
      SAME GAME is the modelling question P1 registers and TESTS.

      ⚠️ TWO HONEST-ABSENCE CAVEATS P1 INHERITS, both already surfaced in the
      models so neither can be read wrong by accident:
        • `neutral_site` is identically 0 for every season before 2008. That is
          the flag NOT EXISTING, not "no neutral-site games were played" — and
          2008-2026 average ~650 neutral games a season, so reading the earlier
          zeros as False would silently mis-specify every pre-2008 game. Surfaced
          as an explicit `neutral_site_is_trustworthy` column on
          stg_ncaab_schedule so a training window cannot read missing as False.
        • Per-100 efficiency is NULL below a 20-possession floor, because a rate
          divided by a near-zero possession count is finite, enormous and
          completely fake, and no NULL check catches it (hoopR's own repo records
          a model incident from one zero-possession row). The row is kept and
          flagged `possessions_unusable` rather than dropped.
