apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: mlb-hv2-1-plan
spec:
  goalRef: { name: mlb-hv2-1 }
  graph:
    nodes:
      - id: 0-spec-commit
        desc: "Commit this spec (status IN_PROGRESS) before any other work."
      - id: 1-data-audit
        desc: "Name the odds tables + vintage + coverage; stop-and-say-so if the registered window is unsupported."
      - id: 2-prereg
        desc: "Commit the pre-registration (segments, rules, metric, window, gates) BEFORE any scoring."
      - id: 3-score
        desc: "Run the registered backtest (slice-timed first; operator handoff if >2 min)."
      - id: 4-classify
        desc: "Deflation gates + classify; decisive record in the MLB ablation_results convention."
      - id: 5-closeout
        desc: "Verdict + findings into closeout.followUps; operator summary with the verdict stated plainly."
  closeout:
    verdict: >
      GENUINE_ABSENCE — the market-bias direction CLOSES. Over 8,827 completed
      MLB regular-season games (2020-2022, 2024-2026) priced by Bovada, ALL EIGHT
      pre-registered segment rules LOSE money (ROI -0.025 to -0.091 per unit
      staked). None clears the first gate (ROI>0). Every arm's ROI sits INSIDE the
      band a perfectly efficient market would produce (500 sims re-drawing each
      outcome from its own no-vig price; 0 arms above, 0 below), and every
      segment's realized win rate is within 1.6pp of the price's own implied
      probability (-0.009..+0.011 under the Shin sensitivity, so the de-vig choice
      changes nothing). Bovada's H2H prices behave at the segment level like a
      FAIR MARKET PLUS VIG. cv_power.classify_null returns GENUINE_ABSENCE with NO
      re-test trigger: "no sample size rescues a negative point estimate and no
      field size changes its sign". Combined with E13.8's model-side headroom cap
      (~0.002-0.005 Brier), the two obvious sources of MLB H2H edge are now both
      measured and both empty. best_alpha=0 throughout; nothing shipped, no bet
      flag flipped, no candidate recorded. Record: ablation_results/
      mlb_hv2_1_market_bias.md (+ _prereg.md, _data_audit.md).
    followUps: >
      FOR PM TRIAGE.

      (1) EPIC RE-RANK — the headline. HV2's premise was that remaining H2H value
      lives in market bias rather than architecture. That is now MEASURED EMPTY
      for the three registered public-bias hypotheses (favorites / home / marquee).
      HV2 should re-rank its remaining items on the basis that BOTH the model side
      (E13.8) and the segment-bias side (here) are capped.

      (2) ⚠️ INSTRUMENT FINDING, reusable across the program, and the most
      transferable thing this story produced: THE DEFLATION GATES AS REGISTERED
      CANNOT CERTIFY A REAL EFFECT OVER A DELIBERATELY CORRELATED FAMILY. The
      pre-registered POSITIVE control injected a 6-percentage-point dog bias; the
      METRIC gates all fired (ROI up to +0.156, p to 1.4e-8, 6 of 8 arms passing
      roi_positive + fold_consistency + BH-FDR) and BOTH deflation gates blocked
      every arm — CSCV PBO rose to 0.426 because a uniform edge makes near-clones
      tie in-sample (NF1.8: a high PBO over near-clones is a TIE, not overfitting),
      and DSR collapsed to ~0 because the same edge inflated cross-trial dispersion
      V (the MH2.5/NF-W6b-C mechanism). A field-level PBO applied as a PER-ARM gate
      is the specific defect. This did NOT weaken this story's null (which rests on
      G1 — every arm is negative, a clause that is de-vig-free, PBO-free, DSR-free
      and field-free), but it bounds what a SURVIVOR would have meant, and it will
      bite any future §0.5 study whose registered family contains overlapping
      near-clones. Candidate: fold into the cv_power/overfitting instrument card
      alongside the MH2.7 classify_null work.

      (3) ⚠️ A PRE-REGISTERED CONTROL CAN BE MIS-SPECIFIED, AND ITS FAILURE THEN
      SAYS NOTHING ABOUT THE GATES. The registered NEGATIVE control ("permute the
      outcomes; no arm may survive") FAILED — dog_vs_heavy_fav returned +0.378 ROI
      and cleared every gate. Diagnosis: permuting outcomes does not implement "no
      segment bias", it severs the price-probability link, which is a MASSIVE
      ARTIFICIAL DOG BIAS. Left failing and decomposed (NF-D20); a correctly
      specified control (re-draw each outcome from its OWN no-vig price) was added
      beside it and PASSES with every arm at minus the vig. Reusable rule: a
      permutation null is only a null if the permutation preserves the quantity the
      study conditions on — for a PRICED market that is each game's win
      probability, not the outcome vector.

      (4) 🚨 DATA DEFECT worth its own card, found by the node-1 audit and NOT
      specific to this study: THE STORED ODDS HAVE A SYSTEMATIC WEST-COAST-NIGHT
      HOLE (the INC-22 UTC-date class). Games with first pitch after 00:00 UTC are
      0.098-0.119 covered, and the historical backfill captured LITERALLY ZERO of
      them in five of six seasons; games before 00:00 UTC are 0.93-0.96 covered.
      Its fingerprint is a TEAM skew (LAD 132 home games in the store vs CIN 413) —
      every under-covered club is Pacific/Mountain — so ANY study or feature reading
      mart_odds_outcomes over the historical era is reading a near-census of
      Eastern/Central starts plus a ~10% sample of West-Coast nights. Also: 2023 is
      5.2% covered (126 games over 20 dates). Anything that has consumed these odds
      historically (CLV marts, bookmaker-disagreement features, the edge-program
      backtests) inherits the selection.

      (5) ⚠️ ingestion_ts IS NOT THE CAPTURE TIME BEFORE 2026 on mart_odds_outcomes:
      2020-2025 is a one-shot backfill (2 rows/event, stamped at the 2026-04-23
      export run), so the natural `ingestion_ts < commence_time` pre-game guard
      rejects 100% of the historical era and SILENTLY leaves a 2026-only study. It
      did exactly that on the first pass here. The true quote time is
      bookmaker_last_update, strictly pre-first-pitch on every historical row. Any
      future backtest over these odds needs this or it is quietly a 2026 study.

      (6) NOT CLOSED, stated so the null is not over-read: a ~4.4% overround means
      this measures whether a bias EXCEEDS the vig (the underlying miscalibration
      is also small, <=1.6pp, but a 1pp bias would be real and unprofitable); the
      segment partition is the eight rules registered (a different partition is
      untested, and ⛔ choosing one now would be the 28.2 subset-mining trap — it
      needs its own forward pre-registration); the population is games with first
      pitch before 00:00 UTC; and closing-LINE-MOVEMENT as a bias signal is a
      different study (HV2-4's territory).

      No Trello cards were created by this session.
