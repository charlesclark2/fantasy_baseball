apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: plat-cvp1
  vertical: platform
  card: https://trello.com/c/Og5NBwwH
  status: DONE
spec:
  description: >
    Harden the shared null-classification / deflation instrument
    (cv_power.classify_null and its gate machinery) — fixing FOUR
    accumulated, measured defects at the source per MH2.7's rule (a defect
    corrected N times downstream is a defect in the INSTRUMENT; this is
    the 6th+ hand-correction). Cross-vertical: MLB, NCAAF, and fantasy all
    call it, and MLB + prospect guard suites PIN it — so every guard
    re-anchors onto the new implementation in the SAME PR, never weakened
    or deleted (a guard suite can encode a retired world). best_alpha=0;
    no model, board, or serving change anywhere — the instrument's
    CONSUMERS' recorded verdicts are history and must not be recomputed
    or restated by this story.
  acceptanceCriteria:
    - description: >
        DEFECT 1 (VAL1): GENUINE_ABSENCE short-circuits BEFORE the
        MDE/interval branch, over-claiming at low n (5/6 buckets
        mislabelled; a misleading do-not-re-test on an undecidable cell).
        FIX: when meaningful_sd_units is supplied, consult the INTERVAL
        first — a CI spanning the bar = POWER_LIMITED; only a CI wholly
        below the bar = absence.
    - description: >
        DEFECT 2 (VAL3): classify_null takes NO PBO input, so when PBO is
        the binding gate the state structurally cannot name it (VAL3
        returned POWER_LIMITED while the real refusal was PBO). FIX: add a
        PBO input + a DEFLATION_REFUSED state; SUPPRESS the
        "come back with more seasons" trigger for a PBO refusal no fold
        count can move.
    - description: >
        DEFECT 3 (NF-W8-0d R2): COMPUTE the lockstep check rather than
        prescribing a "lower-variance design" that is deterministically
        void under the lockstep invariant.
    - description: >
        DEFECT 4 (MLB-HV2-1, measured): a field-level PBO applied as a
        PER-ARM gate blocks a planted TRUE uniform effect (injected 6pp
        bias: metric gates fired; CSCV PBO 0.426 because near-clones TIE
        in-sample — NF1.8; DSR collapsed because a uniform edge inflates
        cross-trial V — MH2.5/NF-W6b-C). FIX: (a) the instrument
        distinguishes field-level from per-arm PBO application and refuses
        or flags the misapplication; (b) the standing recipe becomes
        checkable — provide an injected-effect positive-control helper a
        registration can call, so "which gates should pass a planted
        effect" is executed, not narrated.
    - description: >
        RE-ANCHOR, NEVER WEAKEN (MH2.7): every suite pinning the current
        behavior (MLB + prospect guards named on the card; sweep for
        others — and run the CI shard that OWNS each guard, not just the
        shard of touched files) moves onto the new implementation in the
        same PR with the SAME properties asserted. New states
        (DEFLATION_REFUSED etc.) get their own pins. RED-prove every fix
        two-sided: each defect's historical case must now classify
        correctly, AND a deliberate regression to the old behavior must
        go red.
    - description: >
        HISTORY IS UNTOUCHED: recorded verdicts that hand-corrected these
        defects (VAL1's hand-labels, VAL3's DEFLATION_REFUSED_PBO
        hand-record, HV2-1's G1-based null) are cited as the fixture cases
        proving the new behavior — their records are NOT edited, restated,
        or "upgraded". The interim hand-record rule retires only for
        FUTURE callers; note the retirement in the instrument's docstring
        with the four incident citations.
    - description: >
        Standing disciplines: reproduction pins 1e-9 where numeric;
        RED-proofs (mutation landed + predicate moved); runtime handoff
        rule (>2 min → operator paste-ready — the full cross-vertical
        guard sweep may qualify; time a shard first); no serving, no
        publish, no Trello.
