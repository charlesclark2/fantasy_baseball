#    The pipeline resolves those through `adp_source.attach_gsis`'s (name, position) crosswalk,
#    which needs the lake — absent from a worktree (NF-INFRA1). ⇒ the ids must be filled in the
#    MAIN CHECKOUT before adoption. ⛔ Do NOT guess one: a wrong id renders identically to a genuine
#    absence on every surface. The build log reports `UNMATCHED_ON_BOARD` for an id that matches
#    nothing — read it, and verify each APPLY line names the player you meant (NF-C9).
#
# ⭐ AND THE FEED IS DIRTY RIGHT NOW, MEASURED: Josh Jacobs' `gsis_id` is `' 00-0035700'` — WITH A
#    LEADING SPACE, on 2026-08-23, on the very player the NF-C9 postmortem names. The override join
#    normalises both ends, so this is handled; it is recorded here because it is live evidence that
#    the normalisation is load-bearing rather than defensive.
#
# ───────────────────────────────────────────────────────────────────────────────────────────────
# ⏳ THIS LIST HAS A SHELF LIFE OF ABOUT A WEEK, AND THAT IS THE DESIGN WORKING
# ───────────────────────────────────────────────────────────────────────────────────────────────
# The 2026 cutdown to 53 is **Sunday 2026-08-30**. This whole population exists BECAUSE teams have
# not made their IR placements yet — several of these players are described in reporting as IR
# candidates once the cut happens. When a team places one on IR, the formal path takes over and
# the override is IGNORED automatically (and named in the build log). Nothing has to be remembered.
# ⇒ Every `review_by` below is set on or before the cutdown for exactly that reason.
#
# ───────────────────────────────────────────────────────────────────────────────────────────────
# ⚠️ CAVEATS THE OPERATOR MUST CARRY (do not skip — two of these would change a decision)
# ───────────────────────────────────────────────────────────────────────────────────────────────
# 1. EVERY `expected_games_missed` BELOW IS THE SESSION'S ARITHMETIC ON THE SOURCE'S PROSE, not a
#    figure any source states. Only Tyson has independent corroboration for the derived number
#    (multiple outlets independently put his return "around Week 6"). The `reading` line under each
#    row shows the working so it can be overruled.
# 2. QUOTES REACHED THE SESSION THROUGH A SUMMARISATION LAYER and should be verified against the
#    live URL before adoption. The URLs are real; the exact wording deserves a click.
# 3. TEAM ASSIGNMENTS SHOULD BE SPOT-CHECKED. Several look like 2026 free-agency movement the
#    session cannot corroborate, and the aggregate trackers contradicted each other on some
#    players. Team is not the join key, so a wrong team does not break anything — but it is a
#    signal that a row was assembled from a source that had something else wrong too.
# 4. ⚠️ `ablation_results/nf_c8_injury_designation_gap.md` says Tyson will move "once ARIZONA
#    places him" on a list. The live Sleeper feed has him at **NO (New Orleans)**, and the beat
#    reporting agrees. The NF-C8 write-up appears to have the team wrong. Nothing depends on it —
#    flagged because a false premise in a doc is what the next reader builds on.
#
# ───────────────────────────────────────────────────────────────────────────────────────────────
# THE SESSION'S RECOMMENDATION (a recommendation, not a decision)
# ───────────────────────────────────────────────────────────────────────────────────────────────
#   ADOPT      Tier A (3) — reporting explicitly names regular-season games missed.
#   OPERATOR   Tier B (3) — Week 1 in genuine sourced doubt; a 1-game cap is defensible but the
#              team messaging is "hopeful", so these are judgment calls, not readings.
#   DECLINE    Tier C (6) — team messaging is actively optimistic ("very confident he'll be ready
#              for game one"). Capping a player his own coach expects to play is the mechanism
#              being used to express a hunch, which is the thing it must not become.
#   ⛔ EXCLUDE Tier D — Puka Nacua and Josh Jacobs are under PENDING NFL DISCIPLINARY REVIEW with
#              NO announced suspension. No source supports ANY number of games, so any integer
#              here would be manufactured. If a suspension IS announced it becomes `SUS`, a formal
#              status, and the formal path handles it — this mechanism must never be the place a
#              guess about league discipline gets a number attached.
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════

