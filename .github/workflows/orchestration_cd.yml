name: Orchestration CD

# INC-16-P5 — auto-deploy orchestration changes to the AWS box on merge to main.
# Kills the manual "codeloc redeploy off main" step + the baked-image drift (a git
# pull does NOT update a running container — the image must be rebuilt). Deploy logic
# lives in services/dagster/aws/deploy.sh (rebuild + drain + verify + auto-rollback);
# this workflow just invokes it on the box via SSM Run Command over OIDC (no static
# keys, no inbound SSH).
#
# Operator-provisioned (see services/dagster/aws/README.md §P5):
#   secrets.AWS_DEPLOY_ROLE_ARN  — IAM role the GH OIDC provider may assume
#                                  (perms: ssm:SendCommand + ssm:GetCommandInvocation
#                                   on the instance + AWS-RunShellScript document)
#   vars.AWS_REGION              — e.g. us-east-1
#   vars.DEPLOY_INSTANCE_ID      — i-07594af1679f81c38
on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "services/dagster/aws/**"
      - "services/dbt_runner/**"
      - "services/*_capture/**"
      # The dbt project is COPY'd into credence-dbt-runner and scripts/ into
      # credence-dagster (services/dbt_runner/Dockerfile: `COPY dbt/ /dbt/`; no bind
      # mount) — so a dbt-model or script change runs STALE on the box until the image
      # is rebuilt. Trigger the rebuild-deploy on those changes too (E11.1-W3pre).
      - "dbt/**"
      - "scripts/**"
      # betting_ml/ is COPY'd into credence-dagster by the root Dockerfile's `COPY . .` —
      # so a serving-critical change (signal generators e.g. generate_run_env_signals.py,
      # betting_ml/monitoring/monitor_health.py, the EB-posterior scripts) runs STALE on the
      # box until the image is rebuilt. Same baked-image-drift class as dbt/**+scripts/** above;
      # missing this path is the INC-35/INC-27 "CI-green but NOT on the box" risk (bitten 3+×).
      # NOTE: this also covers betting_ml/tests/** → a test-only edit triggers a full rebuild-deploy.
      # That is wasteful but SAFE (deploy is idempotent + serialized by the orchestration-cd
      # concurrency group) — far preferable to serving code silently not deploying.
      - "betting_ml/**"
      # NCAAF-P1.1: the SPORTS dbt project (dbt-duckdb, NCAAF + NFL) is likewise COPY'd into
      # credence-dagster by the root Dockerfile's `COPY . .` — so a model-only change to
      # sports_dbt runs STALE on the box until the image is rebuilt, and the box job would
      # silently keep materializing the OLD marts with a green run. Same baked-image-drift class
      # as dbt/** above. (This path was missing since NFL-N0.3 — it covered NFL too.)
      - "quant_sports_intel_models/sports_dbt/**"
      # ── NF-K1 (2026-08-17): the rest of `quant_sports_intel_models` THE BOX ACTUALLY RUNS ──────
      # The sports_dbt line above was added because a model-only change ran stale on the box. The
      # same is true of every OTHER subtree a Dagster op executes, and they were all missing — so
      # the NF-K1 fix (`export_draft_board_json` + `run_league_board`, both run by
      # `sports_nfl_board_publish_job`) reached the box ONLY because that PR incidentally edited a
      # docstring in `pipeline/`. A fantasy-only fix would have gone green, merged, and kept
      # publishing from the OLD image — which is precisely the regression NF-K1 existed to repair.
      #
      # ⭐ DERIVED, NOT GUESSED: this list is every `quant_sports_intel_models.*` subtree reachable
      # from `pipeline/` or `scripts/`, and `betting_ml/tests/test_orchestration_cd_paths.py`
      # RE-DERIVES it and fails if the two disagree. That is what stops this list rotting the way
      # it just did — a new box-run module cannot be added without the guard demanding this line.
      #
      # ⭐ `fantasy_engine` is here because the guard computes a TRANSITIVE closure, not a list of
      # direct references: nothing in `pipeline/` or `scripts/` names it, but `run_league_board`
      # (which the board-publish job runs) imports `fantasy_engine.score_players` — i.e. the repo's
      # actual board SCORER was one hop outside every direct-reference sweep. Same for the three
      # low-churn subtrees below (3/18/3 commits in the same two months, so they are ~free to
      # include, and the safe direction when reachability is indirect).
      - "quant_sports_intel_models/fantasy_engine/**"
      - "quant_sports_intel_models/football/ncaaf/feeder/**"
      - "quant_sports_intel_models/football/ncaaf/ingest/**"
      - "quant_sports_intel_models/football/ncaaf/models/**"
      - "quant_sports_intel_models/football/nfl/entity/**"
      - "quant_sports_intel_models/football/nfl/fantasy/**"
      - "quant_sports_intel_models/football/nfl/ingest/**"
      - "quant_sports_intel_models/football/nfl/pit/**"
      # ⛔ NOT the whole `quant_sports_intel_models/**` tree, and the reason is measured rather than
      # asserted: over the two months to 2026-08-17, 691 commits touched that tree but only 299
      # touched the box-executed subtrees above — so a whole-tree filter would roughly 2.3× the box
      # deploys, almost all of it research churn (bake-off runners, ablation_results) that the box
      # never executes. `betting_ml/**`'s "wasteful but SAFE" reasoning does NOT carry over at that
      # multiple: a deploy drains running jobs, and INC-36 showed a deploy race taking the Dagster
      # daemon down for ~10 minutes. More deploys is more exposure to that, not free safety.
      #
      # ── the IMAGE's own build inputs ──────────────────────────────────────────────────────────
      # The root Dockerfile pins every pickle-fragile ML lib (sklearn/ngboost/lightgbm) and asserts
      # them against pyproject/uv.lock at build time. A pin BUMP that does not trigger a rebuild
      # leaves the box on the old versions while the repo says otherwise — the 2026-07-03
      # train/serve pickle-skew landmine, facing the delivery side.
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch: {}

# Serialize deploys — never two box deploys racing (singleton daemon).
concurrency:
  group: orchestration-cd
  cancel-in-progress: false

permissions:
  id-token: write       # for OIDC
  contents: read

jobs:
  deploy:
    name: Deploy to AWS box (SSM)
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy.sh on the box via SSM, wait, and surface the result
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # Run as ec2-user (owns ~/app, in the docker group, owns the crontab) — NOT
          # root (would dirty the repo + edit root's crontab).
          CMD='sudo -u ec2-user -H bash /home/ec2-user/app/services/dagster/aws/deploy.sh'
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "orchestration CD ${GITHUB_SHA::8}" \
            --parameters "commands=[\"$CMD\"],executionTimeout=[\"1800\"]" \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId=$CID — polling…"

          # INC-36 (2026-07-29) — THE POLL BUDGET MUST OUTLAST executionTimeout (1800s).
          # It was 120 polls (~20 min) against a 30-min executionTimeout. When deploy.sh ran
          # longer than 20 min (7/29: a HUNG intraday_schedule_job parked the drain loop for its
          # full 600s), the loop exited with a NON-TERMINAL status → the job failed → **the
          # orchestration-cd concurrency group RELEASED while the SSM command was still running
          # on the box** → the queued run launched a SECOND deploy.sh into a live one → docker
          # `removal of container … is already in progress` → auto-rollback (which then left
          # dagster-daemon down). The concurrency group serializes GitHub JOBS, not the async
          # SSM commands they spawn — so the budget has to cover the box-side worst case.
          # 190 polls * 10s = ~31.7 min > 1800s. Belt-and-braces: deploy.sh now also holds an
          # exclusive box-side lock, which is the authoritative guard.
          for _ in $(seq 1 190); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" \
              --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "  status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          # If we STILL have no terminal status, the command is (or may be) live on the box.
          # Cancel it so it cannot outlive this job and race the next queued deploy.
          case "${STATUS:-Pending}" in
            Success|Failed|Cancelled|TimedOut) ;;
            *)
              echo "::warning::No terminal SSM status after ~32 min — cancelling command $CID so it cannot race the next deploy."
              aws ssm cancel-command --command-id "$CID" --instance-ids "$INSTANCE_ID" || true
              ;;
          esac

          echo "----- deploy stdout -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text || true
          echo "----- deploy stderr -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Box deploy ended in status=$STATUS (deploy.sh auto-rolls back on a bad deploy; investigate the box)."
            exit 1
          fi
          echo "✅ Box deploy Success — main is live on the box."
