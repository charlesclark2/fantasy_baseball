name: dbt Build CI

on:
  push:
    branches: [main]
    paths:
      - 'dbt/models/**'
      - 'dbt/tests/**'
      - 'dbt/macros/**'
      - 'dbt/seeds/**'
      - 'dbt/snapshots/**'
      - 'dbt/dbt_project.yml'
      - 'dbt/profiles.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dbt/models/**'
      - 'dbt/tests/**'
      - 'dbt/macros/**'
      - 'dbt/seeds/**'
      - 'dbt/snapshots/**'
      - 'dbt/dbt_project.yml'
      - 'dbt/profiles.yml'

  # E11.24 (2026-08-14) — an ON-DEMAND door for PROVING the CI_WH repoint under real load.
  # WHY IT EXISTS: `dbt-build-ci` runs on `pull_request` only, and a promotion PR that changes
  # no MODEL selects nothing under `state:modified+`. The 2026-08-10 repoint was recorded as
  # "traffic moved" on exactly such a run — measured 2026-08-14, all 12 of its CI_WH statements
  # were `warehouse_size IS NULL` (cloud-services only, 0 bytes scanned), i.e. CI_WH has never
  # carried a billable statement and was never resumed. A run that builds nothing produces the
  # same "0 statements on COMPUTE_WH" whether or not the repoint works — a non-discriminating
  # proof. This trigger lets the operator run a real build on demand and settle it.
  workflow_dispatch:
    inputs:
      select:
        description: >-
          dbt selector to build on --target ci (leave as-is to prove the CI_WH repoint).
          `ref_teams` is a 32-row seed: it issues a real INSERT, so it OCCUPIES the warehouse —
          which a view-only selection would not, and occupation is the whole point.
        required: false
        default: 'ref_teams'

jobs:
  dbt-compile:
    name: dbt Compilation Check
    runs-on: ubuntu-latest
    # ⛔ Deliberately NOT run on workflow_dispatch. This job runs with NO --target, i.e. on the
    # PRODUCTION profile (COMPUTE_WH), so skipping it makes a verification dispatch touch CI_WH
    # and NOTHING ELSE. The query_history assertion then has an unambiguous failure signal: ANY
    # DBT_RW statement on COMPUTE_WH in the window means the repoint did not hold. (Measured
    # 2026-08-14 on the 08-11 00:31 push run, this job is 9 statements, all metadata-only,
    # 0 billable, 0 waits — so this is about keeping the window clean, not about cost.)
    if: github.event_name != 'workflow_dispatch'
    env:
      # PINNED (2026-07-20): was `latest`, which let the baseline-producing compile job
      # (push to main) and the PR build job run DIFFERENT fusion binaries (cache keyed on
      # the literal string, evicted independently) — cross-version manifest fingerprints
      # differ for EVERY test node, so `state:modified+` ballooned to all ~1,400 tests on
      # a 7-model PR (surfaced dead-source rot + 503-timed-out the warehouse). Bump this
      # pin deliberately; the first main merge after a bump republishes the baseline.
      DBT_FUSION_VERSION: 2.0.0-preview.200
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_rsa_key.pem
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache dbt-fusion binary
        id: cache-dbtf
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/dbt
          key: dbtf-${{ runner.os }}-${{ env.DBT_FUSION_VERSION }}

      - name: Install dbt-fusion
        if: steps.cache-dbtf.outputs.cache-hit != 'true'
        env:
          SHELL: /bin/bash
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --to ~/.local/bin --version "$DBT_FUSION_VERSION"

      - name: Create dbtf symlink
        run: ln -sf ~/.local/bin/dbt ~/.local/bin/dbtf

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_rsa_key.pem
          chmod 600 /tmp/snowflake_rsa_key.pem

      # INC-19 type-contract guard — RED (pure stdlib, no deps) if an incremental
      # feature model's generated ::double TYPE-PIN block drifted from its manifest
      # (the recurring NUMBER<->FLOAT HALT class). Also in the Python fast gate via
      # betting_ml/tests/test_type_contract_guard.py; duplicated here so a dbt-models-only
      # PR (which the Python CI paths filter skips) is still gated before merge.
      - name: Type-contract guard (INC-19 — no NUMBER<->FLOAT drift)
        run: python3 scripts/gen_type_contract.py --check

      - name: Compile dbt project
        run: dbtf compile --project-dir dbt --profiles-dir dbt

      # Story I.5 Task 1 (2026-06-15) — publish the compiled manifest as the state
      # baseline the PR build job diffs against for `state:modified+ --defer`. The
      # prior producer (dbt_daily_build.yml) was decommissioned to manual-only in the
      # Dagster migration and its artifacts had 7-day retention, so by ~2026-06-08 the
      # baseline was always expired and CI silently full-built all 117 models on every
      # PR. Producing it here on every push to main (the moment the DAG actually
      # changes) + 90-day retention keeps a fresh baseline available. Main-only so a
      # PR's manifest never overwrites the baseline. Bootstraps on the next merge to
      # main after this lands.
      - name: Publish manifest baseline (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: dbt/target/manifest.json
          retention-days: 90
          if-no-files-found: error

  dbt-build-ci:
    name: dbt Build (CI — state:modified+)
    runs-on: ubuntu-latest
    # workflow_dispatch is the CI_WH verification door (see the trigger comment above). It must
    # enter through THIS job and no other, because this is the only job that passes `--target ci`
    # — the target the repoint lives on.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
    env:
      # PINNED (2026-07-20): was `latest`, which let the baseline-producing compile job
      # (push to main) and the PR build job run DIFFERENT fusion binaries (cache keyed on
      # the literal string, evicted independently) — cross-version manifest fingerprints
      # differ for EVERY test node, so `state:modified+` ballooned to all ~1,400 tests on
      # a 7-model PR (surfaced dead-source rot + 503-timed-out the warehouse). Bump this
      # pin deliberately; the first main merge after a bump republishes the baseline.
      DBT_FUSION_VERSION: 2.0.0-preview.200
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_rsa_key.pem
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      # E11.24 — consumed by the `ci` target in dbt/profiles.yml (this job runs `--target ci`).
      # ⚠️ The `|| 'COMPUTE_WH'` is REQUIRED, not decorative: an unset GitHub secret interpolates
      # to an EMPTY STRING, and dbt's env_var() returns a default only for an UNSET var.
      # MEASURED: an empty value makes the `warehouse` key VANISH from the connection, Snowflake
      # falls back to DBT_RW's default warehouse (= COMPUTE_WH), and the repoint silently does
      # not happen while `dbt debug` and CI both report success. The fallback must live HERE —
      # profiles.yml's default cannot rescue an empty value, only an absent one.
      # ⛔ NOT on the dbt-compile job: it runs without --target, i.e. on the DEFAULT (production)
      # profile, so this var would be inert there. That job is NOT covered by this change.
      SNOWFLAKE_CI_WAREHOUSE: ${{ secrets.SNOWFLAKE_CI_WAREHOUSE || 'COMPUTE_WH' }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache dbt-fusion binary
        id: cache-dbtf
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/dbt
          key: dbtf-${{ runner.os }}-${{ env.DBT_FUSION_VERSION }}

      - name: Install dbt-fusion
        if: steps.cache-dbtf.outputs.cache-hit != 'true'
        env:
          SHELL: /bin/bash
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --to ~/.local/bin --version "$DBT_FUSION_VERSION"

      - name: Create dbtf symlink
        run: ln -sf ~/.local/bin/dbt ~/.local/bin/dbtf

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_rsa_key.pem
          chmod 600 /tmp/snowflake_rsa_key.pem

      - name: Download dbt manifest (from latest prod build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dbt/state
          run_id=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=dbt-manifest&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)] | .[0].workflow_run.id' \
            2>/dev/null) || run_id=""
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" \
              --repo ${{ github.repository }} \
              --name dbt-manifest \
              --dir dbt/state \
            && echo "Manifest downloaded from run $run_id" \
            || echo "Manifest download failed — will fall back to full build"
          else
            echo "No dbt-manifest artifact found — will fall back to full build"
          fi

      - name: Pre-build teardown (ensure clean CI schemas)
        run: |
          dbtf run-operation drop_ci_schemas \
            --target ci \
            --project-dir dbt \
            --profiles-dir dbt

      - name: Build modified models in CI schemas
        env:
          # Passed through the ENVIRONMENT, never interpolated into the script body — a
          # `${{ inputs.select }}` inside `run:` is a shell-injection sink. Empty on
          # pull_request (the `inputs` context is unpopulated there), so the `-n` test below
          # leaves the PR path byte-identical.
          VERIFY_SELECT: ${{ inputs.select }}
        run: |
          if [ -n "$VERIFY_SELECT" ]; then
            # E11.24 verification path (workflow_dispatch only). No --state/--defer: the point
            # is to build something REAL, not to diff against a baseline.
            echo "::notice title=CI_WH verification run::Building '$VERIFY_SELECT' on --target ci. Now assert in query_history that a BILLABLE statement (warehouse_size IS NOT NULL) ran on CI_WH and that DBT_RW ran nothing on COMPUTE_WH."
            dbtf build \
              --target ci \
              --project-dir dbt \
              --profiles-dir dbt \
              --select "$VERIFY_SELECT"
          elif [ -f dbt/state/manifest.json ]; then
            dbtf build \
              --target ci \
              --project-dir dbt \
              --profiles-dir dbt \
              --select state:modified+ \
              --state dbt/state \
              --defer
          else
            # Story I.5 Task 1 — surface the fallback LOUDLY (GitHub warning
            # annotation in the PR checks UI) instead of silently full-building all
            # ~117 models. A silent fallback hid a 6-week cost regression (the
            # decommissioned/expired manifest producer). Not a hard fail, so a
            # manifest-infra hiccup never blocks merges — but it's now visible.
            # Flip to `exit 1` if you'd rather hard-block once the producer is proven.
            echo "::warning title=CI manifest missing — full build::No dbt-manifest baseline found, so CI is FULL-BUILDING all models (expensive). Producer = 'Publish manifest baseline' on push to main (I.5 Task 1); it may not have run since this landed, or the 90d artifact expired. Merge to main to refresh the baseline."
            dbtf build \
              --target ci \
              --project-dir dbt \
              --profiles-dir dbt
          fi

      - name: Tear down CI schemas
        if: always()
        run: |
          dbtf run-operation drop_ci_schemas \
            --target ci \
            --project-dir dbt \
            --profiles-dir dbt
