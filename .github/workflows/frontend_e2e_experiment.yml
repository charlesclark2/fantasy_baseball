name: Frontend E2E (E9.66 measurement scaffold — DELETE BEFORE MERGE)

# ⛔ TEMPORARY. This file exists only to MEASURE the three candidate provisioning strategies for
# `frontend_e2e.yml` against each other on real runners, so E9.66 ships the one that measured best
# rather than the one that sounded best. It is deleted in the same story that created it; if you are
# reading this on `dev` or `main`, that deletion was missed — delete it.
#
# Dispatch-only, so it never fires on a push or a PR.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "container | runner-nodeps | container-4w"
        required: true
        type: string
      workers:
        description: "Playwright workers (blank = config default)"
        required: false
        type: string

# Keyed on the VARIANT so the three variants run concurrently instead of queueing behind each other.
concurrency:
  group: frontend-e2e-exp-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  # ── VARIANT A / C: the official Playwright container ────────────────────────────────────────
  container:
    if: ${{ inputs.variant == 'container' || inputs.variant == 'container-4w' }}
    name: "exp: container (${{ inputs.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prove the baked browser matches the runner
        run: |
          echo "node=$(node -v)  npm=$(npm -v)"
          echo "runner @playwright/test=$(node -p "require('@playwright/test/package.json').version")"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          ls /ms-playwright
      - name: Build (E2E environment)
        run: npm run e2e:build
      - name: Run E2E suite
        run: npx playwright test

  # ── VARIANT B: plain runner, browser cache, NO install-deps at all ──────────────────────────
  runner-nodeps:
    if: ${{ inputs.variant == 'runner-nodeps' }}
    name: "exp: runner, no install-deps"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The binary ONLY. No `--with-deps`, no `install-deps` — the question this variant answers is
      # whether the ubuntu-latest image (which ships Chrome and Edge) already carries every shared
      # library chromium links against.
      - name: Install Playwright browser binary (no deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build (E2E environment)
        run: npm run e2e:build
      - name: Run E2E suite
        run: npx playwright test
