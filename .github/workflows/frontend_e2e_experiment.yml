name: Frontend E2E (E9.66 measurement scaffold — DELETE BEFORE MERGE)

# ⛔ TEMPORARY. This file exists only to MEASURE the three candidate provisioning strategies for
# `frontend_e2e.yml` against each other on real runners, so E9.66 ships the one that measured best
# rather than the one that sounded best. It is deleted in the same story that created it; if you are
# reading this on `dev` or `main`, that deletion was missed — delete it.
#
# Triggered by a push to the story branch, path-gated to this file so an unrelated commit does not
# re-run it. All three variants are JOBS rather than dispatch inputs, deliberately: a new
# `workflow_dispatch` workflow is not dispatchable until it exists on the default branch, and
# running the variants as siblings off ONE commit makes them directly comparable — same code, same
# hour, same runner pool.

on:
  push:
    branches: [e9.66]
    paths:
      - ".github/workflows/frontend_e2e_experiment.yml"
      - "frontend/playwright.config.ts"

concurrency:
  group: frontend-e2e-exp
  cancel-in-progress: true

jobs:
  # ── VARIANT A: the official Playwright container, current worker count ──────────────────────
  container-2w:
    name: "A: container, 2 workers"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prove the baked browser matches the runner
        run: |
          echo "node=$(node -v)  npm=$(npm -v)"
          echo "runner @playwright/test=$(node -p "require('@playwright/test/package.json').version")"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          ls /ms-playwright
      - name: Build (E2E environment)
        run: npm run e2e:build
      - name: Run E2E suite
        run: npx playwright test

  # ── VARIANT B: plain runner, browser cache, NO install-deps at all ──────────────────────────
  runner-nodeps-2w:
    name: "B: runner no install-deps, 2 workers"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The binary ONLY. No `--with-deps`, no `install-deps` — the question this variant answers is
      # whether the ubuntu-latest image (which ships Chrome and Edge) already carries every shared
      # library chromium links against. If it does not, chromium fails to launch, loudly.
      - name: Install Playwright browser binary (no deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build (E2E environment)
        run: npm run e2e:build
      - name: Run E2E suite
        run: npx playwright test

  # ── VARIANT C: container at 4 workers — does the suite scale past 2? ────────────────────────
  container-4w:
    name: "C: container, 4 workers"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (E2E environment)
        run: npm run e2e:build
      - name: Run E2E suite
        run: npx playwright test
