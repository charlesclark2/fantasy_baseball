name: CI

# ⭐ E9.63b (2026-08-07) — `dev` ADDED to the pull_request trigger. Until now this workflow ran ONLY
# on PRs into `main`, and since every story branch PRs into `dev`, that meant a BACKEND PR GOT NO
# PYTHON TESTS AT ALL. Measured: PR #641 merged a full NF-W1 model bake-off into `dev` with nothing
# but a skipped Vercel build against it. The `dev` → `main` release PR was the only place backend
# code was ever tested, i.e. the first CI signal arrived after the code was already in `dev` and
# bundled with everyone else's.
#
# This does NOT make frontend PRs heavier: the `changes` job below already resolves a
# frontend/docs-only diff to `backend == false`, and every test job is gated on it. Verified on the
# live repo — PR #640 (frontend-only → `dev`) ran the E2E suite and Vercel and nothing else.
#
# `push` stays `main`-only on purpose. A push to `dev` happens seconds after its PR run, on the
# identical tree, and would just double every merge.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Widening the trigger means more runs in flight, so supersede rather than stack: a second push to
# a PR branch cancels the run for the commit it replaced. Deliberately PR-ONLY — a `main` run is the
# record of what was actually merged and must never be cancelled by a later one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # E9.7 — path gate. The three jobs below are REQUIRED status checks (branch protection),
  # so we must NOT skip them at the `on: paths:` level: a filtered-out workflow never posts
  # its check, leaving a required check "pending" forever → the PR can't merge (GitHub's
  # skipped-but-required gotcha). Instead this job detects whether anything OUTSIDE the
  # frontend/docs changed; the test jobs gate on it with `if:`. A job skipped via `if:` is
  # treated as PASSING by branch protection, so a frontend-only change still satisfies the
  # required checks WITHOUT spinning up the Python suites. (Keep it this way — do not convert
  # these to `on: paths:` while they remain required checks.)
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 🚨 E9.63b (2026-08-07) — `predicate-quantifier: every` IS LOad-BEARING AND WAS MISSING.
          # Without it this filter returned `true` for EVERY POSSIBLE DIFF since E9.7, including a
          # pure `frontend/**` one, so the "frontend changes skip the Python suites" behaviour this
          # job exists for has never once happened.
          #
          # The mechanism: dorny/paths-filter compiles each list entry into its OWN picomatch
          # matcher and defaults to `predicate-quantifier: some` — a file selects the filter if ANY
          # single pattern matches it. `'**'` matches every path, so `some` is satisfied before the
          # `!` lines are ever consulted; they subtract nothing. `every` is what makes them
          # subtractive: a file must match `'**'` AND `'!frontend/**'` AND `'!**/*.md'` AND
          # `'!docs/**'`.
          #
          # MEASURED against picomatch 4 with the action's own MatchOptions (`{dot: true}`):
          #                              some (was)   every (now)
          #   frontend/package.json         true         false
          #   docs/readme.md                true         false
          #   README.md                     true         false
          #   betting_ml/x.py               true         true
          #   pipeline/ops/y.py             true         true
          #
          # It hid because this workflow only ever triggered on `dev` → `main` release PRs, whose
          # accumulated diff always contains backend files — so the filter was never once asked a
          # question whose right answer was `false`. Confirmed on the live repo: zero skipped jobs
          # across the last 30 runs. Adding `dev` to the trigger above is what would have turned an
          # invisible defect into every frontend PR running six pytest shards.
          predicate-quantifier: 'every'
          # `backend` is true when any changed file is NOT purely frontend/docs.
          # `**` includes everything, then the `!` lines subtract the paths that
          # can never affect the Python test suites (the Next.js app + markdown/docs).
          filters: |
            backend:
              - '**'
              - '!frontend/**'
              - '!**/*.md'
              - '!docs/**'

      # Say what was decided. A gate whose verdict appears nowhere in the log is one nobody can
      # sanity-check from a run page — which is a large part of why the `some`/`every` defect above
      # went unnoticed for as long as it did.
      - name: Report the verdict
        run: |
          echo "backend=${{ steps.filter.outputs.backend }}"
          if [ "${{ steps.filter.outputs.backend }}" = "true" ]; then
            echo "→ Python suites WILL run (the diff touches something outside frontend/docs)"
          else
            echo "→ Python suites will SKIP (frontend/docs-only diff)"
          fi

  # E11.13 — fast gate: every test EXCEPT the `slow` Monte-Carlo calibration guards.
  #
  # SHARDED (2026-07-27 CI-hygiene profile). The gate had grown to ~2,360 tests / ~90s serial.
  # Profiling showed the cost is NOT slow tests (slowest single test = 4.5s, under the `@slow`
  # >5s rule) but per-worker COLLECTION: every xdist worker imports all ~175 test modules
  # before running its share, so `-n auto` burned 287s of CPU for 90s of work and was SLOWER
  # than `-n 4` on an 11-core box. Duplicated collection is a fixed cost per process, so the fix
  # is to give each process fewer tests to collect. Shards are DOMAIN-based so a red check
  # localises the blame ("football shard failed") before you open the log.
  #
  # The shard map lives in scripts/ci_shards.py — ONE source of truth, with `core` as a COMPUTED
  # catch-all, so a new test file joins the merge bar automatically and cannot escape coverage.
  # betting_ml/tests/test_fast_gate_hygiene.py proves the partition and pins this matrix.
  unit-tests-shard:
    name: Unit Tests (fast gate) — ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false   # one red domain must not hide the others — see all failures in one run
      matrix:
        # Keep in sync with SHARD_NAMES in scripts/ci_shards.py (guard test enforces it).
        shard: [football, baseball-models, prospect-milb, guards, serving-ops, core]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true   # shards install the same env 6× — cache makes setup the cheap part

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev-packages || uv sync

      - name: Run fast gate — ${{ matrix.shard }} shard
        run: |
          TARGETS=$(uv run python scripts/ci_shards.py --shard "${{ matrix.shard }}")
          # Belt-and-braces: pytest with NO file arguments falls back to `testpaths` and runs the
          # ENTIRE suite, so an empty list would silently turn one shard into a duplicate full
          # run instead of failing. ci_shards.py already exits non-zero here; check anyway.
          if [ -z "$TARGETS" ]; then
            echo "::error::shard ${{ matrix.shard }} produced no test targets"; exit 1
          fi
          echo "shard ${{ matrix.shard }} → $(echo "$TARGETS" | wc -w) test files"
          # $TARGETS is intentionally UNQUOTED: it is a space-separated file list that bash must
          # word-split into separate pytest arguments (GitHub runs `run:` under bash).
          # shellcheck disable=SC2086
          uv run pytest $TARGETS -m "not slow" -n auto --tb=short

  # Static checks that used to ride along in the single fast-gate job.
  static-checks:
    name: Static checks (syntax + ingest MERGE ban)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev-packages || uv sync

      - name: predict_today.py syntax check
        run: uv run python -m py_compile scripts/predict_today.py

      - name: Block MERGE patterns in ingest scripts
        run: |
          if grep -rE "MERGE[[:space:]]+INTO|WHEN[[:space:]]+MATCHED" scripts/ingest_*.py; then
            echo "ERROR: MERGE/WHEN MATCHED pattern found in scripts/ingest_*.py"
            echo "All ingestion must be append-only INSERT. See Epic T conventions."
            exit 1
          fi
          echo "OK — no MERGE patterns found in ingest scripts"

  # ⚠️ DO NOT RENAME — `Unit Tests (fast gate)` is the name a required status check references.
  # (Verified 2026-07-28: `main` currently has NO branch protection and NO rulesets, so nothing
  # mechanically blocks a red merge today — the gate is convention. The name is kept stable
  # anyway so turning protection ON is a one-click change with zero CI rework.)
  # Sharding the work into a matrix would otherwise leave such a check permanently pending (the
  # "skipped-but-required" gotcha the `changes` job above also works around). This job keeps the
  # exact name and simply rolls up the shards' results, so protection needs no change when
  # shards are added or renamed.
  unit-tests:
    name: Unit Tests (fast gate)
    runs-on: ubuntu-latest
    needs: [changes, unit-tests-shard, static-checks]
    if: always()

    steps:
      - name: Roll up fast-gate shard results
        run: |
          SHARDS="${{ needs.unit-tests-shard.result }}"
          STATIC="${{ needs.static-checks.result }}"
          CHANGES="${{ needs.changes.result }}"
          echo "changes=$CHANGES  shards=$SHARDS  static-checks=$STATIC"
          # A matrix job's `result` is `success` only when EVERY leg succeeded. `skipped` is a
          # pass: it means the `changes` filter found a frontend/docs-only diff. `changes` itself
          # is checked too — if IT failed, the shards would be `skipped` and this roll-up would
          # otherwise report a green gate for a suite that never ran.
          for r in "$CHANGES" "$SHARDS" "$STATIC"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::fast gate did not pass (changes=$CHANGES, shards=$SHARDS, static=$STATIC)"; exit 1 ;;
            esac
          done
          echo "fast gate GREEN"

  # E11.13 — slow gate: the heavy `slow`-marked Monte-Carlo PIT/coverage calibration guards.
  # Parallelised (-n auto) so the 3 ~75s totals tests overlap across workers (~96s vs ~250s
  # serial). Separate job so a slow-MC run never blocks the fast per-push gate, but it is
  # still REQUIRED for merge — these pin E2.3 totals + E5.2 strikeout calibration discipline.
  slow-tests:
    name: Unit Tests (slow — Monte-Carlo calibration)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev-packages || uv sync

      # The slow gate now also collects W12's pipeline-importing sensor-fire tests
      # (betting_ml/tests/test_e11_1_w12_sensor_fire.py, all @pytest.mark.slow). Importing
      # pipeline.sensors.* triggers pipeline/__init__.py → pipeline/assets/dbt_assets.py,
      # which reads dbt/target/manifest.json at IMPORT (the @dbt_assets decorator). That
      # file is a build artifact the runner lacks → FileNotFoundError. `dbtf parse` builds
      # it offline (profiles.yml has defaults for every env_var → no creds/connection),
      # mirroring orchestration_ci.yml's dagster-defs job. The fast gate stays light (no
      # non-slow test imports pipeline).
      - name: Cache dbt-fusion binary
        id: cache-dbtf
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/dbt
          key: dbtf-${{ runner.os }}-latest
      - name: Install dbt-fusion
        if: steps.cache-dbtf.outputs.cache-hit != 'true'
        env:
          SHELL: /bin/bash
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --to ~/.local/bin
      - name: Add dbtf to PATH
        run: |
          ln -sf ~/.local/bin/dbt ~/.local/bin/dbtf
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Generate dbt manifest (offline parse — no warehouse connection)
        run: dbtf parse --project-dir dbt --profiles-dir dbt

      # TD2 (2026-07-27) — `and not research`: the research/bake-off harness guards
      # (derivative_model_gate, line_microstructure, bakeoff_perside, f5_distribution) are NOT
      # imported by ANY serving, pipeline, or API code — they only execute when a human runs a
      # bake-off — so they no longer block a merge. They still run, nightly, in
      # research_tests.yml. What stays here is the math that runs LIVE: totals_distribution
      # (drawn per game on every daily serving write via totals_serving) + prop_pricing.
      # ⭐ SCOPED TO THE FILES THAT CARRY THE MARKER (2026-08-20). With no path arguments pytest
      # collects `testpaths` — measured, that is 10,659 tests IMPORTED to find 79, and xdist pays
      # that collection ONCE PER WORKER (the duplicated-collection cost in
      # docs/ci_fast_gate_profile.md). Handing it the 17 marker-carrying files drops collection
      # 11.04s -> 1.30s and this job's wall clock 36% (106.8s -> 68.8s locally; ~7m20s -> ~4m30s
      # here), which stops it being the gate's critical path — the E2E smoke shard is 4m25s.
      #
      # ⚠️ `-m "slow and not research"` IS STILL THE SELECTOR. The path list only narrows what gets
      # IMPORTED; it never decides what RUNS, and the two were verified to select the identical 80
      # tests. `--slow-paths` derives the list by AST-scanning for the marker, so it cannot drift,
      # and it EXITS NON-ZERO on an empty list — without that, no arguments would silently fall
      # back to `testpaths` and quietly restore the very collection this removes.
      #
      # ⛔ NOT SHARDED, and that is measured rather than assumed: once scoped, this job (~4m30s)
      # and the E2E smoke shard (4m25s) are neck and neck, so splitting it further would move the
      # whole gate by seconds. Shard it only if E2E gets faster first.
      - name: Run slow tests (LIVE-path Monte-Carlo calibration guards)
        run: |
          uv run pytest $(uv run python scripts/ci_shards.py --slow-paths) \
            -m "slow and not research" -n auto --tb=short

  model-smoke-test:
    name: Model Artifact Smoke Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev-packages || uv sync

      - name: Smoke test home_win model
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          uv run python -c "
          import numpy as np
          from betting_ml.utils.model_io import load_model
          m = load_model('home_win')
          p = m.predict_proba(np.zeros((1, m.n_features_in_)))[0, 1]
          assert 0.0 < p < 1.0, f'Bad probability: {p}'
          print(f'OK — p={p:.4f}, n_features={m.n_features_in_}')
          "



